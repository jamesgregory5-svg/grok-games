    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #fff;
      color: #111;
      font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .wrap {
      width: min(880px, calc(100% - 48px));
      margin: 0 auto;
      padding: 36px 0 28px;
      flex: 1;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
    }
    .mark {
      display: block;
      width: 28px;
      height: 28px;
      flex: none;
    }
    .wordmark {
      margin: 0;
      font-size: clamp(22px, 2.6vw, 30px);
      font-weight: 600;
      letter-spacing: -0.05em;
      line-height: 1;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }
    .card {
      border: 1px solid #e6e6e6;
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .thumb {
      height: 132px;
      background: var(--accent, #111);
    }
    .body {
      padding: 18px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .card h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    .card p {
      margin: 0 0 8px;
      font-size: 14px;
      line-height: 1.45;
      color: #444;
      flex: 1;
    }
    .play {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 16px;
      align-self: flex-start;
      background: #111;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .play:hover { filter: brightness(1.15); }
    footer {
      width: min(880px, calc(100% - 48px));
      margin: 0 auto 24px;
      color: #6a6a6a;
      font-size: 12px;
      letter-spacing: -0.01em;
    }
    @media (max-height: 640px) {
      .wrap { padding: 20px 0 16px; }
      header { margin-bottom: 20px; }
      .thumb { height: 84px; }
      .body { padding: 14px 16px 14px; gap: 6px; }
      footer { margin-bottom: 16px; }
    }
    @media (max-width: 600px) {
      .wrap, footer { width: calc(100% - 32px); }
    }
  
    header { justify-content: flex-start; }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .userbar {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .who {
      font-size: 13px;
      color: #444;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 28vw;
    }
    .signout {
      height: 32px;
      padding: 0 12px;
      background: #fff;
      color: #111;
      border: 1px solid #e6e6e6;
      border-radius: 8px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.02em;
      cursor: pointer;
    }
    .signout:hover { background: #f7f7f7; }
    .auth {
      width: min(360px, 100%);
    }
    .auth h2 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.04em;
    }
    .auth .lead {
      margin: 0 0 24px;
      font-size: 14px;
      line-height: 1.45;
      color: #444;
    }
    .auth form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .auth label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .auth input {
      height: 40px;
      padding: 0 12px;
      border: 1px solid #e6e6e6;
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      color: #111;
      background: #fff;
      outline: none;
    }
    .auth input:focus { border-color: #111; }
    .auth .error {
      margin: 0;
      min-height: 18px;
      font-size: 13px;
      font-weight: 500;
      color: #b42318;
    }
    .auth button[type="submit"] {
      height: 40px;
      margin-top: 4px;
      padding: 0 16px;
      background: #111;
      color: #fff;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.02em;
      cursor: pointer;
    }
    .auth button[type="submit"]:hover { filter: brightness(1.15); }
    .hidden { display: none !important; }
    @media (max-height: 640px) {
      .auth h2 { font-size: 18px; }
      .auth .lead { margin-bottom: 16px; }
      .auth form { gap: 10px; }
      .auth input, .auth button[type="submit"] { height: 36px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="#111" d="M12 1.15c.32 3.55 2.28 6.62 6.5 8.15-4.22 1.53-6.18 4.6-6.5 8.15-.32-3.55-2.28-6.62-6.5-8.15C9.72 7.77 11.68 4.7 12 1.15z"/>
        </svg>
        <h1 class="wordmark">GROK GAMES</h1>
      </div>
      <div class="userbar hidden" id="userbar">
        <span class="who" id="who"></span>
        <button type="button" class="signout" id="signout">Sign out</button>
      </div>
    </header>
    <section class="auth hidden" id="auth-panel">
      <h2 id="auth-title">Create account</h2>
      <p class="lead" id="auth-lead">One account per device. Choose a username and password to get started.</p>
      <form id="auth-form" autocomplete="on">
        <label>Username
          <input id="auth-user" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>
        </label>
        <label>Password
          <input id="auth-pass" name="password" type="password" autocomplete="current-password" required>
        </label>
        <label id="auth-confirm-wrap">Confirm password
          <input id="auth-confirm" name="confirm" type="password" autocomplete="new-password">
        </label>
        <p class="error" id="auth-error" role="alert"></p>
        <button type="submit" id="auth-submit">Create account</button>
      </form>
    </section>
    <main class="grid hidden" id="games"></main>
  </div>
  <footer>Fan-made game hub by James</footer>
  <script src="auth.js"></script>
  <script>
    /* Add a game: put a folder in games/ and add one object here. */
    const GAMES = [
      {
        id: "tour-sim",
        title: "Tour Sim",
        description: "A full golf career — tournaments, courses, and life on the tour.",
        href: "games/tour-sim/index.html",
        accent: "linear-gradient(160deg, #e8f3ea 0%, #9cbc8a 52%, #2f5a38 100%)"
      },
      {
        id: "city-sim",
        title: "City Sim",
        description: "An original open-world city sandbox set in Port Calloway.",
        href: "games/city-sim/index.html",
        accent: "linear-gradient(160deg, #ffd0e8 0%, #ff8a5b 48%, #6a2a8a 100%)"
      },
      {
        id: "holdem",
        title: "Hold'em",
        description: "Play-money Texas Hold'em. Climb as high as you can — your best bankroll is your score.",
        href: "games/holdem/index.html",
        accent: "linear-gradient(160deg, #e8f4ec 0%, #1f6b46 55%, #0e3d26 100%)"
      },
      {
        id: "grok-blast",
        title: "Grok Blast",
        description: "Drag gem pieces onto an 8×8 grid and chain row and column clears.",
        href: "games/grok-blast/index.html",
        accent: "linear-gradient(160deg, #f3e8ff 0%, #9b5de5 48%, #4ea8de 100%)"
      },
      {
        id: "blackjack",
        title: "Blackjack",
        description: "Play-money blackjack. Climb as high as you can — your best bankroll is your score.",
        href: "games/blackjack/index.html",
        accent: "linear-gradient(160deg, #e8f3ea 0%, #1f6b46 55%, #0e3d26 100%)"
      }
    ];

    const host = document.getElementById("games");
    const panel = document.getElementById("auth-panel");
    const userbar = document.getElementById("userbar");
    const who = document.getElementById("who");
    const titleEl = document.getElementById("auth-title");
    const leadEl = document.getElementById("auth-lead");
    const form = document.getElementById("auth-form");
    const userInput = document.getElementById("auth-user");
    const passInput = document.getElementById("auth-pass");
    const confirmWrap = document.getElementById("auth-confirm-wrap");
    const confirmInput = document.getElementById("auth-confirm");
    const errorEl = document.getElementById("auth-error");
    const submitBtn = document.getElementById("auth-submit");

    let cardsBuilt = false;

    function buildCards() {
      if (cardsBuilt) return;
      cardsBuilt = true;
      for (const g of GAMES) {
        const el = document.createElement("article");
        el.className = "card";
        el.innerHTML =
          '<div class="thumb" style="background:' + g.accent + '" aria-hidden="true"></div>' +
          '<div class="body">' +
            '<h2>' + g.title + '</h2>' +
            '<p>' + g.description + '</p>' +
            '<a class="play" href="' + g.href + '">Play</a>' +
          '</div>';
        host.appendChild(el);
      }
    }

    function showLauncher() {
      panel.classList.add("hidden");
      host.classList.remove("hidden");
      userbar.classList.remove("hidden");
      who.textContent = GrokAuth.currentUser() || "";
      buildCards();
    }

    function showAuth() {
      host.classList.add("hidden");
      userbar.classList.add("hidden");
      panel.classList.remove("hidden");
      errorEl.textContent = "";
      form.reset();
      const hasAccount = GrokAuth.hasAccount();
      if (hasAccount) {
        titleEl.textContent = "Sign in";
        leadEl.textContent = "This device is linked to one account.";
        confirmWrap.classList.add("hidden");
        confirmInput.required = false;
        confirmInput.value = "";
        submitBtn.textContent = "Sign in";
        passInput.autocomplete = "current-password";
      } else {
        titleEl.textContent = "Create account";
        leadEl.textContent = "One account per device. Choose a username and password to get started.";
        confirmWrap.classList.remove("hidden");
        confirmInput.required = true;
        submitBtn.textContent = "Create account";
        passInput.autocomplete = "new-password";
      }
      setTimeout(function () { try { userInput.focus(); } catch (e) {} }, 0);
    }

    function render() {
      if (GrokAuth.isSignedIn()) showLauncher();
      else showAuth();
    }

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      errorEl.textContent = "";
      const username = userInput.value;
      const password = passInput.value;
      const task = GrokAuth.hasAccount()
        ? GrokAuth.signIn(username, password)
        : GrokAuth.createAccount(username, password, confirmInput.value);
      task.then(render).catch(function (err) {
        errorEl.textContent = (err && err.message) ? err.message : "Something went wrong.";
      });
    });

    document.getElementById("signout").addEventListener("click", function () {
      GrokAuth.signOut();
      render();
    });

    render();
  </script>
</body>
</html>
