<html lang="en">

<title>Grok Tycoon — Grok Games</title>
<style>
:root{
  --ink:#161410; --muted:#6c665e; --line:#e4ddd2; --bg:#f4f0ea; --paper:#fffcf7;
  --soft:#efe9df; --good:#1f6b46; --bad:#9b2c2c; --gold:#b0863c; --navy:#1b2a38;
  --shadow:0 10px 30px rgba(40,30,16,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI","Inter Tight",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.mono{font-variant-numeric:tabular-nums}
.good{color:var(--good)} .bad{color:var(--bad)} .muted{color:var(--muted)} .gold{color:var(--gold)}
.hidden{display:none!important}

.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:8}
.brand{font-weight:750;letter-spacing:.14em;text-transform:uppercase;font-size:13px;text-decoration:none}
.brand:hover{opacity:.7}
.topbar h1{margin:0;font-size:16px;letter-spacing:.04em}
.kpis{display:flex;flex-wrap:wrap;gap:8px 16px;margin-left:auto;font-size:13px}
.kpis b{font-weight:750}
.top-actions{display:flex;gap:6px}

.btn{appearance:none;border:1px solid var(--ink);background:#fff;color:var(--ink);padding:7px 12px;border-radius:8px;font-size:13px;letter-spacing:.02em}
.btn:hover{background:#111;color:#fff}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#000}
.btn.gold{background:var(--ink);color:#fff}
.btn.danger{border-color:var(--bad);color:var(--bad);background:#fff}
.btn.danger:hover{background:var(--bad);color:#fff}
.btn.good{border-color:var(--good);color:var(--good)}
.btn.good:hover{background:var(--good);color:#fff}
.btn:disabled{opacity:.4;cursor:default;background:#fff;color:var(--ink)}
.btn.wide{width:100%;padding:11px 14px;font-weight:700}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}

/* Title */
.hero-wrap{min-height:100%;display:flex;flex-direction:column;max-width:1080px;margin:0 auto;padding:22px 18px 50px}
.hero-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.word{margin:0;letter-spacing:.18em;text-transform:uppercase;font-size:13px;font-weight:750}
.hero{margin-top:28px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:28px 28px 24px;box-shadow:var(--shadow)}
.hero h1{margin:0 0 8px;font-size:36px;letter-spacing:-.03em;line-height:1.1}
.hero .lede{margin:0 0 22px;color:var(--muted);max-width:40em;line-height:1.5}
.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:22px}
@media(max-width:800px){.hero-grid{grid-template-columns:1fr}.hero h1{font-size:28px}}
.menu-col{display:flex;flex-direction:column;gap:8px}
.scorebox{background:var(--soft);border-radius:12px;padding:14px 16px;font-size:14px}
.scorebox h3{margin:0 0 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.saves{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.save-row{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:13px}
.save-row .meta{color:var(--muted);font-size:12px}
.ach-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ach{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 8px;font-size:11px;color:var(--muted)}
.ach.on{border-color:var(--ink);color:var(--ink);font-weight:650}

/* Wizard */
.wizard{max-width:980px;margin:0 auto;padding:18px 16px 60px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.steps span.on{color:var(--ink);font-weight:750}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pick{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:12px;text-align:left;cursor:pointer}
.pick:hover{border-color:#111}
.pick.on{border-color:#111;box-shadow:inset 0 0 0 1px #111}
.pick h3{margin:0 0 4px;font-size:15px}
.pick p{margin:0;color:var(--muted);font-size:12px;line-height:1.4}
.pick .stat{margin-top:8px;font-size:12px}
.field{margin:10px 0}
.field label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px}

/* Play layout */
.play{display:grid;grid-template-columns:200px 1fr;min-height:100%}
@media(max-width:820px){.play{grid-template-columns:1fr}.sidenav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}}
.sidenav{background:var(--paper);border-right:1px solid var(--line);padding:10px 8px 24px;display:flex;flex-direction:column;gap:4px}
.sidenav button{appearance:none;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;color:var(--muted);font-size:13px}
.sidenav button.on,.sidenav button:hover{background:var(--soft);color:var(--ink);font-weight:700}
.main{padding:16px 18px 48px;max-width:1100px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-size:20px;font-weight:750;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.panel h2{margin:0 0 10px;font-size:15px;letter-spacing:.02em}
.panel h3{margin:0 0 8px;font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:650}
.news li{margin:0 0 8px;padding:0 0 8px;border-bottom:1px solid var(--line);list-style:none;font-size:13px;line-height:1.4}
.news{margin:0;padding:0}
.news .wk{color:var(--muted);font-size:11px;margin-right:6px}

/* Modals */
.modal{position:fixed;inset:0;background:rgba(20,16,12,.45);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none!important}
.sheet{background:var(--paper);border-radius:16px;max-width:560px;width:100%;max-height:min(86vh,780px);overflow:auto;padding:20px 20px 16px;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.sheet h2{margin:0 0 8px;font-size:20px}
.sheet p{line-height:1.5}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.choice{text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px}
.choice:hover{border-color:#111}
.choice b{display:block;margin-bottom:2px}
.choice span{display:block;color:var(--muted);font-size:12px}

.tip{position:fixed;z-index:50;max-width:260px;background:#161410;color:#fff;font-size:12px;line-height:1.4;padding:8px 10px;border-radius:8px;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s}
.tip.on{opacity:1;transform:none}

.tut{position:fixed;inset:0;background:rgba(20,16,12,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:18px}
.tut .sheet{margin-bottom:20px}

.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink);width:0}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:700px){.charts{grid-template-columns:1fr}}
canvas.chart{width:100%;height:140px;background:#fff;border:1px solid var(--line);border-radius:10px}

.footer-note{margin-top:22px;color:var(--muted);font-size:12px}
</style>
</head>

/* Grok Tycoon — simulation engine (browser + node) */

function clamp(n, a, b) {
  n = Number(n);
  if (!Number.isFinite(n)) return a;
  return n < a ? a : n > b ? b : n;
}
function lerp(a, b, t) { return a + (b - a) * t; }
function roundc(n) { return Math.round((Number(n) || 0) * 100) / 100; }
function fin(n, fallback) {
  n = Number(n);
  return Number.isFinite(n) ? n : (fallback == null ? 0 : fallback);
}
function pick(rng, arr) {
  if (!arr || !arr.length) return null;
  return arr[Math.floor(rng() * arr.length) % arr.length];
}
function pickN(rng, arr, n) {
  var copy = arr.slice();
  var out = [];
  while (copy.length && out.length < n) {
    out.push(copy.splice(Math.floor(rng() * copy.length), 1)[0]);
  }
  return out;
}
function uid(rng) {
  return "id" + Math.floor(rng() * 1e9).toString(36) + Math.floor(rng() * 1e9).toString(36);
}
function mulberry32(a) {
  a = a >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    var t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashSeed(s) {
  if (typeof s === "number" && Number.isFinite(s)) return s >>> 0;
  s = String(s == null ? "tycoon" : s);
  var h = 2166136261;
  for (var i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function chance(rng, p) { return rng() < p; }
function randRange(rng, a, b) { return a + (b - a) * rng(); }
function randInt(rng, a, b) { return a + Math.floor(rng() * (b - a + 1)); }
function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }

GT.money = function (n) {
  n = fin(n, 0);
  var neg = n < 0;
  var v = Math.abs(Math.round(n));
  var s = v.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg ? "-$" : "$") + s;
};
GT.moneyDec = function (n) {
  n = fin(n, 0);
  var neg = n < 0;
  var v = Math.abs(n);
  var whole = Math.floor(v);
  var dec = Math.round((v - whole) * 100);
  if (dec === 100) { whole += 1; dec = 0; }
  var s = whole.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg ? "-$" : "$") + s + "." + (dec < 10 ? "0" : "") + dec;
};
GT.fmtWeek = function (week) {
  week = Math.max(0, fin(week, 0) | 0);
  var year = Math.floor(week / 52) + 1;
  var w = week % 52;
  var month = Math.floor(w / 4);
  if (month > 11) month = 11;
  var names = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

};
GT.monthIndex = function (week) {
  var w = ((fin(week, 0) | 0) % 52);
  var m = Math.floor(w / 4);
  return m > 11 ? 11 : m;
};
GT.seasonOf = function (week) {
  var m = GT.monthIndex(week);
  if (m === 11 || m <= 1) return "winter";
  if (m <= 4) return "spring";
  if (m <= 7) return "summer";

};

/* ---------- helpers used by events and the tick ---------- */
function biz(s) { return GT.BIZ[s.businessId]; }
function hood(id) { return GT.HOOD[id] || GT.HOOD.midtown; }
function hasHook(s, h) {
  var b = biz(s);
  if (h === "perishable") return !!(b && b.perishable);
  return !!(b && b.hooks && b.hooks.indexOf(h) >= 0);
}
function addNews(s, text, kind) {
  s.news = s.news || [];
  s.news.unshift({week: s.week, text: String(text), kind: kind || "info"});
  if (s.news.length > 80) s.news.length = 80;
}
function spendCash(s, n) {
  n = fin(n, 0);
  if (n <= 0) return 0;
  s.cash = roundc(fin(s.cash) - n);
  return n;
}
function earnCash(s, n) {
  n = fin(n, 0);
  if (n <= 0) return 0;
  s.cash = roundc(fin(s.cash) + n);
  return n;
}
function bumpInv(s, frac) {
  s.products.forEach(function (p) {
    var add = Math.round(Math.max(0, p.stock) * frac);
    if (frac < 0) p.stock = Math.max(0, Math.round(p.stock * (1 + frac)));
    else p.stock += add;
  });
}
function bestStaff(s) {
  if (!s.staff || !s.staff.length) return null;
  return s.staff.slice().sort(function (a, b) { return (b.skill * (b.morale + 10)) - (a.skill * (a.morale + 10)); })[0];
}
function weeklyRent(s) {
  var t = 0;
  (s.locations || []).forEach(function (l) { t += fin(l.rent); });
  return t;
}
function totalDebt(s) {
  var t = fin(s.debtSpecial);
  (s.loans || []).forEach(function (l) { t += fin(l.balance); });
  return roundc(t);
}
function payLoans(s, amount) {
  amount = Math.min(fin(amount), fin(s.cash));
  if (amount <= 0) return 0;
  var left = amount;
  s.loans.sort(function (a, b) { return (b.rate || 0) - (a.rate || 0); });
  s.loans.forEach(function (l) {
    if (left <= 0) return;
    var p = Math.min(l.balance, left);
    l.balance = roundc(l.balance - p);
    left = roundc(left - p);
  });
  s.loans = s.loans.filter(function (l) { return l.balance > 0.5; });
  var paid = roundc(amount - left);
  spendCash(s, paid);
  if (s.hadDebt && totalDebt(s) < 1) GT.grant(s, "debtfree");
  return paid;
}
function payTax(s, amount) {
  amount = fin(amount);
  var fromReserve = Math.min(fin(s.taxReserve), amount);
  s.taxReserve = roundc(fin(s.taxReserve) - fromReserve);
  var rest = amount - fromReserve;
  if (rest > 0) spendCash(s, rest);
  s.taxOwed = Math.max(0, roundc(fin(s.taxOwed) - amount));
}
function addReview(s, stars, text) {
  stars = clamp(fin(stars, 3), 1, 5);
  s.reviews = s.reviews || [];
  s.reviews.unshift({week: s.week, stars: Math.round(stars * 10) / 10, text: text || ""});
  if (s.reviews.length > 40) s.reviews.length = 40;
  var sum = 0;
  s.reviews.forEach(function (r) { sum += r.stars; });
  s.avgReview = Math.round((sum / s.reviews.length) * 10) / 10;
  if (s.avgReview >= 4.8 && s.reviews.length >= 8) GT.grant(s, "five-star");
}
function avgReview(s) {
  if (s.avgReview) return s.avgReview;
  if (!s.reviews || !s.reviews.length) return 3.6;
  var sum = 0;
  s.reviews.forEach(function (r) { sum += r.stars; });
  return sum / s.reviews.length;
}
function inventoryValue(s) {
  var v = 0;
  (s.products || []).forEach(function (p) { v += fin(p.stock) * fin(p.unitCost, p.baseCost); });
  return v;
}
function staffPayroll(s) {
  var t = 0;
  (s.staff || []).forEach(function (p) { t += fin(p.wage); });
  return t;
}
function staffQuality(s) {
  if (!s.staff.length) return 42 + s.skills.ops * 2 + s.skills.craft * 2;
  var t = 0, w = 0;
  s.staff.forEach(function (p) {
    var m = 0.6 + 0.4 * (p.morale / 100);
    t += p.skill * m;
    w += 1;
  });
  return clamp(t / w, 1, 99);
}
function equipFactor(s) {
  if (!s.equipment.length) return 0.85;
  var t = 0;
  s.equipment.forEach(function (e) {
    var lv = (e.level || 1) / (e.levels || 4);
    t += (0.7 + 0.3 * lv) * (0.5 + 0.5 * fin(e.cond, 80) / 100);
  });
  return clamp(t / s.equipment.length, 0.4, 1.35);
}
function marketingFactor(s) {
  return clamp(0.75 + fin(s.marketingHeat) / 140, 0.6, 1.8);
}
function seasonFactor(s) {
  var b = biz(s);
  var se = GT.seasonOf(s.week);
  var m = (b.season && b.season[se]) || 1;
  if (s.flags.recession) m *= 0.78;
  if (s.flags.boom) m *= 1.16;
  if (s.flags.festival) m *= fin(s.flags.festivalMult, 1);
  if (s.flags.weatherMult) m *= s.flags.weatherMult;
  if (s.flags.partnerDemand) m *= s.flags.partnerDemand;
  return m;
}
function priceAttract(price, fair) {
  fair = Math.max(0.5, fin(fair, 1));
  var ratio = fin(price, fair) / fair;
  // 1.0 is fair. Below 1 increases volume, above decreases sharply.
  if (ratio <= 0.7) return 1.25;
  if (ratio >= 1.8) return 0.15;
  if (ratio < 1) return lerp(1.25, 1, (ratio - 0.7) / 0.3);
  return lerp(1, 0.15, Math.pow((ratio - 1) / 0.8, 1.2));
}
function fairPrice(p, s) {
  var q = clamp(fin(p.quality, s.quality), 5, 100);
  return roundc(p.basePrice * (0.7 + 0.6 * (q / 70)));
}

function companyAssets(s) {
  var v = fin(s.cash) + inventoryValue(s) + fin(s.taxReserve) + fin(s.personalCash);
  s.equipment.forEach(function (e) {
    v += (e.cost || 0) * (e.level || 1) * 0.45 * (fin(e.cond, 80) / 100);
  });
  s.locations.forEach(function (l) {
    if (l.owned) v += fin(l.propertyValue);
  });
  (s.properties || []).forEach(function (p) { v += fin(p.value) - fin(p.mortgage); });
  (s.apps || []).forEach(function (a) { v += fin(a.users) * 2.5; });
  if (s.users) v += fin(s.users) * 8;
  (s.liveGames || []).forEach(function (g) { v += fin(g.weeklyPeak) * 12; });
  return Math.max(0, v);
}
function trailingAnnual(s, field) {
  var rows = s.pnl || [];
  var n = Math.min(rows.length, 13);
  if (!n) return 0;
  var sum = 0;
  for (var i = rows.length - n; i < rows.length; i++) sum += fin(rows[i][field]);
  return (sum / n) * 52;
}
function companyValue(s) {
  var assets = companyAssets(s);
  var profit = trailingAnnual(s, "profit");
  var rev = trailingAnnual(s, "rev");
  if (!profit && !rev) {
    profit = fin(s.annualProfit);
    rev = fin(s.annualRevenue);
  }
  var growth = clamp(1 + fin(s.growthRate), 0.4, 2.5);
  var rep = 0.8 + fin(s.reputation) / 250;
  var confidence = clamp((s.week || 0) / 90, 0.1, 1);
  var multiple;
  var g = (biz(s) || {}).group;
  if (g === "digital") {
    multiple = (profit > 0 ? 6.5 : 2.4) * growth * rep;
    var userVal = fin(s.users) * (s.flags.saas || s.stage === "scale" ? 12 : 4) * confidence;
    var inc = (profit > 0 ? profit * multiple : rev * 1.1 * growth) * confidence;
    var digital = Math.max(2000, assets * 0.6 + inc + userVal);
    if (s.flags.public) digital *= 1.45;
    if (s.flags.unicorn) digital *= 2.3;
    return digital;
  }
  if (g === "property") {
    return Math.max(2000, assets * 1.05 + profit * 6 * rep * confidence);
  }
  multiple = (profit > 0 ? 2.8 : 0.8) * growth * rep;
  if (s.franchiseUnits > 0) multiple += Math.min(2.2, s.franchiseUnits * 0.12);
  var earn = (profit > 0 ? profit * multiple : Math.max(0, rev * 0.28)) * confidence;
  var v = Math.max(2000, assets * 0.75 + earn - totalDebt(s) * 0.55);
  if (s.flags.public) v *= 1.25;
  return v;
}
function founderEquity(s) {
  var e = fin(s.founderEquity, 1);
  return clamp(e, 0, 1);
}
function netWorth(s) {
  var eq = founderEquity(s);
  var firm = companyValue(s);
  var personal = fin(s.personalCash) + fin(s.personalInvestments);
  // If already sold or IPOed, cash was converted
  if (s.ended && (s.ending === "sold" || s.ending === "ipo")) {
    return fin(s.endingValue);
  }
  return Math.max(0, eq * firm + personal - fin(s.bgDebt));
}
GT.companyValue = companyValue;
GT.netWorth = netWorth;
GT.totalDebt = totalDebt;
GT.inventoryValue = inventoryValue;
GT.avgReview = avgReview;

function runInspection(s, r, bonus) {
  var score = s.quality * 0.5 + s.skills.ops * 4 + staffQuality(s) * 0.25 + fin(bonus);
  score += (s.flags.mentor ? 6 : 0);
  score += randRange(r, -8, 8);
  score = clamp(score, 0, 100);
  s.lastInspect = score;
  if (score >= 80) {
    s.healthGrade = "A";
    s.reputation = clamp(s.reputation + 4, 0, 100);
    GT.grant(s, "inspect-a");
    addNews(s, "Inspection score " + Math.round(score) + " — Grade A.");
  } else if (score >= 65) {
    s.healthGrade = "B";
    addNews(s, "Inspection score " + Math.round(score) + " — Grade B. Fine, not famous.");
  } else if (score >= 50) {
    s.healthGrade = "C";
    s.satisfaction = clamp(s.satisfaction - 8, 0, 100);
    s.reputation = clamp(s.reputation - 6, 0, 100);
    addNews(s, "Grade C. Demand will feel that sign in the window.", "alert");
  } else {
    s.healthGrade = "F";
    s.flags.capacityHit = 3;
    s.flags.capacityMult = 0.35;
    s.reputation = clamp(s.reputation - 14, 0, 100);
    spendCash(s, Math.min(750, s.cash));
    addNews(s, "You failed the inspection. A fine, and a short closure.", "alert");
  }
}

function makeStaff(s, r, opts) {
  opts = opts || {};
  var b = biz(s);
  var role = null;
  (b.roles || []).forEach(function (x) { if (x.id === opts.roleId) role = x; });
  if (!role) role = pick(r, b.roles) || {id:"hand", name:"Helper", baseWage:480, skill:"ops"};
  var name = opts.name || (pick(r, GT.FIRST) + " " + pick(r, GT.LAST));
  var skill = opts.skill != null ? opts.skill : randInt(r, 38, 78) + Math.round((s.skills.people - 5) * 1.2);
  return {
    id: uid(r),
    name: name,
    roleId: role.id,
    roleName: opts.roleName || role.name,
    skill: clamp(skill, 15, 96),
    potential: clamp(skill + randInt(r, 4, 22), 20, 99),
    wage: opts.wage != null ? opts.wage : roundc(role.baseWage * randRange(r, 0.9, 1.18)),
    morale: opts.morale != null ? opts.morale : randInt(r, 58, 82),
    weeks: 0,
    training: 0
  };
}

function acquireRival(s, comp, price, r) {
  price = Math.max(1000, fin(price));
  if (s.cash + locAvailable(s) < price) {
    addNews(s, "The acquisition needed " + GT.money(price) + " and you could not fund it.");
    return false;
  }
  var draw = Math.max(0, price - s.cash);
  if (draw > 0) {
    // auto tap LOC if any
    drawCredit(s, draw);
  }
  spendCash(s, Math.min(price, s.cash));
  comp.alive = false;
  comp.ownedByPlayer = true;
  s.reputation = clamp(s.reputation + 3, 0, 100);
  s.marketingHeat += 8;
  s.flags.acquired = (s.flags.acquired || 0) + 1;
  // absorb a little demand
  s.flags.acquireBoost = 12;
  GT.grant(s, "acquire");
  addNews(s, "You acquired " + comp.name + " for " + GT.money(price) + ".");
  return true;
}
function locAvailable(s) {
  var t = 0;
  (s.loans || []).forEach(function (l) {
    if (l.revolving) t += Math.max(0, l.limit - l.balance);
  });
  return t;
}
function drawCredit(s, amount) {
  amount = fin(amount);
  var got = 0;
  (s.loans || []).forEach(function (l) {
    if (amount <= 0 || !l.revolving) return;
    var room = Math.max(0, l.limit - l.balance);
    var d = Math.min(room, amount);
    l.balance = roundc(l.balance + d);
    earnCash(s, d);
    amount -= d;
    got += d;
  });
  return got;
}

GT.grant = function (s, id) {
  s.achievements = s.achievements || {};
  if (s.achievements[id]) return;
  s.achievements[id] = s.week;
  s.freshAchievements = s.freshAchievements || [];
  var def = null;
  GT.ACHIEVEMENTS.forEach(function (a) { if (a.id === id) def = a; });
  s.freshAchievements.push(def || {id:id, name:id, desc:""});
  addNews(s, "Achievement: " + ((def && def.name) || id), "ach");
};

/* ---------- create / seed ---------- */
function defaultLocation(b, hoodId, r) {
  var h = hood(hoodId || "midtown");
  var base = fin(b.rent, 0) / 4.333; // data rent is monthly
  var rent = b.mobile ? 0 : roundc(base * h.rentMult * randRange(r, 0.95, 1.08));
  return {
    id: "loc0",
    name: h.name,
    hoodId: h.id,
    rent: rent,
    size: 1,
    quality: 55,
    owned: false,
    weeks: 0
  };
}

GT.createGame = function (opts) {
  opts = opts || {};
  var seed = hashSeed(opts.seed != null ? opts.seed : (Date.now() + Math.random()));
  var r = mulberry32(seed);
  var bg = GT.BG[opts.backgroundId] || GT.BACKGROUNDS[0];
  var b = GT.BIZ[opts.businessId] || GT.BUSINESSES[0];
  var hoodId = opts.hoodId || pick(r, suggestedHoods(b.id)).id;
  var skills = {};
  ["ops","craft","sales","finance","people","tech"].forEach(function (k) {
    skills[k] = clamp(fin(bg.skills[k], 5) + fin((opts.skillBoost || {})[k]), 1, 10);
  });
  var loc = defaultLocation(b, hoodId, r);
  var products = b.products.map(function (p) {
    return {
      id: p.id,
      name: p.name,
      baseCost: p.baseCost,
      basePrice: p.basePrice,
      unitCost: p.baseCost,
      price: p.basePrice,
      quality: 55 + skills.craft * 2,
      stock: p.baseCost > 0 ? randInt(r, 40, 90) : 0,
      perish: p.perish || 0,
      sold: 0,
      disabled: false
    };
  });
  var equipment = (b.equipment || []).map(function (e) {
    return {id: e.id, name: e.name, cost: e.cost, level: 1, levels: e.levels || 4, cond: 86};
  });
  var marketing = {};
  GT.CHANNELS.forEach(function (c) { marketing[c.id] = 0; });

  var startCash = bg.cash;
  var spent = 0;
  var startCost = b.startup * randRange(r, 0.92, 1.05);
  // skill discounts
  startCost *= 1 - (skills.ops - 5) * 0.015;
  if (bg.id === "culinary" && b.group === "food") startCost *= 0.9;
  if (bg.id === "athlete" && (b.id === "gym" || b.id === "sports")) startCost *= 0.9;
  if (bg.id === "coder" && b.group === "digital") startCost *= 0.88;
  if (bg.id === "shopkid") startCost *= 0.94;
  startCost = Math.round(startCost);

  var s = {
    version: GT.VERSION,
    seed: seed,
    rngState: null,
    _seed0: seed,
    week: 0,
    name: String(opts.companyName || ("Harbor " + b.name)).slice(0, 40),
    founderName: String(opts.founderName || "You").slice(0, 28),
    backgroundId: bg.id,
    businessId: b.id,
    skills: skills,
    cash: startCash,
    personalCash: 0,
    personalInvestments: 0,
    bgDebt: bg.debt || 0,
    creditScore: bg.credit,
    loans: [],
    debtSpecial: 0,
    taxReserve: 0,
    taxOwed: 0,
    ytdProfit: 0,
    ytdRevenue: 0,
    ytdOpex: 0,
    annualProfit: 0,
    annualRevenue: 0,
    growthRate: 0,
    founderEquity: 1,
    investors: [],
    locations: [loc],
    products: products,
    staff: [],
    equipment: equipment,
    marketing: marketing,
    marketingHeat: 8,
    supplierId: "standard",
    shipments: [],
    quality: 55 + skills.craft * 2.2 + skills.ops,
    satisfaction: 62,
    reputation: 48 + (bg.id === "shopkid" || bg.id === "vet" ? 6 : 0),
    reviews: [],
    avgReview: 3.7,
    competitors: [],
    news: [],
    history: {cash: [], rev: [], profit: [], sat: [], worth: []},
    pnl: [],
    flags: {permitWeeks: 52, permitsOk: true},
    permitsOk: true,
    healthGrade: b.inspect ? "A" : null,
    rateEnv: 0.09,
    users: b.id === "tech" ? randInt(r, 40, 160) : 0,
    stage: b.id === "tech" || b.id === "game-studio" || b.id === "app-studio" ? "build" : "open",
    devPoints: 0,
    project: null,
    liveGames: [],
    apps: [],
    properties: [],
    members: 0,
    contracts: 0,
    franchiseUnits: 0,
    routeId: b.mobile ? "downtown" : null,
    achievements: {},
    freshAchievements: [],
    candidates: [],
    pendingEvent: null,
    ended: false,
    ending: null,
    endingText: null,
    endingValue: 0,
    hadDebt: false,
    revenueRunRate: 0,
    weeklyCost: 800,
    lastReport: null,
    tutorialStep: 0,
    trend: 50,
    hype: 50,
    collections: 0
  };

  // Pay startup cost, loan the gap if needed
  if (startCash >= startCost) {
    s.cash = roundc(startCash - startCost);
  } else {
    var gap = startCost - startCash + 1500;
    s.cash = 1500;
    s.loans.push(makeLoan("starter", gap, s, 1.05));
    s.hadDebt = true;
    addNews(s, "You financed the opening with a " + GT.money(gap) + " starter loan.");
  }
  s.products.forEach(function (p) {
    if (p.baseCost > 0) {
      var weeklyUnits = (b.baseRev / Math.max(1, b.products.length)) / Math.max(0.5, p.basePrice);
      p.stock = Math.max(40, Math.round(weeklyUnits * 3 * randRange(r, 0.85, 1.1)));
    }
  });
  // Keep a real operating cushion so opening week is not an instant fail
  var cushion = b.group === "digital" ? 18000 : Math.max(8000, Math.round(fin(b.rent, 0) / 4.333 * 4 + 4000));
  if (s.cash < cushion) {
    var gap = roundc(cushion - s.cash);
    var existing = s.loans[0];
    if (existing && !existing.revolving) {
      existing.balance = roundc(existing.balance + gap);
      existing.payment = roundc(amortize(existing.balance, existing.rate, existing.weeks || 104));
    } else {
      s.loans.push(makeLoan("starter", gap, s, 1.05));
      s.hadDebt = true;
    }
    s.cash = cushion;
    addNews(s, "A " + GT.money(gap) + " working-capital loan covers the first months of rent and stock.");
  }

  // starting staff: 1-2 depending on size
  var startN = b.startup > 60000 ? 2 : 1;
  if (b.id === "tech" || b.id === "game-studio" || b.id === "app-studio") startN = 0;
  if (b.id === "realestate") startN = 1;
  for (var i = 0; i < startN; i++) s.staff.push(makeStaff(s, r, {roleId: b.roles[Math.min(i, b.roles.length - 1)].id}));

  seedCompetitors(s, r);
  if (b.id === "realestate") seedStarterProperty(s, r);
  if (b.id === "game-studio") s.project = newProject(s, r, "debut");
  if (b.id === "app-studio") s.apps = [newApp(s, r, true)];
  if (b.id === "tech") { s.stage = "build"; s.devPoints = 8 + skills.tech * 2; }
  if (b.id === "gym" || b.id === "car-wash") s.members = randInt(r, 20, 60);
  if (b.id === "landscaping") s.contracts = randInt(r, 2, 6);

  refreshCandidates(s, r);
  addNews(s, s.name + " opens in " + loc.name + " as a " + b.name + ".");
  addNews(s, "Opening costs were " + GT.money(startCost) + ". Cash on hand: " + GT.money(s.cash) + ".");
  pushHistory(s, 0, 0);
  s._r = r;
  return s;
};

function suggestedHoods(bizId) {

    "coffee": ["downtown","midtown","campus","lakeside"],
    "restaurant": ["oldport","downtown","westhills","riverside"],
    "bakery": ["midtown","lakeside","oldport","campus"],
    "barbershop": ["midtown","lakeside","campus","mills"],
    "gym": ["midtown","westhills","downtown","lakeside"],
    "car-wash": ["airport","mills","midtown","riverside"],
    "landscaping": ["lakeside","westhills","riverside","mills"],

  };

GT.suggestedHoods = suggestedHoods;

function makeLoan(typeId, amount, s, rateMult) {
  var p = null;
  GT.LOAN_PRODUCTS.forEach(function (x) { if (x.id === typeId) p = x; });
  p = p || GT.LOAN_PRODUCTS[0];
  amount = Math.max(500, fin(amount));
  var rate = p.rate * (rateMult || 1) * (s && s.creditScore < 680 ? 1.15 : 1);
  var weeks = p.weeks || 0;
  var payment = weeks ? roundc(amortize(amount, rate, weeks)) : 0;
  return {
    id: typeId + "_" + Math.floor(Math.random() * 1e6),
    typeId: typeId,
    name: p.name,
    balance: roundc(amount),
    rate: rate,
    weeks: weeks,
    payment: payment,
    revolving: !!p.revolving,
    limit: p.revolving ? amount : 0,
    predatory: !!p.predatory,
    missed: 0
  };
}
function amortize(principal, apr, weeks) {
  // weekly payment for APR
  var i = apr / 52;
  if (i <= 0) return principal / weeks;
  var pow = Math.pow(1 + i, weeks);
  return principal * (i * pow) / (pow - 1);
}

function seedCompetitors(s, r) {
  var names = {
    "food-truck":["Silver Cart","Plaza Tacos","Night Window"],
    "coffee":["Second Cup Board","Northbrew","The Steep"],
    "restaurant":["Cedar Room","Port & Pine","Little Harbor"],
    "bakery":["Ovenway","Flour Street","Dawn Loaf"],
    "barbershop":["Union Cuts","Corner Chair","Fable Barber"],
    "gym":["Iron Row","Harbor Fit","West Hills Athletic"],
    "car-wash":["Jet Wash","Bright Bay","Suds Lane"],
    "landscaping":["Green Mile Co.","Yard & Line","North Lawn"],
    "sports":["Peak Cage","Harbor Training","Inside Edge"],
    "clothing":["Thread North","Plain Goods","After Hours Co."],
    "ecom":["Cart & Keep","North Shelf","Harbor Home Goods"],
    "sneakers":["Pair Room","Heat Locker","Kicks Annex"],
    "tech":["Lineal Labs","Port Cloud","Nimble Ledger"],
    "app-studio":["Pocket Mill","Quiet Apps","Third Build"],
    "game-studio":["Low Tide Games","Copper Lantern","Odd Harbor"],
    "realestate":["Keyline Realty","Dock Street Holdings","Westhill Partners"]
  };
  var list = (names[s.businessId] || ["Rival A","Rival B","Rival C"]).slice();
  s.competitors = pickN(r, list, 2 + (r() < 0.5 ? 1 : 0)).map(function (name) {
    return {
      name: name,
      alive: true,
      strength: randInt(r, 40, 75),
      priceBias: randRange(r, 0.88, 1.18),
      style: pick(r, ["cheap","balanced","premium"]),
      heat: randInt(r, 10, 40)
    };
  });
}
function seedStarterProperty(s, r) {
  // First building is part of the opening plan — sized so a reserve remains.
  var reserve = 9000;
  var down = Math.max(6000, Math.min(s.cash - reserve, 28000));
  if (s.cash < reserve + 6000) down = Math.max(4000, s.cash * 0.35);
  var val = Math.round(down / 0.22);
  var mort = val - down;
  spendCash(s, down);
  s.properties.push({
    id: uid(r),
    name: pick(r, ["12 Dock St","88 Willow","4 Harborview","901 Mills Loft"]),
    value: val,
    mortgage: mort,
    rate: s.rateEnv + 0.01,
    rent: roundc(val * 0.0009 * randRange(r, 0.95, 1.15)),
    cond: randInt(r, 60, 88),
    vacant: false,
    weeksVacant: 0
  });
  addNews(s, "You closed on a first property (" + GT.money(val) + ") with " + GT.money(down) + " down.");
}
function newProject(s, r, title) {
  var debut = title === "debut";
  return {
    name: debut ? pick(r, ["Docklight","Quiet Shift","Harbor Oddity","Second Tide"]) : pick(r, ["Winter Rule","Low Orbit","Copper City","Night Errand"]),
    phase: "concept",
    weeksIn: 0,
    quality: 30 + s.skills.craft * 3,
    budget: 0,
    needed: {concept: debut ? 2 : 3, production: debut ? randInt(r, 8, 12) : randInt(r, 12, 22), polish: debut ? 3 : randInt(r, 4, 7)},
    spent: 0,
    crunch: false
  };
}
function newApp(s, r, started) {
  return {
    id: uid(r),

    stage: started ? "live" : "build",

  };
}

function refreshCandidates(s, r) {
  var n = 3 + (s.skills.people >= 7 ? 1 : 0);
  s.candidates = [];
  for (var i = 0; i < n; i++) s.candidates.push(makeStaff(s, r));
}

function pushHistory(s, rev, profit) {
  s.history.cash.push(roundc(s.cash));
  s.history.rev.push(roundc(rev));
  s.history.profit.push(roundc(profit));
  s.history.sat.push(roundc(s.satisfaction));
  s.history.worth.push(roundc(netWorth(s)));
  if (s.history.cash.length > 520) {
    ["cash","rev","profit","sat","worth"].forEach(function (k) { s.history[k].shift(); });
  }
}

function rngOf(s) {
  if (s._r) return s._r;
  // reseed from seed + week for stability if _r lost (saves)
  s._r = mulberry32(hashSeed(s.seed + ":" + s.week + ":" + Math.round(fin(s.cash))));
  return s._r;
}

/* ---------- weekly tick ---------- */
function competitorPressure(s) {
  var p = 1;
  s.competitors.forEach(function (c) {
    if (!c.alive) return;
    p += (c.strength / 400) * (c.style === "cheap" ? 0.12 : 0.07);
  });
  if (s.flags.acquireBoost) p *= 0.86;
  return p;
}

function tickCompetitors(s, r) {
  s.competitors.forEach(function (c) {
    if (!c.alive) return;
    c.heat = clamp(c.heat + randInt(r, -6, 6), 0, 100);
    if (s.flags.recession) c.strength = clamp(c.strength + randInt(r, -3, 1), 20, 95);
    else if (s.flags.boom) c.strength = clamp(c.strength + randInt(r, -1, 3), 20, 95);
    else c.strength = clamp(c.strength + randInt(r, -2, 2), 20, 95);
    // react to player prices: if player is expensive, cheap rivals gain; if player undercuts, they may discount
    var avgBias = 0, n = 0;
    s.products.forEach(function (p) {
      avgBias += p.price / Math.max(0.5, fairPrice(p, s));
      n++;
    });
    var pb = n ? avgBias / n : 1;
    if (pb > 1.2 && c.style === "cheap") c.strength = clamp(c.strength + 1, 20, 95);
    if (pb < 0.9 && r() < 0.2) { c.priceBias = Math.max(0.8, c.priceBias - 0.03); c.strength = clamp(c.strength - 1, 20, 95); }
    if (c.strength < 22 && r() < 0.08) {
      c.alive = false;
      addNews(s, c.name + " closed their doors.");
    }
  });
}

function tickStaff(s, r) {
  var fire = [];
  s.staff.forEach(function (p) {
    p.weeks = (p.weeks || 0) + 1;
    if (p.training > 0) {
      p.training--;
      p.skill = clamp(p.skill + 1.4, 1, p.potential || 99);
      p.morale = clamp(p.morale + 1, 0, 100);
    }
    // wage fairness
    var fair = 480 + p.skill * 4.2;
    if (p.wage < fair * 0.85) p.morale = clamp(p.morale - 2.2, 0, 100);
    else if (p.wage > fair * 1.1) p.morale = clamp(p.morale + 0.6, 0, 100);
    else p.morale = clamp(p.morale - 0.2 + (s.skills.people - 5) * 0.08, 0, 100);
    if (s.flags.recession) p.morale = clamp(p.morale - 0.4, 0, 100);
    if (s.backgroundId === "vet") p.morale = clamp(p.morale + 0.25, 0, 100);
    if (p.flight && r() < p.flight) fire.push(p.id);
    else if (p.morale < 28 && r() < 0.12) fire.push(p.id);
    p.flight = p.flight ? p.flight * 0.85 : 0;
  });
  if (fire.length) {
    s.staff = s.staff.filter(function (p) {
      if (fire.indexOf(p.id) >= 0) {
        addNews(s, p.name + " quit.", "alert");
        return false;
      }
      return true;
    });
  }
}

function tickEquipment(s, r) {
  s.equipment.forEach(function (e) {
    e.cond = clamp(fin(e.cond, 80) - randRange(r, 0.15, 0.7), 0, 100);
    if (e.cond < 20 && r() < 0.15) {
      e.cond = clamp(e.cond - 10, 0, 100);
      addNews(s, e.name + " is failing. Repair or replace it.", "alert");
    }
  });
}

function tickMarketing(s) {
  var spend = 0;
  GT.CHANNELS.forEach(function (c) {
    spend += fin(s.marketing[c.id]);
  });
  // heat approaches spend-driven target
  var target = Math.min(90, Math.sqrt(Math.max(0, spend)) * 1.1);
  // fit bonus
  var b = biz(s);
  GT.CHANNELS.forEach(function (c) {
    var w = fin(s.marketing[c.id]);
    if (w <= 0) return;
    var fit = !c.fit.length || c.fit.indexOf(s.businessId) >= 0 || c.fit.indexOf(b.group) >= 0;
    target += fit ? w / 800 : w / 1600;
  });
  s.marketingHeat = clamp(s.marketingHeat * 0.82 + target * 0.28, 0, 100);
  if (s.flags.viralBoost) {
    s.marketingHeat = clamp(s.marketingHeat + 8, 0, 100);
    s.flags.viralBoost--;
    if (s.flags.viralBoost <= 0) delete s.flags.viralBoost;
  }
  return spend;
}

function perishStock(s) {
  var lost = 0;
  if (!biz(s).perishable) return 0;
  s.products.forEach(function (p) {
    if (!p.perish) return;
    var spoil = Math.ceil(p.stock * (0.02 + 0.015 * p.perish));
    if (p.sold > 0 && p.stock > p.sold * 2.6) spoil += Math.ceil((p.stock - p.sold * 2.6) * 0.06);
    spoil = Math.min(p.stock, spoil);
    p.stock -= spoil;
    lost += spoil * fin(p.unitCost, p.baseCost);
  });
  return lost;
}

function receiveShipments(s) {
  var arrived = [];
  var pending = [];
  (s.shipments || []).forEach(function (sh) {
    sh.weeksLeft--;
    if (sh.weeksLeft <= 0) arrived.push(sh);
    else pending.push(sh);
  });
  arrived.forEach(function (sh) {
    var p = s.products.filter(function (x) { return x.id === sh.productId; })[0];
    if (p) {
      p.stock += sh.qty;
      p.unitCost = roundc((p.unitCost * 0.3 + sh.unitCost * 0.7));
      p.quality = clamp(p.quality * 0.7 + sh.quality * 0.3, 5, 100);
    }
  });
  s.shipments = pending;
  return arrived;
}

function applyFlagTimers(s) {
  ["capacityHit","festival","moving","acquireBoost"].forEach(function (k) {
    if (s.flags[k] > 0) {
      s.flags[k]--;
      if (s.flags[k] <= 0) {
        delete s.flags[k];
        if (k === "capacityHit") delete s.flags.capacityMult;
        if (k === "festival") delete s.flags.festivalMult;
      }
    }
  });
  if (s.flags.recession) {
    s.flags.recession--;
    if (s.flags.recession <= 0) {
      delete s.flags.recession;
      delete s.flags.recessionCut;
      delete s.flags.buyDiscount;
      addNews(s, "The downturn eases. Harborline spends a little more freely.");
    }
  }
  if (s.flags.boom) {
    s.flags.boom--;
    if (s.flags.boom <= 0) {
      delete s.flags.boom;
      delete s.flags.wagePress;
    }
  }
  if (s.flags.partner) {
    s.flags.partner--;
    if (s.flags.partner <= 0) {
      delete s.flags.partner;
      delete s.flags.partnerCut;
      delete s.flags.partnerDemand;
      addNews(s, "The partnership run ends.");
    }
  }
  if (s.flags.lawsuit) {
    s.flags.lawsuit--;
    if (s.flags.lawsuit <= 0) {
      var r = rngOf(s);
      if (r() < (s.flags.lawsuitRisk || 0.4)) {
        var c = 2500 + r() * 7000;
        spendCash(s, Math.min(c, s.cash));
        s.reputation = clamp(s.reputation - 5, 0, 100);
        addNews(s, "The lawsuit landed against you for " + GT.money(c) + ".", "alert");
      } else {
        addNews(s, "The lawsuit was dropped.");
      }
      delete s.flags.lawsuit;
      delete s.flags.lawsuitRisk;
    }
  }
  if (s.flags.permitWeeks != null) {
    s.flags.permitWeeks--;
    if (s.flags.permitWeeks <= 0) {
      s.permitsOk = false;
      addNews(s, "A permit has lapsed. Renew it in the Finance desk.", "alert");
    }
  }
  if (s.flags.licenseFee) spendCash(s, s.flags.licenseFee);
}

function demandModifiers(s) {
  var qF = 0.6 + 0.7 * (clamp(s.quality, 5, 100) / 100);
  var sat = 0.75 + 0.4 * (s.satisfaction / 100);
  var rep = 0.8 + 0.4 * (s.reputation / 100);
  var revw = 0.85 + 0.07 * (avgReview(s) - 3.5);
  var locF = 0;
  s.locations.forEach(function (l) {
    var h = hood(l.hoodId);
    locF += 0.9 + (h.traffic - 1) * 0.55 + (h.spend - 1) * 0.3;
  });
  locF = locF / Math.max(1, s.locations.length);
  if (biz(s).mobile && s.routeId) {
    var h = hood(s.routeId);
    locF = 0.9 + (h.traffic - 1) * 0.6 + (h.spend - 1) * 0.3;
  }
  var mkt = marketingFactor(s);
  var season = seasonFactor(s);
  var comp = 1 / competitorPressure(s);
  var locCount = Math.sqrt(Math.max(1, s.locations.length + fin(s.franchiseUnits) * 0.4));
  var online = s.flags.online ? 1.14 : 1;
  var sk = 1 + (s.skills.sales - 5) * 0.035 + (s.skills.ops - 5) * 0.02;
  return clamp(qF * sat * rep * revw * locF * mkt * season * comp * locCount * online * sk, 0.2, 2.8);
}

function demandForProduct(s, p, share) {
  var fair = fairPrice(p, s);
  var attr = priceAttract(p.price, fair);
  var dollars = biz(s).baseRev * demandModifiers(s) * share * attr;
  var units = dollars / Math.max(0.5, p.price);
  if (p.disabled) units = 0;
  return Math.max(0, units);
}

function capacityUnits(s) {
  var need = biz(s).startup > 60000 ? 3 : 2;
  if (biz(s).group === "digital") need = 2;
  var founder = 0.45 + s.skills.ops * 0.04 + s.skills.craft * 0.03;
  var staffF = founder + (s.staff.length / need) * 0.7;
  staffF *= 0.75 + staffQuality(s) / 220;
  staffF *= equipFactor(s);
  if (s.flags.capacityMult) staffF *= s.flags.capacityMult;
  if (!s.permitsOk) staffF *= 0.35;
  if (s.healthGrade === "C") staffF *= 0.85;
  if (s.healthGrade === "F") staffF *= 0.4;
  staffF *= 1 + (s.locations.length - 1) * 0.4;
  staffF *= 1 + (s.skills.ops - 5) * 0.03;
  return clamp(staffF, 0.28, 1.65);
}

function specialTick(s, r, report) {
  var b = biz(s);
  var extraRev = 0, extraCost = 0;
  if (b.id === "tech") {
    var eng = s.staff.filter(function (p) { return p.roleId === "eng" || p.roleId === "des"; });
    var pts = eng.reduce(function (a, p) { return a + p.skill / 18; }, s.skills.tech * 0.4);
    s.devPoints = fin(s.devPoints) + pts;
    if (s.stage === "build") {
      extraRev += 520 + s.skills.tech * 35 + s.skills.sales * 20; // contracting while you build
    }
    if (s.stage === "build" && s.devPoints >= 36) {
      s.stage = "launched";
      s.users = Math.max(s.users, 180);
      s.quality = clamp(s.quality + 8, 5, 100);
      addNews(s, "The product is live. Now it has to earn users.");
      report.lines.push("Product launched.");
    }
    if (s.stage === "launched" || s.stage === "scale") {
      extraRev += 350 + s.skills.sales * 15; // setup and services
      var churn = clamp(0.06 - (s.quality - 50) / 800 - s.skills.people * 0.001, 0.015, 0.12);
      var growth = (marketingFactor(s) - 0.75) * 0.035 + s.devPoints / 14000 + (s.quality - 50) / 1600;
      if (s.flags.recession) growth *= 0.5;
      if (s.flags.breakout) growth += 0.025;
      if (s.flags.online || s.flags.national) growth += 0.005;
      growth = clamp(growth, -0.03, 0.035);
      var capU = (s.flags.national ? 400000 : s.flags.online ? 90000 : 35000) * (s.flags.unicorn ? 2.4 : 1);
      var damp = Math.max(0.08, 1 - s.users / capU);
      s.users = Math.max(0, Math.min(capU, Math.round(s.users * (1 - churn + growth * damp))));
      var arpu = s.products[0] ? s.products[0].price / 4.3 : 8; // weekly
      extraRev += s.users * arpu * clamp(s.quality / 70, 0.4, 1.3);
      if (s.users > 4000) s.stage = "scale";
    }
    s.weeklyCost = s.weeklyCost; // burn is mostly payroll
  }
  if (b.id === "app-studio") {
    s.apps.forEach(function (app) {
      if (app.stage === "build") {
        app.dev += 4 + s.skills.tech + staffQuality(s) / 20;
        if (app.dev >= 36) {
          app.stage = "live";
          app.users = randInt(r, 200, 900);
          addNews(s, app.name + " is live in the store.");
        }
      } else {
        var g = (app.quality / 90) * (marketingFactor(s) / 1.2) * randRange(r, 0.85, 1.15);
        if (r() < 0.02 + s.marketingHeat / 1200) {
          g *= 1.5;
          addNews(s, app.name + " got a featured slot this week.");
        }
        var capA = (s.flags.national ? 160000 : s.flags.online ? 70000 : 28000) * (s.flags.unicorn ? 2.2 : 1);
        var damp = Math.max(0.1, 1 - app.users / capA);
        var net = clamp((0.03 + g * 0.03) * damp, -0.04, 0.03);
        app.users = Math.max(0, Math.min(capA, Math.round(app.users * (1 + net))));
        app.weeklyRev = app.users * 0.32 * clamp(app.quality / 80, 0.4, 1.25) * clamp(app.rating / 4, 0.4, 1.2);
        extraRev += app.weeklyRev;
      }
    });
  }
  if (b.id === "game-studio" && s.project) {
    extraRev += 700 + staffQuality(s) * 6 + s.skills.craft * 18; // contract / work-for-hire while in production
    var prod = s.project;
    var labor = staffQuality(s) / 18 + s.staff.length * 0.35 + s.skills.craft * 0.15 + s.skills.tech * 0.15;
    if (prod.crunch) { labor *= 1.35; s.staff.forEach(function (p) { p.morale = clamp(p.morale - 3.5, 0, 100); }); }
    prod.weeksIn++;
    prod.quality = clamp(prod.quality + labor * 0.45 + randRange(r, -0.4, 0.8), 10, 99);
    prod.budget += staffPayroll(s) * 0.2;
    var need = prod.needed[prod.phase] || 4;
    if (prod.weeksIn >= need) {
      if (prod.phase === "concept") { prod.phase = "production"; prod.weeksIn = 0; addNews(s, s.project.name + " enters production."); }
      else if (prod.phase === "production") { prod.phase = "polish"; prod.weeksIn = 0; addNews(s, s.project.name + " is in polish."); }
      else if (prod.phase === "polish") {
        // launch
        var rating = clamp(2.5 + prod.quality / 28 + randRange(r, -0.4, 0.4), 1, 5);
        var open = Math.round(260 + prod.quality * 22 * marketingFactor(s) * randRange(r, 0.8, 1.15));
        s.liveGames.push({name: prod.name, rating: rating, weekly: open, weeklyPeak: open, weeks: 0, quality: prod.quality});
        addNews(s, prod.name + " launched to " + rating.toFixed(1) + " reviews. Opening week interest is solid.");
        addReview(s, rating, "Launch week for " + prod.name + ".");
        s.project = null;
      }
    }
  }
  if (b.id === "game-studio") {
    s.liveGames.forEach(function (g) {
      g.weeks++;
      var decay = g.weeks < 3 ? 0.8 : g.weeks < 10 ? 0.9 : 0.955;
      decay *= 0.94 + clamp(g.rating, 1, 5) / 100;
      g.weekly = Math.max(10, Math.round(g.weekly * Math.min(0.975, decay)));
      extraRev += g.weekly * (s.products[0] ? s.products[0].price : 16) * 0.32;
    });
  }
  if (b.id === "gym" || b.id === "car-wash") {
    var price = s.products[0] ? s.products[0].price : 30;
    var cap = 28 + s.locations.length * 46 + equipFactor(s) * 40 + s.staff.length * 10;
    var join = Math.round((marketingFactor(s) * s.reputation / 55) * (5 + s.skills.sales * 0.7) * seasonFactor(s) / (0.85 + price / 38));
    var stretch = s.members > cap * 0.85 ? 0.03 : 0;
    var churn = clamp(0.045 + stretch + (price / 180) - (s.satisfaction - 50) / 900 - (equipFactor(s) - 0.8) / 12, 0.015, 0.16);
    s.members = clamp(Math.round(s.members * (1 - churn) + join), 0, cap);
    var weeklyDues = price / (b.id === "gym" ? 4.3 : 4.3);
    extraRev += s.members * weeklyDues;
    report.lines.push(s.members + " members (" + Math.round(churn * 1000) / 10 + "% churn).");
  }
  if (b.id === "landscaping") {
    if (GT.seasonOf(s.week) !== "winter" && r() < 0.35) s.contracts += 1;
    if (GT.seasonOf(s.week) === "winter") {
      // contracts drop unless snow product priced
      if (r() < 0.15) s.contracts = Math.max(0, s.contracts - 1);
    }
    var capC = s.staff.length * 4 + equipFactor(s) * 4;
    s.contracts = Math.min(s.contracts, Math.round(capC) + 2);
    extraRev += s.contracts * 180 * (0.8 + staffQuality(s) / 200);
  }
  if (b.id === "realestate") {
    extraRev += biz(s).baseRev * demandModifiers(s) * 0.7 + s.skills.sales * 30;
    var rates = s.rateEnv;
    s.properties.forEach(function (p) {
      p.value = Math.max(20000, p.value * (1 + randRange(r, -0.004, 0.006) + (s.flags.recession ? -0.006 : 0) + (s.flags.boom ? 0.004 : 0)));
      if (p.vacant) {
        p.weeksVacant++;
        extraCost += 40;
        if (r() < 0.2 + s.skills.sales * 0.03) { p.vacant = false; p.weeksVacant = 0; addNews(s, p.name + " is leased again."); }
      } else {
        extraRev += p.rent;
        if (r() < 0.03) { p.vacant = true; addNews(s, "A tenant left " + p.name + "."); }
        if (r() < 0.08) {
          var rep = 200 + r() * 900;
          extraCost += rep;
          p.cond = clamp(p.cond - 4, 10, 100);
        } else p.cond = clamp(p.cond - 0.15, 10, 100);
      }
      var interest = p.mortgage * (p.rate || rates) / 52;
      var prin = Math.min(p.mortgage, p.rent * 0.25);
      extraCost += interest + prin;
      p.mortgage = Math.max(0, p.mortgage - prin);
    });
  }
  if (b.id === "sneakers") {
    s.hype = clamp(s.hype + randInt(r, -6, 6) + (s.marketingHeat - 30) / 12 + (s.skills.sales - 5) * 0.3, 10, 100);
    var priceF = 1;
    if (s.products[0]) {
      var fair = fairPrice(s.products[0], s);
      priceF = priceAttract(s.products[0].price, fair);
    }
    var vol = biz(s).baseRev * demandModifiers(s) * capacityUnits(s) * (0.75 + s.hype / 200) * priceF;
    var margin = clamp(0.28 + (s.hype - 50) / 400 + (s.quality - 50) / 500, 0.16, 0.42);
    extraRev += vol;
    extraCost += vol * (1 - margin);
    // keep product stocks moving for the UI
    s.products.forEach(function (p, i) {
      p.sold = Math.max(1, Math.round(vol / Math.max(1, p.price) * (i === 0 ? 0.45 : 0.27)));
      p.stock = Math.max(8, Math.round((p.stock || 20) * 0.7 + p.sold * 1.4));
    });
    if (r() < 0.3) report.lines.push("Drop week. Hype is " + Math.round(s.hype) + ", take is " + GT.money(vol) + ".");
  }
  if (b.id === "clothing") {
    s.trend = clamp(s.trend + randInt(r, -5, 5), 10, 100);
    if (s.week > 0 && s.week % 13 === 12) {
      // markdown leftovers
      s.products.forEach(function (p) {
        if (p.id === "drop" && p.stock > 20) {
          var dump = Math.round(p.stock * 0.4);
          extraRev += dump * p.price * 0.5;
          p.stock -= dump;
          report.lines.push("Seasonal markdown on leftover drop stock.");
        }
      });
    }
  }
  if (b.id === "food-truck") {
    // fuel
    extraCost += 90 + (s.routeId === "airport" ? 40 : 0);
  }
  if (b.id === "ecom") {
    // returns
    extraCost += fin(report._gross || 0) * 0.04;
  }
  return {rev: extraRev, cost: extraCost};
}

function loanTick(s, report) {
  var paid = 0, interest = 0, missed = false;
  // student / bg debt: small weekly
  if (s.bgDebt > 0) {
    var bgPay = Math.min(s.bgDebt, 85);
    if (s.cash >= bgPay) {
      spendCash(s, bgPay);
      s.bgDebt = roundc(s.bgDebt - bgPay * 0.7);
      paid += bgPay;
    }
  }
  s.loans.forEach(function (l) {
    var int = l.balance * (l.rate / 52);
    interest += int;
    l.balance = roundc(l.balance + int);
    var due = l.revolving ? int + Math.min(l.balance * 0.02, l.balance) : l.payment;
    due = Math.min(due, l.balance);
    if (s.cash >= due && due > 0) {
      spendCash(s, due);
      l.balance = roundc(Math.max(0, l.balance - due));
      paid += due;
      l.missed = 0;
      s.creditScore = clamp(s.creditScore + 0.08, 300, 850);
    } else if (due > 0) {
      l.missed = (l.missed || 0) + 1;
      missed = true;
      s.creditScore = clamp(s.creditScore - (l.predatory ? 8 : 5), 300, 850);
      report.alerts.push("Missed a payment on " + l.name + ".");
    }
  });
  s.loans = s.loans.filter(function (l) { return l.balance > 0.5 || l.revolving; });
  if (s.hadDebt && totalDebt(s) < 1 && s.bgDebt < 1) GT.grant(s, "debtfree");
  if (s.creditScore >= 800) GT.grant(s, "credit800");
  report.expenses.debt = roundc(paid);
  report.expenses.interest = roundc(interest);
  return {paid: paid, missed: missed};
}

function taxTick(s, profit, report) {
  // accrue 21% of weekly profit (if positive)
  if (profit > 0) {
    var acc = profit * 0.21;
    s.taxOwed = roundc(fin(s.taxOwed) + acc);
    // auto-set-aside 15% if finance skill high and cash allows
  }
  // quarterly payment weeks: 12, 25, 38, 51
  var w = s.week % 52;
  if (w === 12 || w === 25 || w === 38 || w === 51) {
    var due = fin(s.taxOwed);
    if (due > 10) {
      var reserve = fin(s.taxReserve);
      var pay = Math.min(due, reserve + Math.max(0, s.cash * 0.8));
      if (pay >= due * 0.95) {
        payTax(s, due);
        s.creditScore = clamp(s.creditScore + 1, 300, 850);
        report.lines.push("Quarterly taxes paid: " + GT.money(due) + ".");
        report.expenses.tax = due;
      } else {
        payTax(s, pay);
        s.taxOwed = roundc(s.taxOwed * 1.04 + 50);
        s.creditScore = clamp(s.creditScore - 4, 300, 850);
        report.alerts.push("Short on taxes. Penalty applied.");
      }
    }
  }
  // year roll
  if (w === 51) {
    s.annualProfit = s.ytdProfit;
    s.annualRevenue = s.ytdRevenue;
    var prev = fin(s._prevAnnual, s.annualRevenue);
    s.growthRate = prev > 0 ? (s.annualRevenue - prev) / prev : 0;
    s._prevAnnual = s.annualRevenue;
    s.ytdProfit = 0;
    s.ytdRevenue = 0;
    s.ytdOpex = 0;
  }
}

function maybeEvent(s, r) {
  if (s.pendingEvent) return;
  if (s.week < 2) return;
  var p = 0.18 + (s.flags.recession ? 0.04 : 0);
  if (r() > p) return;
  var pool = GT.EVENTS.filter(function (e) {
    if (e.minWeek && s.week < e.minWeek) return false;
    if (e.requires && !e.requires(s)) return false;
    return true;
  });
  if (!pool.length) return;
  // weighted
  var tot = 0;
  pool.forEach(function (e) { tot += e.w || 1; });
  var x = r() * tot, acc = 0, pickE = pool[0];
  for (var i = 0; i < pool.length; i++) {
    acc += pool[i].w || 1;
    if (x <= acc) { pickE = pool[i]; break; }
  }
  var text = typeof pickE.text === "function" ? pickE.text(s) : pickE.text;
  s.pendingEvent = {
    id: pickE.id,
    name: pickE.name,
    text: text,
    choices: pickE.choices.map(function (c) { return {id: c.id, label: c.label, rec: c.rec}; })
  };
}

GT.resolveEvent = function (s, choiceId) {
  if (!s.pendingEvent) return s;
  var def = null;
  GT.EVENTS.forEach(function (e) { if (e.id === s.pendingEvent.id) def = e; });
  var ch = def && def.choices.filter(function (c) { return c.id === choiceId; })[0];
  if (!ch) ch = def && def.choices[0];
  var r = rngOf(s);
  if (ch && ch.fn) ch.fn(s, r);
  if (s.pendingEvent.id === "recession") GT.grant(s, "recession");
  s.pendingEvent = null;
  if (s.flags.autoSell && s.flags.pendingBuyout) GT.sellCompany(s, s.flags.pendingBuyout);
  return s;
};

function checkSoftGoals(s) {
  var nw = netWorth(s);
  if (nw >= 1e6) GT.grant(s, "million");
  if (nw >= 1e7) GT.grant(s, "net10m");
  if (nw >= 1e9) GT.grant(s, "billion");
  if (s.locations.length >= 3) GT.grant(s, "locs3");
  if (s.franchiseUnits >= 5) GT.grant(s, "franchise5");
  if (s.staff.length >= 5) GT.grant(s, "staff5");
  if (s.staff.length >= 20) GT.grant(s, "staff20");
  if (s.week >= 520) GT.grant(s, "decade");
}

function maybeBankrupt(s, report) {
  if (s.ended) return;
  // If cash negative, try LOC, then emergency MCA if credit allows
  if (s.cash >= 0) return;
  var need = Math.ceil(-s.cash + 200);
  var got = drawCredit(s, need);
  if (s.cash >= 0) {
    report.alerts.push("Drew " + GT.money(got) + " on your credit line.");
    return;
  }
  // one-time emergency loan, never stack predatory advances
  var hasPred = s.loans.some(function (l) { return l.predatory; });
  if (!hasPred && s.creditScore >= 620 && totalDebt(s) < companyValue(s) * 0.7 && !s.flags.usedEmergency) {
    var amt = Math.min(8000, Math.max(need, 2000));
    s.loans.push(makeLoan("starter", amt, s, 1.2));
    earnCash(s, amt);
    s.hadDebt = true;
    s.flags.usedEmergency = true;
    s.creditScore = clamp(s.creditScore - 4, 300, 850);
    report.alerts.push("Emergency loan of " + GT.money(amt) + " to cover the shortfall.");
    if (s.cash >= 0) return;
  }
  // still negative
  s.cash = roundc(s.cash);
  if (s.cash < 0) GT.endGame(s, "bankrupt");
}

GT.endGame = function (s, kind, detail) {
  if (s.ended) return s;
  s.ended = true;
  s.ending = kind;
  var nw = netWorth(s);
  if (kind === "bankrupt") {
    s.endingValue = 0;
    s.endingTitle = "Bankruptcy";
    s.endingText = "The cash ran out, and no lender would extend another dollar. " + s.name + " closes in " + GT.fmtWeek(s.week) + ". You leave with the lesson, and a clean-but-painful credit file.";
    GT.grant(s, "bankrupt");
  } else if (kind === "sold") {
    var gross = fin(detail, companyValue(s));
    var afterDebt = Math.max(0, gross - totalDebt(s) - fin(s.taxOwed) * 0.2);
    var take = afterDebt * founderEquity(s);
    s.cash = 0;
    s.personalCash = fin(s.personalCash) + take;
    s.endingValue = s.personalCash;
    s.endingTitle = "Sold";
    s.endingText = "You sold " + s.name + " for " + GT.money(gross) + ". After debt and your ownership share, you walk away with " + GT.money(take) + " in " + GT.fmtWeek(s.week) + ".";
    GT.grant(s, "sold");
  } else if (kind === "ipo") {
    var val = companyValue(s);
    var soldFrac = 0.25;
    var proceeds = val * soldFrac * founderEquity(s); // founder sells a slice, company also raises — founder personal
    // Dilute slightly, cash to personal + company
    var companyRaise = val * 0.2;
    s.founderEquity = founderEquity(s) * (1 - 0.2);
    earnCash(s, companyRaise);
    s.personalCash = fin(s.personalCash) + proceeds;
    s.flags.public = true;
    s.endingValue = netWorth(s);
    s.endingTitle = "Initial Public Offering";
    s.endingText = s.name + " goes public at a " + GT.money(val) + " valuation in " + GT.fmtWeek(s.week) + ". You sold a slice for " + GT.money(proceeds) + " and still own " + Math.round(s.founderEquity * 100) + "%.";
    GT.grant(s, "ipo");
  } else if (kind === "decade") {
    s.endingValue = nw;
    s.endingTitle = "Ten Years";
    s.endingText = "Ten years in. " + s.name + " is still standing. Net worth: " + GT.money(nw) + ". You can keep going, or call it a career.";
    GT.grant(s, "decade");
    s.ended = false; // allow continue; mark offered
    s.flags.decadeOffered = true;
    s.ended = false;
    return s;
  } else if (kind === "millionaire") {
    s.endingValue = nw;
    s.endingTitle = "Millionaire";
    s.endingText = "Your stake is worth " + GT.money(nw) + ". You made it over a million. Keep building or cash out when you like.";
    GT.grant(s, "million");
    s.ended = false;
    s.flags.millionOffered = true;
    return s;
  } else if (kind === "billionaire") {
    s.endingValue = nw;
    s.endingTitle = "Billionaire";
    s.endingText = "The number has nine zeroes. " + s.name + " is a Harborline legend — and then some. Net worth: " + GT.money(nw) + ".";
    GT.grant(s, "billion");
    s.ended = false;
    s.flags.billionOffered = true;
    return s;
  }
  return s;
};

GT.sellCompany = function (s, price) {
  return GT.endGame(s, "sold", price);
};

GT.canIPO = function (s) {
  var val = companyValue(s);
  return !s.ended && !s.flags.public && s.week >= 156 && val >= 8000000 && (s.annualRevenue >= 1500000 || fin(s.ytdRevenue) > 400000 && s.week % 52 > 30) && s.reputation >= 55 && avgReview(s) >= 3.6;
};

GT.goPublic = function (s) {
  if (!GT.canIPO(s)) return {ok: false, why: "The market is not ready. You need year 4+, a serious valuation, and real revenue."};
  GT.endGame(s, "ipo");
  s.ended = false; // IPO is a milestone; company continues as public
  s.flags.public = true;
  return {ok: true};
};

GT.advanceWeek = function (s) {
  if (s.ended) return {state: s, report: null};
  if (s.pendingEvent) return {state: s, report: null, blocked: true, event: s.pendingEvent};
  var r = rngOf(s);
  // bump week at start of operations after planning of "this coming week"
  var report = {week: s.week, lines: [], alerts: [], revenue: 0, cogs: 0, expenses: {}, profit: 0, sold: 0};

  receiveShipments(s);
  var mktSpend = tickMarketing(s);
  report.expenses.marketing = mktSpend;
  spendCash(s, mktSpend);

  tickStaff(s, r);
  tickEquipment(s, r);
  tickCompetitors(s, r);

  var spoilage = perishStock(s);
  report.expenses.spoilage = roundc(spoilage);

  var cap = capacityUnits(s);
  var gross = 0, cogs = 0, unitsSold = 0;
  var satAcc = 0, satW = 0;

  // Standard product sales (some types add extraRev and may skip physical units)
  var skipStd = false;
  if (s.businessId === "tech" || s.businessId === "app-studio" || s.businessId === "game-studio" || s.businessId === "realestate" || s.businessId === "sneakers") skipStd = true;

  if (!skipStd) {
    var weights = s.products.map(function (p, idx) {
      if (p.disabled) return 0;
      if ((s.businessId === "gym" || s.businessId === "car-wash") && (p.id === "mem" || p.id === "club")) return 0;
      return idx === 0 ? 0.5 : 0.5 / Math.max(1, s.products.length - 1);
    });
    var wsum = weights.reduce(function (a, b) { return a + b; }, 0) || 1;
    s.products.forEach(function (p, idx) {
      var share = (weights[idx] / wsum) * Math.min(1.35, cap);
      var demand = demandForProduct(s, p, share);
      var units = demand;
      var rushUnits = 0;
      var rushCost = 0;
      if (p.baseCost > 0.05) {
        units = Math.min(units, Math.max(0, p.stock));
        var unmet = Math.floor(Math.max(0, demand - units));
        if (s.businessId === "sneakers" && unmet > 0) {
          var rc = fin(p.unitCost, p.baseCost) * 1.2;
          var can = Math.floor(Math.max(0, s.cash - staffPayroll(s) - weeklyRent(s)) / Math.max(0.01, rc));
          rushUnits = Math.min(unmet, Math.max(0, can));
          rushCost = rushUnits * rc;
        }
      }
      units = Math.max(0, Math.floor(units));
      p.sold = units + rushUnits;
      p.stock = Math.max(0, p.stock - units);
      var rev = p.sold * p.price;
      var cost = units * fin(p.unitCost, p.baseCost) + rushCost;
      if (s.flags.partnerCut) rev *= (1 - s.flags.partnerCut);
      if (s.flags.shrink) cost += rev * s.flags.shrink;
      gross += rev;
      cogs += cost;
      unitsSold += units;
      var fair = fairPrice(p, s);
      var valueFeel = clamp(70 + (p.quality - 50) * 0.6 - (p.price / fair - 1) * 40, 10, 100);
      satAcc += valueFeel * units;
      satW += units;
    });
  }

  report._gross = gross;
  var special = specialTick(s, r, report);
  gross += fin(special.rev);
  report.expenses.special = roundc(fin(special.cost));
  spendCash(s, fin(special.cost));

  // online channel fee
  if (s.flags.online) {
    var fee = gross * 0.04 + 35;
    report.expenses.onlineFee = roundc(fee);
    spendCash(s, fee);
  }
  // franchise royalty income
  if (s.franchiseUnits > 0) {
    var roy = s.franchiseUnits * (120 + s.reputation * 2) * (s.flags.recession ? 0.8 : 1);
    gross += roy;
    report.lines.push(s.franchiseUnits + " franchise units paid " + GT.money(roy) + " in royalties.");
  }

  earnCash(s, gross);
  spendCash(s, cogs);
  report.revenue = roundc(gross);
  report.cogs = roundc(cogs);
  report.sold = unitsSold;

  var wages = staffPayroll(s);
  if (s.flags.wagePress) wages *= s.flags.wagePress;
  report.expenses.wages = roundc(wages);
  spendCash(s, wages);

  var rent = weeklyRent(s);
  report.expenses.rent = rent;
  spendCash(s, rent);

  var util = (biz(s).mobile ? 40 : 90) * s.locations.length + s.staff.length * 8;
  report.expenses.utilities = roundc(util);
  spendCash(s, util);

  // auto inventory reminder is player's job; small holding cost
  var hold = inventoryValue(s) * 0.004;
  report.expenses.holding = roundc(hold);
  spendCash(s, hold);

  loanTick(s, report);

  // satisfaction & quality drift
  var servedFeel = satW ? satAcc / satW : s.satisfaction;
  var staffFeel = staffQuality(s);
  var waitFeel = cap >= 0.8 ? 6 : cap >= 0.5 ? 0 : -8;
  s.satisfaction = clamp(s.satisfaction * 0.72 + servedFeel * 0.18 + staffFeel * 0.08 + waitFeel, 0, 100);
  // quality: equipment, supplier, craft
  var sup = GT.SUPPLIERS.filter(function (x) { return x.id === s.supplierId; })[0] || GT.SUPPLIERS[1];
  var qTarget = 45 + s.skills.craft * 3 + staffQuality(s) * 0.2 + (sup.quality || 0) + equipFactor(s) * 8;
  s.quality = clamp(s.quality * 0.85 + qTarget * 0.15, 5, 100);
  s.products.forEach(function (p) {
    p.quality = clamp(p.quality * 0.8 + s.quality * 0.2, 5, 100);
  });
  s.reputation = clamp(s.reputation * 0.97 + (s.satisfaction * 0.6 + avgReview(s) * 8) * 0.03, 0, 100);

  if (r() < 0.35) {
    var stars = clamp(avgReview(s) * 0.3 + (s.satisfaction / 20) + randRange(r, -0.8, 0.8), 1, 5);
    var phrases = stars >= 4.5 ? ["Really well run. I'll be back.","Worth the price."]
      : stars >= 3.5 ? ["Solid. A few rough edges.","Did the job."]
      : ["Not what I hoped.","Slow, and it showed."];
    addReview(s, stars, pick(r, phrases));
  }

  var opex = 0;
  Object.keys(report.expenses).forEach(function (k) { opex += fin(report.expenses[k]); });
  var profit = roundc(report.revenue - report.cogs - opex);
  report.profit = profit;
  report.expensesTotal = roundc(opex);
  s.ytdProfit = roundc(fin(s.ytdProfit) + profit);
  s.ytdRevenue = roundc(fin(s.ytdRevenue) + report.revenue);
  s.ytdOpex = roundc(fin(s.ytdOpex) + opex);
  s.revenueRunRate = roundc(s.revenueRunRate * 0.8 + report.revenue * 0.2);
  s.weeklyCost = roundc(s.weeklyCost * 0.7 + opex * 0.3);
  if (profit > 0) GT.grant(s, "first-profit");
  if (profit > 0 && s.satisfaction >= 90) GT.grant(s, "perfect-week");

  taxTick(s, profit, report);
  applyFlagTimers(s);

  // mid-year annualized figures for valuation if first year
  if (s.week < 52) {
    var weeksLive = Math.max(1, s.week + 1);
    s.annualRevenue = s.ytdRevenue * (52 / weeksLive);
    s.annualProfit = s.ytdProfit * (52 / weeksLive);
  }

  s.pnl.push({week: s.week, rev: report.revenue, cogs: report.cogs, opex: report.expensesTotal, profit: profit, cash: s.cash});
  if (s.pnl.length > 520) s.pnl.shift();
  pushHistory(s, report.revenue, profit);

  s.week += 1;
  s._r = mulberry32(hashSeed(s.seed + ":w" + s.week + ":" + Math.round(s.cash * 10) + ":" + s.staff.length));

  checkSoftGoals(s);
  maybeBankrupt(s, report);
  if (!s.ended) {
    if (s.week >= 520 && !s.flags.decadeOffered) GT.endGame(s, "decade");
    var nw = netWorth(s);
    if (nw >= 1e9 && !s.flags.billionOffered) GT.endGame(s, "billionaire");
    else if (nw >= 1e6 && !s.flags.millionOffered) GT.endGame(s, "millionaire");
  }

  maybeEvent(s, rngOf(s));
  if (s.week % 4 === 0) refreshCandidates(s, rngOf(s));

  // sanitize
  s.cash = roundc(fin(s.cash));
  s.quality = clamp(fin(s.quality, 50), 5, 100);
  s.satisfaction = clamp(fin(s.satisfaction, 50), 0, 100);
  if (!Number.isFinite(s.cash)) s.cash = 0;

  report.cash = s.cash;
  report.netWorth = netWorth(s);
  report.event = s.pendingEvent;
  s.lastReport = report;
  return {state: s, report: report, event: s.pendingEvent};
};

/* ---------- player actions ---------- */
GT.suppliers = function () { return GT.SUPPLIERS; };

GT.setPrice = function (s, productId, price) {
  price = clamp(fin(price), 0.25, 100000);
  s.products.forEach(function (p) { if (p.id === productId) p.price = roundc(price); });
  return s;
};
GT.setAllPricesMult = function (s, mult) {
  mult = clamp(fin(mult), 0.4, 2.5);
  s.products.forEach(function (p) { p.price = roundc(Math.max(0.25, p.basePrice * mult)); });
  return s;
};
GT.setSupplier = function (s, id) {
  var ok = GT.SUPPLIERS.filter(function (x) { return x.id === id; })[0];
  if (ok) s.supplierId = id;
  return s;
};
GT.orderStock = function (s, productId, qty) {
  qty = Math.max(0, Math.round(fin(qty)));
  if (!qty) return {ok: false, why: "No quantity."};
  var p = s.products.filter(function (x) { return x.id === productId; })[0];
  if (!p || p.baseCost <= 0.05) return {ok: false, why: "That item is not stocked that way."};
  var sup = GT.SUPPLIERS.filter(function (x) { return x.id === s.supplierId; })[0] || GT.SUPPLIERS[1];
  var unit = roundc(p.baseCost * sup.costMult);
  var cost = unit * qty;
  if (s.cash < cost) return {ok: false, why: "Not enough cash. Need " + GT.money(cost) + "."};
  spendCash(s, cost);
  var lead = sup.lead;
  if (s.businessId === "sneakers" || s.businessId === "ecom") lead = Math.min(lead, 1);
  if (s.businessId === "sneakers") lead = 0;
  if (rngOf(s)() > sup.reliability && lead > 0) lead += 1;
  var q = clamp(s.quality + sup.quality, 5, 100);
  s.shipments.push({productId: p.id, qty: qty, unitCost: unit, quality: q, weeksLeft: lead});
  addNews(s, "Ordered " + qty + " " + p.name + " from " + sup.name + " for " + GT.money(cost) + (lead ? (" (" + lead + " wk)") : " (arrives this week)."));
  return {ok: true, cost: cost, lead: lead};
};

GT.setMarketing = function (s, channelId, amount) {
  amount = clamp(fin(amount), 0, 20000);
  var ch = null;
  GT.CHANNELS.forEach(function (c) { if (c.id === channelId) ch = c; });
  if (!ch) return s;
  s.marketing[channelId] = Math.min(amount, ch.weeklyMax);
  return s;
};

GT.hire = function (s, candidateId) {
  var c = s.candidates.filter(function (x) { return x.id === candidateId; })[0];
  if (!c) return {ok: false, why: "Candidate no longer available."};
  // hiring bonus: one week wage
  if (s.cash < c.wage) return {ok: false, why: "Need at least one week's wage in cash."};
  spendCash(s, c.wage * 0.25);
  c.morale = clamp(c.morale + 4, 0, 100);
  s.staff.push(c);
  s.candidates = s.candidates.filter(function (x) { return x.id !== candidateId; });
  GT.grant(s, "first-hire");
  addNews(s, "Hired " + c.name + " as " + c.roleName + " at " + GT.money(c.wage) + "/wk.");
  return {ok: true};
};
GT.fire = function (s, staffId) {
  var p = s.staff.filter(function (x) { return x.id === staffId; })[0];
  if (!p) return {ok: false, why: "Not on payroll."};
  var sev = p.wage;
  spendCash(s, Math.min(sev, Math.max(0, s.cash)));
  s.staff = s.staff.filter(function (x) { return x.id !== staffId; });
  s.staff.forEach(function (x) { x.morale = clamp(x.morale - 4, 0, 100); });
  addNews(s, "Let go " + p.name + ". Severance " + GT.money(sev) + ".");
  return {ok: true};
};
GT.setWage = function (s, staffId, wage) {
  wage = clamp(fin(wage), 50, 20000);
  s.staff.forEach(function (p) {
    if (p.id === staffId) {
      var prev = p.wage;
      p.wage = roundc(wage);
      p.morale = clamp(p.morale + (wage > prev ? 8 : wage < prev * 0.95 ? -14 : 0), 0, 100);
    }
  });
  return s;
};
GT.trainStaff = function (s, staffId) {
  var p = s.staff.filter(function (x) { return x.id === staffId; })[0];
  if (!p) return {ok: false, why: "Not on payroll."};
  if (p.training > 0) return {ok: false, why: "Already in training."};
  var cost = 280 + p.skill * 4;
  if (s.cash < cost) return {ok: false, why: "Training costs " + GT.money(cost) + "."};
  spendCash(s, cost);
  p.training = 2;
  addNews(s, p.name + " starts two weeks of training.");
  return {ok: true, cost: cost};
};

GT.upgradeEquipment = function (s, equipId) {
  var e = s.equipment.filter(function (x) { return x.id === equipId; })[0];
  if (!e) return {ok: false, why: "No such equipment."};
  if ((e.level || 1) >= (e.levels || 4)) return {ok: false, why: "Already at the top tier."};
  var cost = e.cost * (0.55 + (e.level || 1) * 0.35);
  if (s.flags.buyDiscount) cost *= s.flags.buyDiscount;
  if (s.cash < cost) return {ok: false, why: "Need " + GT.money(cost) + "."};
  spendCash(s, cost);
  e.level = (e.level || 1) + 1;
  e.cond = 100;
  s.quality = clamp(s.quality + 2, 5, 100);
  addNews(s, "Upgraded " + e.name + " to level " + e.level + ".");
  return {ok: true, cost: cost};
};
GT.repairEquipment = function (s, equipId) {
  var e = s.equipment.filter(function (x) { return x.id === equipId; })[0];
  if (!e) return {ok: false, why: "No such equipment."};
  var cost = Math.round((100 - fin(e.cond, 80)) / 100 * e.cost * 0.15) + 80;
  if (s.cash < cost) return {ok: false, why: "Need " + GT.money(cost) + "."};
  spendCash(s, cost);
  e.cond = clamp(e.cond + 45, 0, 100);
  addNews(s, "Repaired " + e.name + " for " + GT.money(cost) + ".");
  return {ok: true, cost: cost};
};

GT.setRoute = function (s, hoodId) {
  if (!biz(s).mobile) return {ok: false, why: "This business is not mobile."};
  if (!GT.HOOD[hoodId]) return {ok: false, why: "Unknown neighborhood."};
  s.routeId = hoodId;
  addNews(s, "This week's route: " + GT.HOOD[hoodId].name + ".");
  return {ok: true};
};

function loanMax(s, prod) {
  var cap = prod.maxAmount;
  cap *= 0.6 + Math.min(1.2, companyValue(s) / 80000);
  cap *= 0.7 + s.creditScore / 1200;
  cap *= 1 + (s.skills.finance - 5) * 0.04;
  return Math.round(Math.max(1000, Math.min(prod.maxAmount * 1.2, cap)));
}
GT.loanOptions = function (s) {
  return GT.LOAN_PRODUCTS.map(function (p) {
    var ok = s.creditScore >= p.minCredit;
    return {id: p.id, name: p.name, rate: p.rate, weeks: p.weeks, revolving: !!p.revolving, predatory: !!p.predatory, minCredit: p.minCredit, max: loanMax(s, p), ok: ok, why: ok ? "" : "Credit " + p.minCredit + "+ required."};
  });
};
GT.takeLoan = function (s, typeId, amount) {
  var p = GT.LOAN_PRODUCTS.filter(function (x) { return x.id === typeId; })[0];
  if (!p) return {ok: false, why: "Unknown product."};
  if (s.creditScore < p.minCredit) return {ok: false, why: "Credit score too low."};
  var max = loanMax(s, p);
  amount = clamp(fin(amount), 500, max);
  // already have this revolving? just raise limit
  if (p.revolving) {
    var existing = s.loans.filter(function (l) { return l.revolving && l.typeId === typeId; })[0];
    if (existing) {
      existing.limit = Math.max(existing.limit, amount);
      addNews(s, "Line of credit limit is now " + GT.money(existing.limit) + ".");
      return {ok: true};
    }
  }
  var fee = amount * (p.fee || 0);
  var net = amount - fee;
  var loan = makeLoan(typeId, amount, s, 1);
  if (p.revolving) { loan.balance = 0; loan.limit = amount; net = 0; }
  else earnCash(s, net);
  if (fee && !p.revolving) { /* fee already netted */ }
  s.loans.push(loan);
  s.hadDebt = true;
  addNews(s, (p.revolving ? "Opened a line of " : "Borrowed ") + GT.money(amount) + " via " + p.name + (fee && !p.revolving ? " (fee " + GT.money(fee) + ")" : "") + ".");
  return {ok: true, amount: amount};
};
GT.payDown = function (s, amount) { return {ok: true, paid: payLoans(s, amount)}; };
GT.drawLoc = function (s, amount) {

};
GT.depositTax = function (s, amount) {

};

GT.investorOffer = function (s) {
  var val = companyValue(s);
  var stage = s.investors.length === 0 ? "seed" : s.investors.length === 1 ? "series-a" : "series-b";
  var want = stage === "seed" ? 0.18 : stage === "series-a" ? 0.2 : 0.15;
  var check = stage === "seed" ? clamp(val * 0.22, 15000, 250000)
    : stage === "series-a" ? clamp(val * 0.25, 80000, 2000000)
    : clamp(val * 0.2, 200000, 8000000);
  // investors need a story
  var ready = s.week >= (stage === "seed" ? 8 : stage === "series-a" ? 40 : 80);
  var story = s.businessId === "tech" || s.businessId === "app-studio" || s.businessId === "game-studio" || s.growthRate > 0.15 || s.revenueRunRate > 4000;
  if (!ready) return {ok: false, why: "Too early for a priced round."};
  if (!story && s.skills.finance < 7) return {ok: false, why: "Investors want either growth, a software story, or a stronger finance pitch."};
  return {ok: true, stage: stage, valuation: val, check: Math.round(check), equity: want, name: stage === "seed" ? "Dockside Partners" : stage === "series-a" ? "Northline Capital" : "Open Harbor Fund"};
};
GT.takeInvestment = function (s, negotiate) {
  var off = GT.investorOffer(s);
  if (!off.ok) return off;
  var eq = off.equity;
  var check = off.check;
  if (negotiate) {
    var skill = s.skills.finance + s.skills.sales / 4;
    if (skill >= 9) { eq *= 0.82; check *= 1.05; }
    else if (skill >= 7) { eq *= 0.9; }
    else { eq *= 1.08; check *= 0.95; }
  }
  eq = clamp(eq, 0.05, 0.4);
  if (founderEquity(s) - eq < 0.15) return {ok: false, why: "That would leave you under 15% — they will not structure it that way, and you shouldn't either."};
  s.founderEquity = roundc((founderEquity(s) - eq) * 1000) / 1000;
  s.investors.push({name: off.name, stage: off.stage, equity: eq, check: check, week: s.week});
  earnCash(s, check);
  if (off.stage !== "seed") GT.grant(s, "series-a");
  addNews(s, off.name + " invested " + GT.money(check) + " for " + Math.round(eq * 100) + "% in a " + off.stage + " round.");
  return {ok: true, check: check, equity: eq};
};
