/* auto-order helper for bots and a player "restock week" button */
GT.autoRestock = function (s, weeksCover) {
  weeksCover = weeksCover || 3;
  var results = [];
  s.products.forEach(function (p) {
    if (p.baseCost <= 0.05) return;
    var est = Math.max(fin(p.sold), Math.round((biz(s).baseRev / Math.max(1, s.products.length)) / Math.max(0.5, p.price) * 0.45), 16);
    var target = Math.max(30, Math.round(est * weeksCover + 16));
    var need = target - p.stock;
    (s.shipments || []).forEach(function (sh) { if (sh.productId === p.id) need -= sh.qty; });
    if (need >= 8) {
      var sup = GT.SUPPLIERS.filter(function (x) { return x.id === s.supplierId; })[0] || GT.SUPPLIERS[1];
      var unit = p.baseCost * sup.costMult;
      var incoming = 0;
      (s.shipments || []).forEach(function (sh) { if (sh.productId === p.id) incoming += sh.qty; });
      var reserve = staffPayroll(s) * 2 + weeklyRent(s) + 1500 + Math.max(0, fin(s.taxOwed) - fin(s.taxReserve));
      if (p.stock + incoming <= 0) reserve = staffPayroll(s) + weeklyRent(s) + 400; // don't stock out
      var maxSpend = Math.max(0, s.cash - reserve);
      var maxQty = Math.floor(maxSpend / Math.max(0.01, unit));
      need = Math.min(need, Math.max(0, maxQty));
      if (need >= 8) results.push(GT.orderStock(s, p.id, need));
    }
  });
  return results;
};

GT.staffCap = function (s) {
  var caps = {
    "food-truck": 3, "coffee": 5, "bakery": 5, "barbershop": 6,
    "restaurant": 9, "gym": 8, "car-wash": 6, "landscaping": 8,
    "sports": 6, "clothing": 7, "ecom": 6, "sneakers": 3,
    "tech": 10, "app-studio": 8, "game-studio": 10, "realestate": 6
  };
  var cap = caps[s.businessId] || 6;
  cap += Math.max(0, (s.locations.length || 1) - 1) * 2;
  cap += Math.min(6, Math.floor((s.franchiseUnits || 0) / 3));
  return cap;
};

/* ---------- save / bots / exports ---------- */
GT.serialize = function (s) {
  var copy = {};
  Object.keys(s).forEach(function (k) {
    if (k === "_r") return;
    copy[k] = s[k];
  });
  return JSON.parse(JSON.stringify(copy));
};
GT.hydrate = function (raw) {
  var s = raw;
  if (typeof s === "string") s = JSON.parse(s);
  s._r = mulberry32(hashSeed((s.seed || 1) + ":h" + s.week));
  s.cash = fin(s.cash);
  s.flags = s.flags || {};
  s.news = s.news || [];
  s.staff = s.staff || [];
  s.products = s.products || [];
  s.loans = s.loans || [];
  return s;
};

GT.loadMeta = function (storage) {
  storage = storage || (typeof localStorage !== "undefined" ? localStorage : null);
  var empty = {achievements: {}, bestNetWorth: 0, bestEnding: null, plays: 0, lastVersion: GT.VERSION};
  if (!storage) return empty;
  try {
    var m = JSON.parse(storage.getItem(GT.META_KEY) || "null");
    if (!m || typeof m !== "object") return empty;
    m.achievements = m.achievements || {};
    m.bestNetWorth = fin(m.bestNetWorth);
    return m;
  } catch (e) { return empty; }
};
GT.saveMeta = function (meta, storage) {
  storage = storage || (typeof localStorage !== "undefined" ? localStorage : null);
  if (!storage) return;
  try { storage.setItem(GT.META_KEY, JSON.stringify(meta)); } catch (e) {}
};
GT.mergeMeta = function (s, storage) {
  var meta = GT.loadMeta(storage);
  meta.plays = (meta.plays || 0) + (s.week === 0 ? 0 : 0);
  var nw = netWorth(s);
  if (nw > fin(meta.bestNetWorth)) {
    meta.bestNetWorth = nw;
    meta.bestEnding = s.ending || meta.bestEnding;
    meta.bestName = s.name;
    meta.bestWeek = s.week;
  }
  Object.keys(s.achievements || {}).forEach(function (k) { meta.achievements[k] = true; });
  GT.saveMeta(meta, storage);
  return meta;
};
GT.listSaves = function (storage) {
  storage = storage || (typeof localStorage !== "undefined" ? localStorage : null);
  var empty = [];
  for (var i = 0; i < GT.MAX_SLOTS; i++) empty.push(null);
  if (!storage) return empty;
  try {
    var arr = JSON.parse(storage.getItem(GT.SAVE_KEY) || "null");
    if (!Array.isArray(arr)) return empty;
    while (arr.length < GT.MAX_SLOTS) arr.push(null);
    return arr.slice(0, GT.MAX_SLOTS);
  } catch (e) { return empty; }
};
GT.saveSlot = function (s, slot, storage) {
  storage = storage || (typeof localStorage !== "undefined" ? localStorage : null);
  slot = clamp(slot | 0, 0, GT.MAX_SLOTS - 1);
  var arr = GT.listSaves(storage);
  var data = GT.serialize(s);
  arr[slot] = {savedAt: Date.now(), name: s.name, type: s.businessId, week: s.week, cash: s.cash, netWorth: netWorth(s), ended: s.ended, data: data};
  if (storage) {
    try { storage.setItem(GT.SAVE_KEY, JSON.stringify(arr)); } catch (e) { return {ok: false, why: "Save failed (storage full?)."}; }
  }
  GT.mergeMeta(s, storage);
  return {ok: true};
};
GT.loadSlot = function (slot, storage) {
  var arr = GT.listSaves(storage);
  var rec = arr[slot];
  if (!rec || !rec.data) return null;
  return GT.hydrate(rec.data);
};
GT.clearSlot = function (slot, storage) {
  storage = storage || (typeof localStorage !== "undefined" ? localStorage : null);
  var arr = GT.listSaves(storage);
  arr[slot] = null;
  if (storage) try { storage.setItem(GT.SAVE_KEY, JSON.stringify(arr)); } catch (e) {}
};

/* ---------- bot policies ---------- */
function botRestock(s) {
  var low = s.products.some(function (p) { return p.baseCost > 0.05 && p.stock < 10; });
  if (low) s.supplierId = "premium";
  else if (s.cash < 4000) s.supplierId = "budget";
  else s.supplierId = "standard";
  GT.autoRestock(s, s.businessId === "sneakers" ? 4 : 3);
}
function botPrices(s, style) {
  s.products.forEach(function (p) {
    var fair = fairPrice(p, s);
    var m = style === "premium" ? 1.16 : style === "mid-high" ? 1.08 : style === "cheap" ? 0.9 : 1.02;
    // nudge toward a healthy margin
    var min = p.unitCost * (style === "cheap" ? 1.15 : 1.35);
    p.price = roundc(Math.max(min, fair * m));
  });
}
function botHire(s, maxStaff, minCash) {
  var cap = Math.min(maxStaff, GT.staffCap(s));
  if (biz(s).group === "digital" && (s.stage === "build" || (s.project && s.project.phase !== "launch"))) cap = Math.min(cap, 2);
  if (s.businessId === "realestate" && (!s.properties || !s.properties.length)) cap = Math.min(cap, 1);
  if (s.staff.length >= cap) return;
  var payroll = staffPayroll(s);
  var runway = payroll > 0 ? s.cash / payroll : 99;
  if (runway < 10) return;
  if (s.cash < (minCash || 4000)) return;
  if (s.revenueRunRate > 0 && payroll > s.revenueRunRate * 0.38) return;
  if (s.lastReport && s.lastReport.profit < 0 && s.staff.length >= 2) return;
  var best = s.candidates.slice().sort(function (a, b) { return (b.skill / b.wage) - (a.skill / a.wage); })[0];
  if (best && best.skill >= 45) GT.hire(s, best.id);
}
function botFireLazy(s) {
  s.staff.slice().forEach(function (p) {
    if (p.morale < 22 || (p.skill < 35 && s.staff.length > 1 && p.weeks > 8)) GT.fire(s, p.id);
  });
  // If payroll is crushing the shop, let the weakest go
  while (s.staff.length > 2 && s.revenueRunRate > 0 && staffPayroll(s) > s.revenueRunRate * 0.52) {
    var weak = s.staff.slice().sort(function (a, b) { return a.skill - b.skill; })[0];
    if (!weak) break;
    GT.fire(s, weak.id);
  }
}
function botMarketing(s, budget) {
  budget = Math.max(0, Math.min(budget, s.cash * 0.12));
  var chans = GT.CHANNELS.filter(function (c) {
    return !c.fit.length || c.fit.indexOf(s.businessId) >= 0 || c.fit.indexOf(biz(s).group) >= 0;
  });
  if (!chans.length) chans = GT.CHANNELS.slice(0, 3);
  var each = budget / chans.length;
  GT.CHANNELS.forEach(function (c) { s.marketing[c.id] = 0; });
  chans.forEach(function (c) { s.marketing[c.id] = roundc(Math.min(c.weeklyMax, each)); });
}
function botTrain(s) {
  if (s.cash < 5000) return;
  var p = s.staff.filter(function (x) { return !x.training && x.skill < x.potential - 4; })[0];
  if (p) GT.trainStaff(s, p.id);
}
function botRepair(s) {
  s.equipment.forEach(function (e) {
    if (e.cond < 45 && s.cash > 2000) GT.repairEquipment(s, e.id);
    else if (e.cond > 70 && (e.level || 1) < (e.levels || 4) && s.cash > e.cost * 1.2 && s.week > 16) {
      if (s.cash > 12000) GT.upgradeEquipment(s, e.id);
    }
  });
}
function botPermits(s) {
  if (!s.permitsOk || (s.flags.permitWeeks != null && s.flags.permitWeeks < 2)) GT.renewPermits(s);
}
function botTaxes(s) {
  if (s.taxOwed > s.taxReserve + 200 && s.cash > s.taxOwed + 3000) {
    GT.depositTax(s, Math.min(s.taxOwed - s.taxReserve, s.cash * 0.1));
  }
}
function botResolve(s, style) {
  if (!s.pendingEvent) return;
  var ev = s.pendingEvent;
  var pickId = ev.choices[0] && ev.choices[0].id;
  var prefer = {
    viral: style === "aggressive" || style === "growth" ? "ads" : "lean",
    shortage: style === "quality" ? "prem" : style === "cautious" ? "limit" : "sub",
    recession: style === "aggressive" ? "expand" : style === "quality" ? "hold" : "cut",
    boom: style === "aggressive" || style === "growth" ? "mkt" : style === "cautious" ? "save" : "staff",
    lawsuit: style === "aggressive" ? "fight" : "fix",
    "staff-raise": style === "cautious" ? "part" : "yes",
    walkout: "bonus",
    partnership: style === "cautious" ? "trial" : "yes",
    buyout: style === "cautious" && (companyValue(s) > 200000) ? "take" : "no",
    "rent-hike": "negotiate",
    breakdown: style === "quality" || style === "aggressive" ? "upgrade" : "fix",
    inspect: "prep",
    audit: "pay",
    festival: "booth",
    "influencer-ask": style === "cautious" ? "trade" : "pay",
    theft: "cam",
    mentor: style === "quality" ? "hire" : "yes",
    "review-bomb": "reply",
    critic: style === "quality" ? "frame" : "raise",
    interest: style === "cautious" ? "pay" : "refi",
    poach: "match",
    permit: "pay",
    storm: s.flags.online ? "online" : "open",
    "family-call": "show",
    ip: "rename",
    "acquire-chance": style === "aggressive" ? "buy" : "no",
    unicorn: style === "cautious" ? "steady" : style === "growth" || style === "aggressive" ? "raise" : "ride"
  };
  if (prefer[ev.id]) pickId = prefer[ev.id];
  // verify choice exists
  if (!ev.choices.some(function (c) { return c.id === pickId; })) pickId = ev.choices[0].id;
  GT.resolveEvent(s, pickId);
}

function botExpand(s, style) {
  if (s.week < 30) return;
  if (s.cash < 25000) return;
  if (style === "cautious" && (s.cash < 40000 || s.week < 80)) return;
  if (!s.flags.online && s.cash > 8000 && s.week > 16) GT.launchOnline(s);
  if (biz(s).group === "digital" && !s.flags.national && s.week > 156 && s.cash > 60000) GT.goNational(s);
  if (style !== "cautious" && s.locations.length < 3 && s.week > 50 && s.cash > biz(s).startup * 0.7) {
    var ids = suggestedHoods(s.businessId).map(function (h) { return h.id; });
    for (var i = 0; i < ids.length; i++) {
      if (!s.locations.some(function (l) { return l.hoodId === ids[i]; })) {
        var r = GT.openLocation(s, ids[i]);
        if (r.ok) break;
      }
    }
  }
  if ((style === "aggressive" || style === "quality" || style === "growth") && s.week > 60 && s.reputation >= 62) {
    if (s.week % (style === "aggressive" ? 6 : 10) === 0) GT.sellFranchise(s);
  }
  if (s.businessId === "realestate" && s.cash > 50000 && s.week % 8 === 0) GT.buyProperty(s);
  if (s.businessId === "game-studio" && !s.project && s.liveGames.length < 4 && s.week > 10 && s.cash > staffPayroll(s) * 14 + 8000) GT.startGameProject(s);
  if (s.businessId === "app-studio" && s.week % 26 === 0 && s.apps.length < 5) GT.startApp(s);
  if (s.week > 40 && !s.flags.extraLine && s.cash > 15000) GT.addProductLine(s);
}

function botFinance(s, style) {
  botTaxes(s);
  botPermits(s);
  if (style === "cautious") {
    if (totalDebt(s) > 0 && s.cash > 12000) GT.payDown(s, Math.min(s.cash * 0.1, totalDebt(s)));
    return;
  }
  if (style === "aggressive" || style === "growth") {
    var off = GT.investorOffer(s);
    if (off.ok && s.investors.length < (style === "growth" ? 3 : 1) && s.week > 12) GT.takeInvestment(s, true);
    if (s.cash < 4000 && s.creditScore >= 660) {
      var opts = GT.loanOptions(s).filter(function (o) { return o.ok && !o.predatory; });
      if (opts.length && totalDebt(s) < companyValue(s) * 0.4) GT.takeLoan(s, opts[0].id, Math.min(opts[0].max * 0.4, 20000));
    }
  }
  if (style === "chaotic") {
    if (rngOf(s)() < 0.1) {
      var opts = GT.loanOptions(s);
      var o = opts[Math.floor(rngOf(s)() * opts.length)];
      if (o.ok) GT.takeLoan(s, o.id, o.max * 0.5);
    }
  }
}

GT.botTurn = function (s, strategy) {
  strategy = strategy || "balanced";
  if (s.pendingEvent) botResolve(s, strategy);
  if (s.ended) return s;
  botPrices(s, strategy === "quality" ? "mid-high" : strategy === "aggressive" ? "cheap" : "mid");
  botRestock(s);
  botRepair(s);
  botTrain(s);
  botFireLazy(s);
  var maxStaff = strategy === "cautious" ? 5 : strategy === "aggressive" ? 14 : strategy === "growth" ? 10 : strategy === "chaotic" ? 12 : 8;
  botHire(s, maxStaff, strategy === "cautious" ? 8000 : 3500);
  var mkt = strategy === "cautious" ? Math.min(s.cash * 0.03, s.revenueRunRate * 0.07) : strategy === "aggressive" || strategy === "growth" ? Math.max(120, s.revenueRunRate * 0.1) : strategy === "quality" ? Math.min(s.cash * 0.04, s.revenueRunRate * 0.08) : strategy === "chaotic" ? s.cash * rngOf(s)() * 0.15 : Math.min(s.cash * 0.045, s.revenueRunRate * 0.08);
  if (s.stage === "build" || (s.project && !(s.liveGames && s.liveGames.length))) mkt = Math.min(mkt, 180);
  if (s.lastReport && s.lastReport.profit < 0) mkt = Math.min(mkt, 90);
  if (s.revenueRunRate < 100) mkt = Math.min(mkt, 160);
  botMarketing(s, Math.max(0, mkt));
  botFinance(s, strategy);
  botExpand(s, strategy);
  if (strategy === "quality" && s.week % 5 === 0) {
    s.products.forEach(function (p) { p.price = roundc(Math.max(p.unitCost * 1.5, fairPrice(p, s) * 1.12)); });
  }
  if (biz(s).mobile) {
    var spots = suggestedHoods(s.businessId);
    s.routeId = spots[s.week % spots.length].id;
  }
  if (strategy !== "cautious" && GT.canIPO(s) && s.week > 200) GT.goPublic(s);
  return s;
};

GT.STRATEGIES = ["cautious", "balanced", "quality", "aggressive", "growth", "chaotic"];

GT.simulate = function (opts) {
  opts = opts || {};
  var strategy = opts.strategy || "balanced";
  var weeks = opts.weeks || 520;
  var s = GT.createGame({
    seed: opts.seed,
    backgroundId: opts.backgroundId,
    businessId: opts.businessId,
    companyName: opts.companyName || ("Bot " + strategy),
    founderName: "Bot",
    hoodId: opts.hoodId
  });
  var bugs = [];
  function check(tag) {
    if (!Number.isFinite(s.cash)) bugs.push(tag + ": cash NaN at week " + s.week);
    if (!Number.isFinite(netWorth(s))) bugs.push(tag + ": netWorth NaN at week " + s.week);
    if (!Number.isFinite(s.quality) || !Number.isFinite(s.satisfaction)) bugs.push(tag + ": quality/sat NaN at week " + s.week);
    s.products.forEach(function (p) {
      if (!Number.isFinite(p.price) || !Number.isFinite(p.stock)) bugs.push(tag + ": product NaN " + p.id + " w" + s.week);
      if (p.stock < 0) bugs.push(tag + ": negative stock " + p.id);
    });
    if (s.users < 0) bugs.push("negative users");
  }
  check("init");
  var reports = 0;
  for (var i = 0; i < weeks; i++) {
    if (s.ended) break;
    GT.botTurn(s, strategy);
    if (s.ended) break;
    var res = GT.advanceWeek(s);
    s = res.state;
    reports++;
    if (res.report && !Number.isFinite(res.report.profit)) bugs.push("profit NaN w" + s.week);
    check("tick");
    if (bugs.length > 12) break;
  }
  return {
    seed: s.seed,
    strategy: strategy,
    businessId: s.businessId,
    backgroundId: s.backgroundId,
    week: s.week,
    ended: s.ended,
    ending: s.ending || (s.flags.billionOffered ? "billionaire" : s.flags.millionOffered ? "millionaire" : s.flags.decadeOffered ? "decade" : s.flags.public ? "ipo" : null),
    cash: s.cash,
    netWorth: netWorth(s),
    equity: founderEquity(s),
    revenue: s.annualRevenue || s.ytdRevenue,
    profit: s.annualProfit || s.ytdProfit,
    staff: s.staff.length,
    locations: s.locations.length,
    franchise: s.franchiseUnits,
    public: !!s.flags.public,
    bankrupt: s.ending === "bankrupt",
    sold: s.ending === "sold",
    ipo: !!s.flags.public,
    million: !!s.achievements.million,
    billion: !!s.achievements.billion,
    decade: !!s.achievements.decade,
    achievements: Object.keys(s.achievements || {}),
    bugs: bugs,
    reports: reports
  };
};

  s.products.forEach(function(p){
    var fair = p.basePrice * (0.7+0.6*(p.quality/70));
    html += '<tr><td><b>'+escapeHtml(p.name)+'</b><div class="muted">Quality '+Math.round(p.quality)+' · fair ~'+GT.money(fair)+'</div></td>'+
      '<td><input style="width:80px" data-act="price" data-id="'+p.id+'" type="number" min="0.25" step="0.25" value="'+p.price+'"></td>'+
      '<td class="mono">'+GT.moneyDec(p.unitCost)+'</td>'+
      '<td class="mono">'+Math.round(p.stock)+'</td>'+
      '<td class="mono">'+(p.sold||0)+'</td>'+
      '<td>'+(p.baseCost>0.05?'<input style="width:70px" data-ord="'+p.id+'" type="number" min="0" step="1" placeholder="Order"><button class="btn sm" data-act="order" data-id="'+p.id+'">Order</button>':'')+'</td></tr>';
  });
  html += '</table><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="restock" data-tip="Order about three weeks of stock, leaving a cash reserve.">Auto-restock</button>';
  html += '<label class="muted">Supplier <select data-act="supplier">'+GT.SUPPLIERS.map(function(x){return '<option value="'+x.id+'"'+(s.supplierId===x.id?' selected':'')+'>'+x.name+' · cost ×'+x.costMult+' · lead '+x.lead+'w</option>';}).join("")+'</select></label></div>';
  if(s.shipments&&s.shipments.length){
    html += '<p class="muted" style="margin-top:8px">In transit: '+s.shipments.map(function(sh){return sh.qty+' ('+sh.weeksLeft+'w)';}).join(", ")+'</p>';
  }
  html += '</div>';
  html += '<div class="panel"><h2>Equipment</h2><table><tr><th>Unit</th><th>Level</th><th>Condition</th><th></th></tr>';
  s.equipment.forEach(function(e){
    html += '<tr><td>'+escapeHtml(e.name)+'</td><td>'+e.level+' / '+e.levels+'</td><td><div class="bar"><i style="width:'+e.cond+'%"></i></div></td><td><button class="btn sm" data-act="repair" data-id="'+e.id+'">Repair</button> <button class="btn sm" data-act="upgrade" data-id="'+e.id+'">Upgrade</button></td></tr>';
  });
  html += '</table></div>';
  if(b.mobile){
    html += '<div class="panel"><h2>This week\'s route</h2><p class="muted">A food truck lives and dies on the spot you park.</p>';
    GT.NEIGHBORHOODS.forEach(function(h){
      html += '<button class="btn sm '+(s.routeId===h.id?'primary':'')+'" data-act="route" data-id="'+h.id+'">'+escapeHtml(h.name)+'</button> ';
    });
    html += '</div>';
  }
  if(s.businessId==="game-studio"){
    html += '<div class="panel"><h2>Studio</h2>';
    if(s.project) html += '<p><b>'+escapeHtml(s.project.name)+'</b> is in '+s.project.phase+' (week '+s.project.weeksIn+'). Quality '+Math.round(s.project.quality)+'.</p><button class="btn sm" data-act="crunch">'+(s.project.crunch?'End crunch':'Crunch (faster, morale hit)')+'</button>';

  }
  if(s.businessId==="tech"){
    html += '<div class="panel"><h2>Product</h2><p>Stage: <b>'+s.stage+'</b> · Users '+Math.round(s.users||0)+' · Dev points '+Math.round(s.devPoints||0)+'</p><p class="muted">Engineers add progress. Launch happens once you have built enough. Revenue follows users, price, and quality — and you still have to cover the burn.</p></div>';
  }
  if(s.businessId==="realestate"){
    html += '<div class="panel"><h2>Properties</h2><table><tr><th>Property</th><th>Value</th><th>Mortgage</th><th>Rent/wk</th><th>Status</th></tr>';
    (s.properties||[]).forEach(function(p){

  return html;
}

function drawCharts(){
  if(!state) return;
  function line(id, series, colors){
    var c=$(id); if(!c) return;
    var w=c.width=c.clientWidth*2||600, h=c.height=280;
    var ctx=c.getContext("2d");
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle="#e4ddd2"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(40,10); ctx.lineTo(40,h-24); ctx.lineTo(w-8,h-24); ctx.stroke();
    var all=[]; series.forEach(function(s){ all=all.concat(s); });
    if(!all.length) return;
    var min=Math.min.apply(null,all), max=Math.max.apply(null,all);
    if(min===max){min-=1;max+=1;}
    series.forEach(function(arr,i){
      ctx.strokeStyle=colors[i]||"#161410"; ctx.lineWidth=2; ctx.beginPath();
      arr.forEach(function(v,x){
        var px=40+(w-56)*x/Math.max(1,arr.length-1);
        var py=h-24-(h-40)*(v-min)/(max-min);
        if(x===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      });
      ctx.stroke();
    });
  }
  var H=state.history||{cash:[],rev:[],profit:[]};
  line("c-cash", [H.cash.slice(-80)], ["#1f6b46"]);
  line("c-pnl", [H.rev.slice(-80), H.profit.slice(-80)], ["#1b2a38","#b0863c"]);
}

function bindTips(){
  var tip=$("tip");
  document.querySelectorAll("[data-tip]").forEach(function(node){
    node.addEventListener("mouseenter", function(e){
      tip.textContent=node.getAttribute("data-tip");
      tip.classList.add("on");
      moveTip(e);
    });
    node.addEventListener("mousemove", moveTip);
    node.addEventListener("mouseleave", function(){ tip.classList.remove("on"); });
  });
}
function moveTip(e){
  var tip=$("tip");
  tip.style.left=Math.min(window.innerWidth-280, e.clientX+12)+"px";
  tip.style.top=Math.min(window.innerHeight-80, e.clientY+14)+"px";
}

function hintText(){
  if(!state) return "Start a new game first.";
  var s=state, bits=[];
  if(s.cash<3000) bits.push("Cash is tight. Cut marketing, delay a hire, or consider a small loan — not a merchant advance unless you must.");
  if(s.permitsOk===false) bits.push("Renew your permits in Finance or the city may shut you down.");
  if(s.taxOwed>s.taxReserve+500) bits.push("Set tax money aside. A quarterly bill is coming.");
  var low=s.products.some(function(p){return p.baseCost>0.05 && p.stock<15;});
  if(low) bits.push("You are short on stock. Order in Operations, or use Auto-restock.");
  if(s.staff.length===0 && (GT.BIZ[s.businessId]||{}).group!=="digital") bits.push("A pair of hands would help capacity. Hire if you can cover the wage.");
  if(s.staff.some(function(p){return p.morale<40;})) bits.push("Someone on the team is unhappy. A raise or a calmer week may keep them.");
  if(s.equipment.some(function(e){return e.cond<40;})) bits.push("Equipment is wearing out. Repair it before a breakdown event does it for you.");
  if(s.lastReport && s.lastReport.profit<0 && s.revenueRunRate>0) bits.push("Last week lost money. Check prices versus cost, payroll, and whether marketing is paying off.");
  if(s.flags.recession) bits.push("The city is in a downturn. Volume is softer; don\'t expand just because you are bored.");
  if(!bits.length) bits.push("You are in decent shape. Follow the gold arrow of your own goals: quality, a second location, a raise, or just a quiet profitable week.");
  return bits[0];
}

function endWeek(){
  if(!state||state.ended) return;
  if(state.pendingEvent){ openEvent(); return; }
  var res=GT.advanceWeek(state);
  state=res.state;
  pendingReport=res.report;
  if(res.report) openReport(res.report);
  else renderPlay();
}

/* events */
document.addEventListener("click", function(e){
  var t=e.target.closest("[data-act]"); if(!t) return;
  var act=t.getAttribute("data-act"), id=t.getAttribute("data-id");
  if(act==="close"){ closeModal(); renderPlay(); return; }
  if(act==="home"){ closeModal(); if(state) GT.mergeMeta(state,storage); renderTitle(); return; }
  if(act==="new"){ wizard.step=0; renderWizard(); return; }
  if(act==="howto"){ howTo(); return; }
  if(act==="achs"){ howTo(); return; }
  if(act==="load"){ var sl=GT.loadSlot(+t.getAttribute("data-slot"), storage); if(sl){ state=sl; view="dash"; renderPlay(); } return; }
  if(act==="wipe"){ GT.clearSlot(+t.getAttribute("data-slot"), storage); renderTitle(); return; }
  if(act==="bg"){ wizard.backgroundId=id; if($("wn-founder")) wizard.founderName=$("wn-founder").value; renderWizard(); return; }
  if(act==="biz"){ wizard.businessId=id; if($("wn-co")) wizard.companyName=$("wn-co").value; renderWizard(); return; }
  if(act==="hood"){ wizard.hoodId=id; renderWizard(); return; }
  if(act==="wiz-next"){
    if(wizard.step===0 && $("wn-founder")) wizard.founderName=$("wn-founder").value;
    if(wizard.step===1 && $("wn-co")) wizard.companyName=$("wn-co").value;
    wizard.step=Math.min(2, wizard.step+1); renderWizard(); return;
  }
  if(act==="wiz-back"){ wizard.step=Math.max(0,wizard.step-1); renderWizard(); return; }
  if(act==="wiz-start"){ startGame(); return; }
  if(act==="view"){ view=id; renderPlay(); return; }
  if(act==="week"){ endWeek(); return; }
  if(act==="hint"){ openModal('<h2>Hint</h2><p>'+escapeHtml(hintText())+'</p><button class="btn primary wide" data-act="close">OK</button>'); return; }
  if(act==="save"){ doSave(); return; }
  if(act==="save-slot"){ var r=GT.saveSlot(state, +t.getAttribute("data-slot"), storage); closeModal(); var slotN=+t.getAttribute("data-slot")+1; openModal("<h2>"+(r.ok?"Saved":"Save failed")+"</h2><p>"+(r.ok?("Slot "+slotN+" is up to date. "):"")+(r.why||"")+"</p><button class=\"btn primary wide\" data-act=\"close\">OK</button>"); return; }
  if(act==="tut-done"){ if(storage) storage.setItem(GT.TUT_KEY,"1"); closeModal(); renderPlay(); return; }
  if(act==="choose"){ GT.resolveEvent(state, id); closeModal(); renderPlay(); return; }

  if(!state) return;
  var msg=null, res=null;
  if(act==="price"){ return; }
  if(act==="order"){
    var inp=document.querySelector('input[data-ord="'+id+'"]');
    res=GT.orderStock(state, id, inp?inp.value:0); msg=res.ok?("Ordered. Lead "+res.lead+" week(s)."):res.why;
  }
  if(act==="restock"){ GT.autoRestock(state,3); msg="Restocked what you can afford."; }
  if(act==="repair"){ res=GT.repairEquipment(state,id); msg=res.ok?("Repaired for "+GT.money(res.cost)):res.why; }
  if(act==="upgrade"){ res=GT.upgradeEquipment(state,id); msg=res.ok?("Upgraded for "+GT.money(res.cost)):res.why; }
  if(act==="route"){ GT.setRoute(state,id); }
  if(act==="crunch"){ GT.setCrunch(state, !(state.project&&state.project.crunch)); }
  if(act==="new-game"){ res=GT.startGameProject(state); msg=res.ok?"":res.why; }
  if(act==="new-app"){ res=GT.startApp(state); msg=res.ok?"":res.why; }
  if(act==="buy-prop"){ res=GT.buyProperty(state); msg=res.ok?"":res.why; }
  if(act==="hire"){ res=GT.hire(state,id); msg=res.ok?"":res.why; }
  if(act==="fire"){ res=GT.fire(state,id); msg=res.ok?"":res.why; }
  if(act==="train"){ res=GT.trainStaff(state,id); msg=res.ok?"":res.why; }
  if(act==="setw"){ var w=document.querySelector('input[data-wage="'+id+'"]'); GT.setWage(state,id,w?w.value:0); }
  if(act==="setmkt"){ var m=document.querySelector('input[data-mkt="'+id+'"]'); GT.setMarketing(state,id,m?m.value:0); }
  if(act==="paydown"){ var a=$("paydown"); GT.payDown(state, a?a.value:0); }
  if(act==="draw"){ res=GT.drawLoc(state, 2000); msg=res.ok?("Drew "+GT.money(res.amount)):res.why; }
  if(act==="borrow"){ var amt=document.querySelector('input[data-loan="'+id+'"]'); res=GT.takeLoan(state,id,amt?amt.value:0); msg=res.ok?"":res.why; }
  if(act==="tax"){ var d=$("taxdep"); res=GT.depositTax(state,d?d.value:0); msg=res.ok?"":res.why; }
  if(act==="permits"){ res=GT.renewPermits(state); msg=res.ok?"":res.why; }
  if(act==="raise"){ res=GT.takeInvestment(state,false); msg=res.ok?("Raised "+GT.money(res.check)):res.why; }
  if(act==="raise-neg"){ res=GT.takeInvestment(state,true); msg=res.ok?("Raised "+GT.money(res.check)+" after a negotiation"):res.why; }
  if(act==="online"){ res=GT.launchOnline(state); msg=res.ok?"":res.why; }
  if(act==="national"){ res=GT.goNational(state); msg=res.ok?"":res.why; }
  if(act==="franchise"){ res=GT.sellFranchise(state); msg=res.ok?("Fee "+GT.money(res.fee)):res.why; }
  if(act==="newline"){ res=GT.addProductLine(state); msg=res.ok?"":res.why; }
  if(act==="open-loc"){ res=GT.openLocation(state,id); msg=res.ok?"":res.why; }
  if(act==="pivot"){ var pv=$("pivot-to"); res=GT.pivotBusiness(state,pv?pv.value:""); msg=res.ok?"":res.why; }
  if(act==="solicit"){ res=GT.solicitSale(state); msg=res.ok?("Offer: "+GT.money(res.offer)):res.why; }
  if(act==="accept-sale"){ GT.acceptSale(state); }
  if(act==="decline-sale"){ GT.declineSale(state); }
  if(act==="ipo"){ res=GT.goPublic(state); msg=res.ok?"":res.why; state.ended=false; }

  if(msg){ openModal('<h2>Note</h2><p>'+escapeHtml(msg)+'</p><button class="btn primary wide" data-act="close">OK</button>'); return; }
  renderPlay();
});

document.addEventListener("change", function(e){
  if(!state) return;
  var t=e.target;
  if(t.getAttribute("data-act")==="price") GT.setPrice(state, t.getAttribute("data-id"), t.value);
  if(t.getAttribute("data-act")==="supplier") GT.setSupplier(state, t.value);
});

document.addEventListener("keydown", function(e){
  if(e.key==="h"||e.key==="H"){
    if(e.target && /input|select|textarea/i.test(e.target.tagName)) return;
    if(state && !$("modal").hidden===false) {}
    if(state && $("screen-play") && !$("screen-play").classList.contains("hidden")){
      e.preventDefault();
      openModal('<h2>Hint</h2><p>'+escapeHtml(hintText())+'</p><button class="btn primary wide" data-act="close">OK</button>');
    }
  }
});

renderTitle();

</script>
</body>
</html>
