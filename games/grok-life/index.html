<meta charset="utf-8"/>

<title>Grok Life — Grok Games</title>
<style>
:root{
  --ink:#111; --muted:#667; --line:#e6e6e6; --bg:#fff; --soft:#f6f6f6;
  --good:#1f6b46; --bad:#8a1f1f; --gold:#c6a75a; --accent:#111;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI","Inter Tight",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
a.back{color:var(--ink);text-decoration:none;font-size:12px;letter-spacing:.04em;border-bottom:1px solid #ddd}
a.back:hover{border-bottom-color:#111}
.wrap{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:10px 14px 76px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;padding-bottom:8px}
.word{margin:0;font-size:18px;letter-spacing:.16em;font-weight:700}
.top-actions{margin-left:auto;display:flex;gap:6px}
.btn{appearance:none;border:1px solid #111;background:#fff;color:#111;padding:7px 12px;border-radius:8px;cursor:pointer;letter-spacing:.03em;font-size:13px}
.btn.primary{background:#111;color:#fff}
.btn.gold{background:#111;color:#fff}
.btn.danger{border-color:#8a1f1f;color:#8a1f1f}
.btn:disabled{opacity:.4;cursor:default}
.btn.wide{width:100%;padding:12px;font-size:16px;letter-spacing:.08em;font-weight:700}
.hero{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.who{display:flex;gap:12px;align-items:center}
.avatar{width:54px;height:54px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;letter-spacing:.04em;flex:0 0 auto}
.who h2{margin:0;font-size:18px}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.money{font-weight:700;font-variant-numeric:tabular-nums}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:10px}
.bar label{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.track{height:8px;background:#ececec;border-radius:99px;overflow:hidden;margin-top:3px}
.track>i{display:block;height:100%;background:#111;border-radius:99px;width:0;transition:width .25s ease}
.age-row{margin:12px 0 10px}
.log{flex:1}
.year-block{border-top:1px solid var(--line);padding:10px 0}
.year-block h3{margin:0 0 6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.event{font-size:14px;line-height:1.45;margin:0 0 8px}
.event strong{font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);max-width:640px;margin:0 auto;padding:4px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{appearance:none;border:0;background:none;padding:6px 2px;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.nav button.on{color:#111;font-weight:700}
.nav .ico{display:block;width:20px;height:20px;margin:0 auto 2px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none!important}
.panel{background:#fff;width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 24px;box-shadow:0 -8px 30px rgba(0,0,0,.12)}
.panel h2,.panel h3{margin:0 0 8px}
.list{display:flex;flex-direction:column;gap:8px}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.card h4{margin:0 0 2px;font-size:15px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.muted{color:var(--muted);font-size:12px}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.choices .btn{text-align:left}
.fine{font-size:12px;color:var(--muted);margin:8px 0 0}
.badge{display:inline-block;border:1px solid #111;border-radius:99px;padding:1px 7px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.ribbons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.ribbon{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px}
.ribbon b{display:block}
.saves li{list-style:none;margin:0 0 8px}
.saves ul{margin:0;padding:0}
.title-screen{padding:20px 8px 24px;text-align:center}
.title-screen h1{letter-spacing:.16em;font-size:36px;margin:18px 0 8px}
.stat-num{font-variant-numeric:tabular-nums}
.hidden-k{display:none}
.jail-banner{background:#111;color:#fff;border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.perf{height:6px;background:#ececec;border-radius:99px;overflow:hidden}
.perf>i{display:block;height:100%;background:#1f6b46}
.danger-fill{background:#8a1f1f}
@media(min-width:700px){
  .sheet{align-items:center}
  .panel{border-radius:16px;max-height:80vh}
}

/* extras */
.kicker{letter-spacing:.18em;font-size:11px;color:var(--muted);text-transform:uppercase}
.title-screen .lead{color:#333;max-width:28em;margin:0 auto 18px;line-height:1.45}
.title-actions{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:16px}
.title-actions .btn{min-width:240px}
.fine.print{margin-top:28px}
.age-label{font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.stat-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:8px}
.pill{border:1px solid var(--line);border-radius:99px;padding:2px 8px;font-size:11px;color:var(--muted)}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px}
.list.tight .card{padding:8px 10px}
.person-name{font-weight:700}
.rel-track{height:6px;background:#ececec;border-radius:99px;overflow:hidden;margin-top:4px}
.rel-track>i{display:block;height:100%;background:#111;border-radius:99px}
.choice-note{font-size:12px;color:var(--muted);margin:0 0 4px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 12px;border-radius:8px;font-size:13px;z-index:30;max-width:90%}
.dead-hero{text-align:center;padding:8px 0 4px}
.dead-hero h2{font-size:22px;margin:8px 0 4px}
.summary{font-size:14px;line-height:1.5}
.money.neg{color:var(--bad)}
.job-title{font-weight:700}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.icon-btn{width:20px;height:20px;margin:0 auto 2px;display:block}
.nav svg{display:block;margin:0 auto 2px}
.panel .fine{margin-top:14px}
.wrap.playing{padding-bottom:88px}
.flash-good .track>i{background:var(--good)}
details.year-block{border-top:1px solid var(--line);padding:10px 0}
details.year-block summary{cursor:pointer;list-style:none;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
details.year-block summary::-webkit-details-marker{display:none}
.event + .event{margin-top:8px}
.tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:6px}

</style>
</head>

      btn("Work hard", "", 'data-act="hard"') + btn("Take it easy", "", 'data-act="easy"') +
      btn("Ask for a raise", "", 'data-act="raise"') + btn("Quit", "danger", 'data-act="quit"') +
      (s.age >= 55 ? btn("Retire", "", 'data-act="retire"') : "") +
      "</div></div>"
    ) : '<div class="card"><h4>No job right now</h4><p class="muted">Apply below, start a small business, or run for office.</p>' +
      (s.retired ? '<div class="muted">You have retired.</div>' : "") + "</div>";
    var biz = s.business ? (
      '<div class="card"><h4>' + esc(s.business.name) + "</h4><div class=\"muted\">Income " + Life.money(s.business.income) + " · Value " + Life.money(s.business.value) + "</div>" +
      btn("Sell the business", "", 'data-act="sellBiz"') + "</div>"
    ) : '<div class="card"><h4>Start a business</h4><p class="muted">A modest shop or studio. Upfront cost varies.</p>' + btn("Open the doors", "primary", 'data-act="startBiz"') + "</div>";
    return panelWrap("Career",
      '<div class="list">' + jobCard + biz +
      '<div class="card"><h4>Run for office</h4><p class="muted">Campaigns cost money. A cleaner record and a public voice help.</p><div class="row" style="flex-wrap:wrap;gap:6px;margin-top:8px">' + officeBtns + "</div></div>" +
      "<h3 class=\"kicker\">Openings</h3>" + jobs +
      "</div>"
    );
  }

  function personCard(p) {
    var acts = ["compliment", "hang", "gift", "argue"].map(function (k) {
      return btn(k === "hang" ? "Hang out" : k.charAt(0).toUpperCase() + k.slice(1), "", 'data-act="rel" data-id="' + esc(p.id) + '" data-kind="' + k + '"');
    }).join(" ");
    var extra = "";
    if (p.role === "friend" && !Life.getState().people.some(function () { return false; })) {
      extra = btn("Ask out", "", 'data-act="date" data-id="' + esc(p.id) + '"');
    }
    if (p.role === "friend") extra = btn("Ask out", "", 'data-act="date" data-id="' + esc(p.id) + '"');
    return '<div class="card"><div class="row"><div><div class="person-name">' + esc(p.first + (p.last ? " " + p.last : "")) + '</div><div class="muted">' + esc(p.role) + (p.kind ? " · " + p.kind : "") + " · age " + p.age + (p.engaged ? " · engaged" : "") + "</div></div><span class=\"pill\">" + (p.rel | 0) + "</span></div>" +
      '<div class="rel-track"><i style="width:' + (p.rel | 0) + '%"></i></div>' +
      '<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:8px">' + acts + extra + "</div></div>";
  }

  function peoplePanel(s) {
    var groups = [
      ["Family", function (p) { return p.alive && (p.role === "mother" || p.role === "father" || p.role === "parent" || p.role === "sibling" || p.role === "grandparent"); }],
      ["Partner", function (p) { return p.alive && (p.role === "partner" || p.role === "spouse"); }],
      ["Children", function (p) { return p.alive && p.role === "child"; }],
      ["Friends", function (p) { return p.alive && p.role === "friend"; }],
      ["Pets", function (p) { return p.alive && p.role === "pet"; }]
    ];
    var body = groups.map(function (g) {
      var list = s.people.filter(g[1]);
      if (!list.length) return "";
      return "<h3 class=\"kicker\">" + g[0] + "</h3>" + list.map(personCard).join("");
    }).join("") || '<div class="empty">Your people will show up here.</div>';
    var partnerBtns = "";
    if (s.people.some(function (p) { return p.alive && p.role === "partner"; })) {
      partnerBtns = btn("Propose", "", 'data-act="propose"') + btn("Get married", "primary", 'data-act="marry"') + btn("Break up", "danger", 'data-act="breakup"');
    }
    if (s.people.some(function (p) { return p.alive && p.role === "spouse"; })) {
      partnerBtns += btn("Try for a child", "", 'data-act="kid"') + btn("Divorce", "danger", 'data-act="divorce"');
    }
    return panelWrap("People",
      '<div class="list">' +
      '<div class="card"><h4>This year</h4><div class="row" style="flex-wrap:wrap;gap:6px">' +
      btn("Meet someone", "", 'data-act="date"') +
      btn("Make a friend", "", 'data-act="friend"') +
      btn("Adopt a cat", "", 'data-act="pet" data-id="cat"') +
      btn("Adopt a dog", "", 'data-act="pet" data-id="dog"') +
      btn("Pet care", "", 'data-act="vet"') +
      partnerBtns +
      "</div></div>" + body + "</div>"
    );
  }

  function assetsPanel(s) {
    function owned(list, sellAct, label) {
      if (!list.length) return '<div class="empty">No ' + label + " yet.</div>";
      return list.map(function (item, i) {
        var extra = item.mortgage ? " · mortgage " + Life.money(item.mortgage) : "";
        return '<div class="card row"><div><h4>' + esc(item.name) + "</h4><div class=\"muted\">Value " + Life.money(item.value || item.price) + extra + "</div></div>" +
          btn("Sell", "", 'data-act="' + sellAct + '" data-n="' + i + '"') + "</div>";
      }).join("");
    }
    var houses = Life.world.houses.map(function (h) {
      var down = Math.round(h.price * h.down);
      return '<div class="card row"><div><h4>' + esc(h.name) + "</h4><div class=\"muted\">" + Life.money(h.price) + " · down " + Life.money(down) + "</div></div>" +
        btn("Mortgage", "primary", 'data-act="buyHouse" data-id="' + h.id + '" data-m="1"') +
        btn("Cash", "", 'data-act="buyHouse" data-id="' + h.id + '" data-m="0"') + "</div>";
    }).join("");
    var cars = Life.world.cars.map(function (c) {
      return '<div class="card row"><div><h4>' + esc(c.name) + "</h4><div class=\"muted\">" + Life.money(c.price) + "</div></div>" +
        btn("Buy", "primary", 'data-act="buyCar" data-id="' + c.id + '"') + "</div>";
    }).join("");
    var jewels = Life.world.jewel.map(function (j) {
      return '<div class="card row"><div><h4>' + esc(j.name) + "</h4><div class=\"muted\">" + Life.money(j.price) + "</div></div>" +
        btn("Buy", "primary", 'data-act="buyJewel" data-id="' + j.id + '"') + "</div>";
    }).join("");
    return panelWrap("Assets",
      '<div class="list">' +
      '<div class="card"><h4>License</h4><p class="muted">' + (s.license ? "You have a driver's license." : "You can take the test from age 16.") + "</p>" +
      (s.license ? "" : btn("Take the driving test", "primary", 'data-act="license"')) + "</div>" +
      "<h3 class=\"kicker\">Your property</h3>" +
      owned(s.houses, "sellHouse", "houses") + owned(s.cars, "sellCar", "cars") + owned(s.jewelry, "sellJewel", "jewelry") +
      "<h3 class=\"kicker\">Houses</h3>" + houses +
      "<h3 class=\"kicker\">Cars</h3>" + cars +
      "<h3 class=\"kicker\">Jewelry</h3>" + jewels +
      "</div>"
    );
  }

  function choiceSheet(pending) {
    var choices = (pending.choices || []).map(function (c, i) {
      return btn(esc(c.label), i === 0 ? "primary wide" : "wide", 'data-act="choose" data-n="' + i + '"');
    }).join("");
    return '<div class="sheet" id="choice"><div class="panel" role="dialog" aria-modal="true">' +
      '<h2>A decision</h2><p class="event">' + esc(pending.text) + "</p>" +
      '<div class="choices">' + choices + "</div></div></div>";
  }

  function deathView(s) {
    var ribbons = (s.ribbons || []).map(function (r) {
      return '<div class="ribbon"><b>' + esc(r.title) + "</b><span class=\"muted\">" + esc(r.note) + "</span></div>";
    }).join("") || "";
    var kids = (s.people || []).filter(function (p) { return p.role === "child" && p.alive; });
    var kidBtns = kids.map(function (k) {
      return btn("Continue as " + esc(k.first), "primary wide", 'data-act="heir" data-id="' + esc(k.id) + '"');
    }).join("");
    return (
      '<div class="wrap"><header class="top"><a class="back" href="../../index.html">Back to Grok Games</a><h1 class="word">GROK LIFE</h1></header>' +
      '<div class="dead-hero"><div class="kicker">The story ends</div><h2>' + esc(s.first + " " + s.last) + "</h2>" +
      '<p class="summary">Died at ' + s.age + " in " + esc(s.city) + ", " + esc(s.country) + ", from " + esc(s.cause) + ". " +
      "Happiness " + (s.hap | 0) + ", health " + (s.hp | 0) + ", smarts " + (s.smarts | 0) + ", looks " + (s.looks | 0) + ". " +
      "Money on hand " + Life.money(s.money) + ".</p></div>" +
      '<h3 class="kicker">Ribbons</h3><div class="ribbons">' + ribbons + "</div>" +
      (kidBtns ? '<h3 class="kicker">The next generation</h3>' + kidBtns : '<p class="muted">No living child to continue as. Start a new life whenever you like.</p>') +
      '<div class="title-actions">' + btn("Save this life", "wide", 'data-act="save"') + btn("New Life", "primary wide", 'data-act="new"') + btn("Back to title", "wide", 'data-act="title"') + "</div>" +
      '<h3 class="kicker" style="margin-top:18px">The years</h3><div class="log">' + logView(s) + "</div></div>"
    );
  }

  function playView(s) {
    var ageDisabled = !s.alive || (s.pending && s.pending.length) ? " disabled" : "";
    var jail = s.held ? '<div class="jail-banner">You are in a county facility. ' + s.heldYears + (s.heldYears === 1 ? " year" : " years") + " remaining.</div>" : "";
    var sheetHtml = "";
    if (sheet === "play") sheetHtml = activitiesPanel(s);
    if (sheet === "school") sheetHtml = eduPanel(s);
    if (sheet === "work") sheetHtml = workPanel(s);
    if (sheet === "people") sheetHtml = peoplePanel(s);
    if (sheet === "stuff") sheetHtml = assetsPanel(s);
    if (s.pending && s.pending.length) sheetHtml += choiceSheet(s.pending[0]);
    return (
      '<div class="wrap playing"><header class="top"><a class="back" href="../../index.html">Back to Grok Games</a><h1 class="word">GROK LIFE</h1>' +
      '<div class="top-actions">' + btn("Save", "", 'data-act="save"') + btn("Menu", "", 'data-act="title"') + "</div></header>" +
      hero(s) + jail +
      '<div class="age-row">' + btn("Age Up", "primary wide", 'data-act="age"' + ageDisabled) + "</div>" +
      '<div class="log">' + logView(s) + "</div></div>" +
      navBar() + sheetHtml +
      '<div class="toast" id="toast"' + (notice ? "" : " hidden") + ">" + esc(notice) + "</div>"
    );
  }

  function render() {
    if (!root) return;
    var s = Life.getState();
    if (view === "play" && s && !s.alive) view = "dead";
    if (view === "title") root.innerHTML = renderTitle();
    else if (view === "dead" && s) root.innerHTML = deathView(s);
    else if (s) root.innerHTML = playView(s);
    else root.innerHTML = renderTitle();
    bind();
  }

  function bind() {
    root.onclick = function (e) {
      var t = e.target.closest("[data-act], [data-tab]");
      if (!t) return;
      if (t.dataset.tab) {
        tab = t.dataset.tab;
        sheet = tab === "life" ? null : tab;
        render();
        return;
      }
      var act = t.dataset.act;
      var id = t.dataset.id;
      var n = t.dataset.n;
      var kind = t.dataset.kind;
      switch (act) {
        case "new": startNew(); break;
        case "continue": resumeAuto(); break;
        case "title": goTitle(); break;
        case "close": sheet = null; tab = "life"; render(); break;
        case "age": {
          var r = Life.ageUp();
          if (r && r.error) toast(r.error);
          var st = Life.getState();
          if (st && !st.alive) view = "dead";
          render();
          break;
        }
        case "choose": Life.choose(+n); if (Life.getState() && !Life.getState().alive) view = "dead"; render(); break;
        case "save": {
          var saved = Life.saves.save(currentSlot);
          if (saved.ok) { currentSlot = saved.id; toast("Life saved."); } else toast(saved.msg || "Could not save.");
          render();
          break;
        }
        case "load":
          if (Life.saves.load(id).ok) {
            currentSlot = id;
            view = Life.getState().alive ? "play" : "dead";
            render();
          }
          break;
        case "delete": Life.saves.remove(id); render(); break;
        case "heir":
          if (Life.continueAs(id).ok) { view = "play"; tab = "life"; sheet = null; render(); }
          else toast("That child is not available.");
          break;
        case "gym": result(Life.act.gym(), "You trained."); break;
        case "library": result(Life.act.library(), "You read."); break;
        case "meditate": result(Life.act.meditate(), "You sat quietly."); break;
        case "doctor": result(Life.act.doctor()); break;
        case "surgery": result(Life.act.surgery()); break;
        case "vac": result(Life.act.vacation(id)); break;
        case "lottery": result(Life.act.lottery()); break;
        case "casino": result(Life.act.casino(+n)); break;
        case "risk": result(Life.act.risk(id)); break;
        case "license": result(Life.act.license()); break;
        case "study": result(Life.edu.study()); break;
        case "practice": result(Life.edu.practice()); break;
        case "club": result(Life.edu.joinClub(id)); break;
        case "sport": result(Life.edu.joinSport(id)); break;
        case "applyCol": result(Life.edu.applyCollege()); break;
        case "enroll": result(Life.edu.enroll(id)); break;
        case "scholarship": result(Life.edu.scholarship()); break;
        case "loan": result(Life.edu.takeLoan(+n)); break;
        case "grad": result(Life.edu.applyGrad(id)); break;
        case "dropout": result(Life.edu.dropout()); break;
        case "applyJob": result(Life.work.apply(id)); break;
        case "hard": result(Life.work.hard()); break;
        case "easy": result(Life.work.easy()); break;
        case "raise": result(Life.work.raise()); break;
        case "quit": result(Life.work.quit()); break;
        case "retire": result(Life.work.retire()); break;
        case "startBiz": result(Life.work.startBusiness()); break;
        case "sellBiz": result(Life.work.sellBusiness()); break;
        case "run": result(Life.work.runFor(id)); break;
        case "rel": result(Life.rel.interact(id, kind)); break;
        case "date": result(Life.rel.date(id || undefined)); break;
        case "propose": result(Life.rel.propose()); break;
        case "marry": result(Life.rel.marry()); break;
        case "breakup": result(Life.rel.breakup()); break;
        case "divorce": result(Life.rel.divorce()); break;
        case "kid": result(Life.rel.tryKid()); break;
        case "friend": result(Life.rel.friend()); break;
        case "pet": result(Life.rel.adoptPet(id)); break;
        case "vet": result(Life.rel.carePet()); break;
        case "buyHouse": result(Life.assets.buyHouse(id, t.dataset.m !== "0")); break;
        case "sellHouse": result(Life.assets.sellHouse(+n)); break;
        case "buyCar": result(Life.assets.buyCar(id)); break;
        case "sellCar": result(Life.assets.sellCar(+n)); break;
        case "buyJewel": result(Life.assets.buyJewel(id)); break;
        case "sellJewel": result(Life.assets.sellJewel(+n)); break;
        default: break;
      }
    };
  }

  function mount(node) {
    root = typeof node === "string" ? document.querySelector(node) : node;
    view = "title";
    render();
  }

  global.LifeUI = { mount: mount, render: render };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
LifeUI.mount("#app");
</script>
</body>
</html>
