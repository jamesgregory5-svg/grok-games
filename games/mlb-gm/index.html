<html lang="en">

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>MLB GM Mode — Grok Games</title>
<style>
:root{
  --ink:#1c1914; --paper:#f4efe4; --panel:#fffaf1; --line:#d8cfc0;
  --muted:#6b6256; --copper:#8a5a2b; --good:#215c38; --bad:#8a2b2b;
  --navy:#1a2744; --gold:#c4a36a;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype","Palatino","Georgia",serif;
  -webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
a.back{color:var(--ink);text-decoration:none;font-size:12px;letter-spacing:.04em;border-bottom:1px solid var(--line);font-family:"Segoe UI",system-ui,sans-serif}
a.back:hover{border-bottom-color:var(--ink)}
.wrap{max-width:1120px;margin:0 auto;padding:12px 16px 32px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.word{margin:0;font-size:20px;letter-spacing:.14em;font-weight:700}
.fine{font-size:12px;color:var(--muted);margin:8px 0 0;font-family:"Segoe UI",system-ui,sans-serif}
.disclaimer{font-size:11px;color:var(--muted);margin:18px 0 0;text-align:center;font-family:"Segoe UI",system-ui,sans-serif}
h1,h2,h3{letter-spacing:.04em}
.hero{padding:28px 8px 10px;text-align:center}
.hero h1{font-size:42px;margin:0 0 8px;letter-spacing:.16em}
.hero p{max-width:560px;margin:0 auto 10px;line-height:1.5}
.leagues{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}
@media(max-width:760px){.leagues{grid-template-columns:1fr}}
.div-block h3{margin:12px 0 6px;font-size:13px;letter-spacing:.12em;color:var(--copper);text-transform:uppercase}
.team-list{display:grid;gap:6px}
.team-btn{appearance:none;border:1px solid var(--line);background:var(--panel);text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.team-btn:hover{border-color:var(--ink)}
.team-btn .city{font-size:12px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:12px 0;font-family:"Segoe UI",system-ui,sans-serif;font-size:13px}
.bar strong{font-size:14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.tabs button,.btn{appearance:none;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;font-family:"Segoe UI",system-ui,sans-serif;font-size:13px;letter-spacing:.03em}
.tabs button.on,.btn.primary{background:var(--navy);color:#f4efe4;border-color:var(--navy)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
table{width:100%;border-collapse:collapse;font-family:"Segoe UI",system-ui,sans-serif;font-size:13px}
th,td{padding:5px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
tr.orig td:first-child{box-shadow:inset 3px 0 0 var(--copper)}
tr.sel{background:#efe4ce}
.badge{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--copper);color:var(--copper);padding:1px 5px;border-radius:4px;margin-left:6px}
.badge.ws{border-color:var(--gold);color:#7a5b20;background:#f3e6c4}
.ovr{font-variant-numeric:tabular-nums;font-weight:700}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
.slot{border:1px dashed var(--line);border-radius:8px;padding:6px 8px;cursor:pointer;min-height:36px;background:#fff}
.slot.on{border-style:solid;border-color:var(--navy);background:#eef2f8}
.log p{margin:0 0 6px;font-size:13px;line-height:1.4}
.toast{padding:8px 10px;border-radius:8px;background:#efe4ce;margin:8px 0;font-family:"Segoe UI",system-ui,sans-serif;font-size:13px}
.toast.bad{background:#f6e4e4;color:var(--bad)}
.toast.good{background:#e4f0e7;color:var(--good)}
select{padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:#fff}
.status{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;margin:-4px 0 12px;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-family:"Segoe UI",system-ui,sans-serif;font-size:14px}
.status .k{display:block;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:1px}
.status strong{font-size:15px}
.status-flag{align-self:center;font-size:10px;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:3px 7px;font-weight:700}
.status-flag.clinch{border:1px solid var(--good);color:var(--good)}
.status-flag.out{border:1px solid var(--bad);color:var(--bad)}

</style>
</head>

      const ovrs = ros.map(function (p) { return p.ovr; }).sort(function (a, b) { return b - a; });

      const top8 = n ? ovrs.slice(0, n).reduce(function (s, x) { return s + x; }, 0) / n : 70;
      const pay = payrollOf(ros.map(function (p) { return p.id; }), state.players);
      const st = state.standings && state.standings[String(tid)];
      const gp = st ? (st.gp || 0) : 0;
      const pct = st && gp >= 20 ? st.w / gp : null;
      if ((pct != null && pct < 0.42) || top8 < 76.5) return "rebuild";
      if ((pct != null && pct > 0.55) || (top8 >= 82 && pay > cap - 40) || top8 >= 80.5) return "contend";
      return "mid";
    }

    function teamNeeds(rosterIds, players) {
      const groups = { C: 0, IF: 0, OF: 0, DH: 0, SP: 0, RP: 0 };
      const best = {};
      for (const id of rosterIds) {
        const p = players[String(id)];
        if (!p) continue;
        const g = p.pos === "C" ? "C"
          : (p.pos === "SP" || p.pos === "P") ? "SP"
          : (p.pos === "RP" || p.pos === "CL") ? "RP"
          : (p.pos === "TWP") ? "SP"
          : p.pos === "DH" ? "DH"
          : (p.pos === "LF" || p.pos === "CF" || p.pos === "RF") ? "OF"
          : "IF";
        groups[g] = (groups[g] || 0) + 1;
        if (!best[p.pos] || p.ovr > best[p.pos]) best[p.pos] = p.ovr;
        if (p.pos === "TWP") {
          groups.DH++;
          if (!best.DH || p.ovr > best.DH) best.DH = p.ovr;
        }
      }
      const want = [];
      if ((best.C || 0) < 72 || groups.C < 2) want.push("C");
      if ((best.SS || 0) < 72) want.push("SS");
      if ((best.CF || 0) < 72) want.push("CF");
      if ((groups.SP || 0) < 5 || Math.max(0, ...rosterIds.map((id) => (players[String(id)] && players[String(id)].pos === "SP") ? players[String(id)].ovr : 0)) < 75) want.push("SP");
      if ((groups.RP || 0) < 6) want.push("RP");
      ["1B", "2B", "3B", "LF", "RF"].forEach((pos) => { if ((best[pos] || 0) < 70) want.push(pos); });
      return { groups, best, want };
    }

    function fillsNeed(p, needs) {
      if (!p) return false;
      if (needs.want.indexOf(p.pos) >= 0) return true;
      if (p.pos === "TWP" && (needs.want.indexOf("SP") >= 0 || needs.want.indexOf("DH") >= 0)) return true;
      if ((p.pos === "LF" || p.pos === "CF" || p.pos === "RF") && needs.want.some((w) => w === "LF" || w === "CF" || w === "RF")) return true;
      return false;
    }

    function evaluateTrade(state, fromId, giveIds, getIds, opts) {
      opts = opts || {};
      const players = state.players;
      const aiRoster = state.rosters[String(fromId)].slice();
      const userId = state.userTeam;
      const userRoster = state.rosters[String(userId)].slice();

      function hasAll(ros, ids) {
        return ids.every((id) => ros.indexOf(id) >= 0);
      }
      if (!hasAll(userRoster, giveIds)) return { ok: false, reason: "Those players are not all on your roster.", code: "missing" };
      if (!hasAll(aiRoster, getIds)) return { ok: false, reason: "Those players are not all on their roster.", code: "missing" };
      if (!giveIds.length && !getIds.length) return { ok: false, reason: "A trade needs at least one player.", code: "empty" };
      if (!giveIds.length) return { ok: false, reason: "They won't just give players away.", code: "empty" };

      const give = giveIds.map((id) => players[String(id)]);
      const get = getIds.map((id) => players[String(id)]);
      const posture = aiPosture(state, fromId);
      const starOut = get.slice().sort((a, b) => b.ovr - a.ovr)[0];
      const starIn = give.slice().sort((a, b) => b.ovr - a.ovr)[0];
      let giveVal = packageValue(give, posture, starOut);
      let getVal = packageValue(get, posture, null);
      const givePay = give.reduce((s, p) => s + (p.aav || 0), 0);
      const getPay = get.reduce((s, p) => s + (p.aav || 0), 0);

      const aiAfter = aiRoster.filter((id) => getIds.indexOf(id) < 0).concat(giveIds);
      const userAfter = userRoster.filter((id) => giveIds.indexOf(id) < 0).concat(getIds);
      if (aiAfter.length > 40) return { ok: false, reason: "That would put them over the 40-man roster.", code: "roster" };
      if (userAfter.length > 40) return { ok: false, reason: "That would put you over the 40-man roster. Move someone out first.", code: "roster" };

      const aiPay = payrollOf(aiAfter, players);
      const userPay = payrollOf(userAfter, players);
      const aiNow = payrollOf(aiRoster, players);
      const salaryBlocked = aiPay > cap && aiPay > aiNow + 0.5 && givePay > getPay + 3;

      const needs = teamNeeds(aiRoster, players);
      const incomingNeed = give.filter((p) => fillsNeed(p, needs)).length;
      const sellingVet = posture === "rebuild" && get.some((p) => (p.age || 27) >= 30 && p.ovr >= 78);
      const buyingWinNow = posture === "contend" && starIn && starIn.ovr >= 84 && incomingNeed;

      if (sellingVet) getVal *= 0.84;
      if (buyingWinNow) giveVal *= 1.08;
      if (posture === "rebuild" && give.every((p) => (p.age || 27) <= 25)) giveVal *= 1.1;
      if (posture === "contend" && starOut && starOut.ovr >= 86) getVal *= 1.08;

      if (starOut && starOut.ovr >= 86 && giveVal < getVal * 0.98) {
        return { ok: false, reason: "We're not moving " + starOut.name + " for a pile of lesser pieces. We need a real headliner or a prospect haul.", code: "star", giveVal, getVal, posture, counter: opts.skipCounter ? null : counterOffer(state, fromId, giveIds, getIds) };
      }

      let threshold = posture === "contend" ? 0.94 : posture === "rebuild" ? 0.9 : 0.95;
      if (buyingWinNow) threshold -= 0.06;
      if (sellingVet) threshold -= 0.05;
      if (incomingNeed) threshold -= 0.03;
      if (starOut && starOut.ovr >= 82) threshold += 0.03;

      if (!salaryBlocked && giveVal + 0.0001 >= getVal * threshold) {
        return { ok: true, reason: "You have a deal.", code: "accept", giveVal, getVal, aiPay, userPay, posture };
      }

      let reason;
      if (salaryBlocked) reason = "We're not taking on that much extra salary — we're up against the cap.";
      else if (posture === "rebuild" && starOut && give.some((p) => (p.age || 27) >= 32)) reason = "We're rebuilding. We want young players with years of control, not more aging salary.";
      else if (posture === "contend" && starOut && give.every((p) => isProspect(p) || p.ovr < 75)) reason = "We're trying to win now. Prospects alone aren't enough for " + starOut.name + ".";
      else if (getVal > giveVal * 1.2) reason = "That's not enough value coming back for " + (starOut ? starOut.name : "our players") + ".";
      else reason = "That's not a fair trade for us.";
      return { ok: false, reason, code: salaryBlocked ? "salary" : "value", giveVal, getVal, posture, counter: opts.skipCounter ? null : counterOffer(state, fromId, giveIds, getIds) };
    }

    function counterOffer(state, fromId, giveIds, getIds) {
      const players = state.players;
      const aiRoster = state.rosters[String(fromId)];
      const userRoster = state.rosters[String(state.userTeam)];
      const used = new Set(giveIds.concat(getIds).map(String));
      const aiPool = aiRoster.filter((id) => !used.has(String(id))).map((id) => players[String(id)]).filter(Boolean).sort((a, b) => a.ovr - b.ovr);
      const userPool = userRoster.filter((id) => !used.has(String(id))).map((id) => players[String(id)]).filter(Boolean).sort((a, b) => b.ovr - a.ovr);
      for (const extra of userPool) {
        if (extra.ovr < 62 || extra.ovr > 84) continue;
        const trial = evaluateTradeSimple(state, fromId, giveIds.concat([extra.id]), getIds);
        if (trial.ok) {
          return { giveIds: giveIds.concat([extra.id]), getIds: getIds.slice(), note: "We'll do it if you include " + extra.name + "." };
        }
      }
      if (getIds.length > 1) {
        const sorted = getIds.map((id) => players[String(id)]).sort((a, b) => a.ovr - b.ovr);
        const dropped = sorted[0].id;
        const next = getIds.filter((id) => id !== dropped);
        const trial = evaluateTradeSimple(state, fromId, giveIds, next);
        if (trial.ok) {
          return { giveIds: giveIds.slice(), getIds: next, note: "We'll do it without " + sorted[0].name + "." };
        }
      }
      for (const extra of aiPool) {
        if (extra.ovr > 70 || extra.ovr < 58) continue;
        const trial = evaluateTradeSimple(state, fromId, giveIds, getIds.concat([extra.id]));
        if (trial.ok) {
          return { giveIds: giveIds.slice(), getIds: getIds.concat([extra.id]), note: "Add " + extra.name + " and we can talk." };
        }
      }
      return null;
    }

    function evaluateTradeSimple(state, fromId, giveIds, getIds) {
      const ev = evaluateTrade(state, fromId, giveIds, getIds, { skipCounter: true });
      return { ok: !!(ev && ev.ok) };
    }

    function applyTrade(state, fromId, giveIds, getIds) {
      const ev = evaluateTrade(state, fromId, giveIds, getIds);
      if (!ev.ok) return ev;
      const userId = state.userTeam;
      state.rosters[String(userId)] = state.rosters[String(userId)].filter((id) => giveIds.indexOf(id) < 0).concat(getIds);
      state.rosters[String(fromId)] = state.rosters[String(fromId)].filter((id) => getIds.indexOf(id) < 0).concat(giveIds);
      giveIds.forEach((id) => { state.players[String(id)].teamId = fromId; });
      getIds.forEach((id) => { state.players[String(id)].teamId = userId; });
      autoLineup(state, userId);
      autoLineup(state, fromId);
      const namesG = giveIds.map((id) => state.players[String(id)].name).join(", ");
      const namesT = getIds.map((id) => state.players[String(id)].name).join(", ");
      const other = teamById[fromId].name;
      log(state, "Trade with the " + other + ": you send " + namesG + " and get " + namesT + ".");
      maybeBadge(state);
      return ev;
    }

    function faAsk(p) {
      const ovr = p.ovr || 70;
      const age = p.age || 28;
      let aav, years;
      if (ovr >= 93) { aav = 40 + (ovr - 93) * 3.5; years = 9; }
      else if (ovr >= 90) { aav = 32 + (ovr - 90) * 2.7; years = 8; }
      else if (ovr >= 87) { aav = 24 + (ovr - 87) * 2.5; years = 7; }
      else if (ovr >= 84) { aav = 16 + (ovr - 84) * 2.4; years = 6; }
      else if (ovr >= 80) { aav = 10 + (ovr - 80) * 1.5; years = 4; }
      else if (ovr >= 76) { aav = 6 + (ovr - 76) * 1.0; years = 3; }
      else if (ovr >= 72) { aav = 2.5 + (ovr - 72) * 0.85; years = 2; }
      else if (ovr >= 68) { aav = 1.2 + (ovr - 68) * 0.3; years = 1; }
      else { aav = 1.0; years = 1; }
      if (age >= 37) { years = Math.min(years, 1); aav *= 0.72; }
      else if (age >= 35) { years = Math.min(years, 2); aav *= 0.82; }
      else if (age >= 33) { years = Math.min(years, 3); aav *= 0.9; }
      else if (age <= 27 && ovr >= 84) { years = Math.min(10, years + 1); aav *= 1.06; }
      if (p.pos === "RP") { aav *= 0.78; years = Math.min(years, 3); }
      if (p.pos === "CL") { aav *= 0.9; years = Math.min(years, 3); }
      if (p.pos === "SP" && ovr >= 84) aav *= 1.06;
      if (p.pos === "C" && ovr >= 80) aav *= 1.04;
      aav = Math.round(Math.max(0.9, aav) * 10) / 10;
      years = Math.max(1, Math.round(years));
      return { years, aav };
    }

    function faBids(state, p) {
      if (!state.faBidMap) state.faBidMap = {};
      const key = String(p.id);
      if (state.faBidMap[key]) return state.faBidMap[key];
      const ask = faAsk(p);
      const bids = [];
      if (p.ovr >= 72) {
        const others = teams.filter((t) => t.id !== state.userTeam);
        others.forEach((t) => {
          const ros = state.rosters[String(t.id)] || [];
          const needs = teamNeeds(ros, state.players);
          const pay = payrollOf(ros, state.players);
          const room = cap - pay;
          const posture = aiPosture(state, t.id);
          let interest = fillsNeed(p, needs) ? 0.55 : 0.12;
          if (posture === "contend" && p.ovr >= 80 && (p.age || 28) <= 34) interest += 0.35;
          if (posture === "rebuild" && p.ovr >= 86 && (p.age || 28) <= 27) interest += 0.2;
          else if (posture === "rebuild") interest -= 0.2;
          if (room < ask.aav + 2) interest -= 0.45;
          const r = Math.abs(Math.sin((p.id * 17 + t.id * 13 + (state.userTeam || 0)) * 12.9898)) % 1;
          if (r < interest && room > ask.aav * 0.6) {
            const bump = (posture === "contend" ? 0.04 : 0) + r * 0.1 - 0.03;
            const aav = Math.round(Math.max(ask.aav * 0.92, ask.aav * (1 + bump)) * 10) / 10;
            let years = ask.years;
            if (r > 0.7 && (p.age || 28) < 33) years = Math.min(years + 1, 10);
            if (aav * years <= cap * 10) bids.push({ teamId: t.id, years, aav, total: years * aav });
          }
        });
        bids.sort((a, b) => b.total - a.total);
      }
      state.faBidMap[key] = bids.slice(0, 3);
      return state.faBidMap[key];
    }

    function signFA(state, pid, years, aav) {
      const p = state.players[String(pid)];
      if (!p || p.teamId != null) return { ok: false, reason: "That player is not a free agent." };
      years = Math.max(1, Math.round(Number(years) || 0));
      aav = Math.round((Number(aav) || 0) * 10) / 10;
      if (aav < 0.8) return { ok: false, reason: "That offer is not a real contract." };
      const ask = faAsk(p);
      const bids = faBids(state, p);
      const bestRival = bids[0] || null;
      const userTotal = years * aav;
      const askTotal = ask.years * ask.aav;
      if (aav < ask.aav * 0.88 || userTotal < askTotal * 0.85) {
        return { ok: false, reason: p.name + " wants " + ask.years + " years at $" + ask.aav.toFixed(1) + "M AAV and won't take a lowball.", code: "lowball" };
      }
      if (years <= ask.years - 2 && aav < ask.aav * 1.15) {
        return { ok: false, reason: p.name + " wants a longer guarantee unless the AAV comes up.", code: "years" };
      }
      const ros = state.rosters[String(state.userTeam)];
      if (ros.length >= 40) return { ok: false, reason: "Your 40-man roster is full. Release or trade someone first." };
      const pay = payrollOf(ros, state.players) + aav;
      if (pay > cap) return { ok: false, reason: "That signing would put you over the $" + cap + "M payroll cap." };
      if (bestRival && bestRival.total > userTotal * 1.02 && bestRival.total >= askTotal * 0.98) {
        const otherRos = state.rosters[String(bestRival.teamId)];
        if (otherRos && otherRos.length < 40 && payrollOf(otherRos, state.players) + bestRival.aav <= cap) {
          p.teamId = bestRival.teamId;
          p.years = bestRival.years;
          p.aav = bestRival.aav;
          p.kind = "vet";
          otherRos.push(pid);
          state.freeAgents = state.freeAgents.filter((id) => id !== pid);
          autoLineup(state, bestRival.teamId);
          const tname = teamById[bestRival.teamId] ? teamById[bestRival.teamId].name : "another club";
          log(state, p.name + " signed with the " + tname + " (" + bestRival.years + " yr, $" + bestRival.aav.toFixed(1) + "M AAV).");
          return { ok: false, reason: "The " + tname + " offered " + bestRival.years + " years at $" + bestRival.aav.toFixed(1) + "M AAV, and " + p.name + " took it.", code: "outbid" };
        }
      }
      p.teamId = state.userTeam;
      p.years = years;
      p.aav = aav;
      p.kind = "vet";
      ros.push(pid);
      state.freeAgents = state.freeAgents.filter((id) => id !== pid);
      autoLineup(state, state.userTeam);
      log(state, "Signed " + p.name + " for " + years + " year" + (years === 1 ? "" : "s") + " at $" + aav.toFixed(1) + "M AAV.");
      return { ok: true };
    }


    function release(state, pid) {
      const p = state.players[String(pid)];
      const ros = state.rosters[String(state.userTeam)];
      const ix = ros.indexOf(pid);
      if (ix < 0) return { ok: false, reason: "That player is not on your roster." };
      ros.splice(ix, 1);
      p.teamId = null;
      p.years = 0;
      p.aav = 0;
      p.kind = "fa";
      if (state.freeAgents.indexOf(pid) < 0) state.freeAgents.push(pid);
      autoLineup(state, state.userTeam);
      log(state, "Released " + p.name + ".");
      maybeBadge(state);
      return { ok: true };
    }

    function autoLineup(state, tid) {
      const ros = state.rosters[String(tid)].map((id) => state.players[String(id)]).filter(Boolean);
      const bats = ros.filter(canHit).slice().sort((a, b) => b.ovr - a.ovr);
      const used = new Set();
      const lineup = [];
      function take(pred) {
        const p = bats.find((x) => !used.has(x.id) && pred(x));
        if (p) { used.add(p.id); return p; }
        return null;
      }
      const slots = [
        ["C", (p) => p.pos === "C"],
        ["1B", (p) => p.pos === "1B"],
        ["2B", (p) => p.pos === "2B"],
        ["3B", (p) => p.pos === "3B"],
        ["SS", (p) => p.pos === "SS"],
        ["LF", (p) => p.pos === "LF"],
        ["CF", (p) => p.pos === "CF"],
        ["RF", (p) => p.pos === "RF"],
        ["DH", (p) => true]
      ];
      const flex = (p) => !PITCH_POS.has(p.pos) || p.pos === "TWP";
      for (const [pos, pred] of slots) {
        let p = take(pred);
        if (!p) p = take((x) => flex(x) && (pos === "DH" || true));
        if (p) lineup.push({ id: p.id, pos });
      }
      const sps = ros.filter((p) => p.pos === "SP" || p.pos === "TWP").sort((a, b) => b.ovr - a.ovr);
      const rps = ros.filter((p) => p.pos === "RP" || p.pos === "CL").sort((a, b) => b.ovr - a.ovr);
      const rotation = sps.slice(0, 5).map((p) => p.id);
      if (rotation.length < 5) {
        ros.filter((p) => canPitch(p) && rotation.indexOf(p.id) < 0).sort((a, b) => b.ovr - a.ovr).forEach((p) => {
          if (rotation.length < 5) rotation.push(p.id);
        });
      }
      const bullpen = rps.map((p) => p.id);
      if (!state.lineups) state.lineups = {};
      if (!state.rotations) state.rotations = {};
      if (!state.bullpens) state.bullpens = {};
      state.lineups[String(tid)] = lineup;
      state.rotations[String(tid)] = rotation;
      state.bullpens[String(tid)] = bullpen;
    }

    function offenseOvr(state, tid) {
      const lu = state.lineups[String(tid)] || [];
      if (!lu.length) return 68;
      const ov = lu.map((s) => (state.players[String(s.id)] || { ovr: 60 }).ovr);
      return ov.reduce((a, b) => a + b, 0) / ov.length;
    }
    function starterOvr(state, tid, gameIndex) {
      const rot = state.rotations[String(tid)] || [];
      if (!rot.length) return 65;
      const id = rot[gameIndex % rot.length];
      return (state.players[String(id)] || { ovr: 65 }).ovr;
    }
    function bullpenOvr(state, tid) {
      const bp = (state.bullpens[String(tid)] || []).slice(0, 6);
      if (!bp.length) return 65;
      return bp.reduce((s, id) => s + (state.players[String(id)] || { ovr: 65 }).ovr, 0) / bp.length;
    }

    function simGame(state, homeId, awayId, day) {
      const hi = offenseOvr(state, homeId);
      const ai = offenseOvr(state, awayId);
      const hp = starterOvr(state, homeId, day) * 0.7 + bullpenOvr(state, homeId) * 0.3;
      const ap = starterOvr(state, awayId, day) * 0.7 + bullpenOvr(state, awayId) * 0.3;
      const homeExp = clampNum(4.35 + (hi - 72) * 0.11 + (72 - ap) * 0.11 + 0.08, 1.5, 8.5);
      const awayExp = clampNum(4.35 + (ai - 72) * 0.11 + (72 - hp) * 0.11, 1.5, 8.5);
      let hr = poisson(homeExp), ar = poisson(awayExp);
      let inn = 9;
      while (hr === ar) {
        inn++;
        hr += poisson(homeExp / 9);
        ar += poisson(awayExp / 9);
        if (inn > 16) { if (hr === ar) hr++; break; }
      }
      return { homeId, awayId, home: hr, away: ar, inn, day };
    }
    function clampNum(n, a, b) { return n < a ? a : n > b ? b : n; }

    function applyResult(state, g) {
      const hs = stand(state, g.homeId);
      const as = stand(state, g.awayId);
      if (g.home > g.away) { hs.w++; as.l++; }
      else { as.w++; hs.l++; }
      hs.rs += g.home; hs.ra += g.away;
      as.rs += g.away; as.ra += g.home;
      hs.gp++; as.gp++;
      state.games.push(g);
    }
    function stand(state, tid) {
      const s = state.standings[String(tid)];
      return s;
    }

    function emptyStandings() {
      const o = {};
      teams.forEach((t) => {
        o[String(t.id)] = { id: t.id, w: 0, l: 0, rs: 0, ra: 0, gp: 0 };
      });
      return o;
    }

    function makeSchedule() {
      // Build home/away game list then pack into days.
      const ids = teams.map((t) => t.id);
      const pairGames = []; // {home, away}
      function addN(a, b, n) {
        const homeA = Math.ceil(n / 2);
        for (let i = 0; i < n; i++) {
          if (i < homeA) pairGames.push({ home: a, away: b });
          else pairGames.push({ home: b, away: a });
        }
      }
      const rivals = { 145: 112, 112: 145, 147: 121, 121: 147, 108: 119, 119: 108, 137: 133, 133: 137, 110: 120, 120: 110, 118: 138, 138: 118, 111: 144, 144: 111, 141: 146, 146: 141 };
      for (let i = 0; i < ids.length; i++) {
        for (let j = i + 1; j < ids.length; j++) {
          const a = teamById[ids[i]], b = teamById[ids[j]];
          let n;
          if (a.league === b.league && a.division === b.division) n = 13;
          else if (a.league === b.league) n = 6;
          else n = (rivals[a.id] === b.id) ? 4 : 3;
          addN(a.id, b.id, n);
        }
      }
      // Fix interleague counts to 50 per team (52+60 already = 112, need 50)
      // Current interleague may be 3*15 - adjustments with 4-game rivals.
      const counts = Object.fromEntries(ids.map((id) => [id, 0]));
      pairGames.forEach((g) => { counts[g.home]++; counts[g.away]++; });
      // If some teams aren't at 162, add or trim interleague
      function interGamesOf(tid) {
        return pairGames.filter((g) => (g.home === tid || g.away === tid) && teamById[g.home].league !== teamById[g.away].league);
      }
      ids.forEach((tid) => {
        let guard = 0;
        while (counts[tid] < 162 && guard++ < 40) {
          // add an interleague game vs a team that also needs games
          const others = ids.filter((oid) => oid !== tid && teamById[oid].league !== teamById[tid].league && counts[oid] < 162);
          if (!others.length) break;
          others.sort((a, b) => counts[a] - counts[b]);
          const oid = others[0];
          const home = counts[tid] % 2 === 0 ? tid : oid;
          const away = home === tid ? oid : tid;
          pairGames.push({ home, away });
          counts[tid]++; counts[oid]++;
        }
        while (counts[tid] > 162 && guard++ < 80) {
          const ix = pairGames.findIndex((g) => (g.home === tid || g.away === tid) && teamById[g.home].league !== teamById[g.away].league && counts[g.home] > 162 && counts[g.away] > 162);
          if (ix < 0) break;
          const g = pairGames.splice(ix, 1)[0];
          counts[g.home]--; counts[g.away]--;
        }
      });

      // Pack into series-based days. ~186 calendar days.
      const remaining = pairGames.slice();
      // shuffle stably with crypto
      for (let i = remaining.length - 1; i > 0; i--) {
        const j = randInt(i + 1);
        const tmp = remaining[i]; remaining[i] = remaining[j]; remaining[j] = tmp;
      }
      const days = [];
      const usedToday = new Set();
      let day = [];
      const lastPlay = Object.fromEntries(ids.map((id) => [id, -2]));
      let dayNum = 0;
      let safety = 0;
      while (remaining.length && safety++ < 200000) {
        let placed = false;
        for (let i = 0; i < remaining.length; i++) {
          const g = remaining[i];
          if (usedToday.has(g.home) || usedToday.has(g.away)) continue;
          // avoid 20 straight days: allow if last was yesterday or off
          day.push(g);
          usedToday.add(g.home); usedToday.add(g.away);
          remaining.splice(i, 1);
          placed = true;
          break;
        }
        if (!placed || usedToday.size >= 30 || day.length >= 15) {
          days.push(day);
          day.forEach((g) => { lastPlay[g.home] = dayNum; lastPlay[g.away] = dayNum; });
          dayNum++;
          day = [];
          usedToday.clear();
          // insert an off day every 6 days
          if (dayNum % 6 === 0) {
            days.push([]);
            dayNum++;
          }
        }
      }
      if (day.length) days.push(day);
      return days;
    }

    function log(state, msg) {
      state.log.push({ day: state.day, phase: state.phase, msg });
      if (state.log.length > 400) state.log.splice(0, state.log.length - 400);
    }

    function originalsLeft(state) {
      const ros = new Set(state.rosters[String(state.userTeam)]);
      return state.originalIds.filter((id) => ros.has(id)).length;
    }

    function newGame(teamId) {
      const players = clone(DATA.players);
      const rosters = clone(DATA.rosters);
      const freeAgents = (DATA.freeAgents || []).slice();
      const state = {
        userTeam: teamId,
        day: 0,
        phase: "regular",
        season: DATA.season,
        players,
        rosters,
        freeAgents,
        standings: emptyStandings(),
        games: [],
        log: [],
        originalIds: (rosters[String(teamId)] || []).slice(),
        badges: [],
        wsWins: 0,
        schedule: [],
        playoff: null,
        cap
      };
      teams.forEach((t) => autoLineup(state, t.id));
      state.schedule = makeSchedule();
      const t = teamById[teamId];
      log(state, "You are the new GM of the " + t.name + ". Rosters are current as of " + DATA.asOf + ". Win the World Series. Ratings and contracts are unofficial estimates.");
      return state;
    }

    function simDays(state, n) {
      if (state.phase === "regular") {
        const end = Math.min(state.schedule.length, state.day + n);
        for (let d = state.day; d < end; d++) {
          const sl = state.schedule[d] || [];
          sl.forEach((g) => applyResult(state, simGame(state, g.home, g.away, d)));
        }
        state.day = end;
        if (state.day >= state.schedule.length) startPlayoffs(state);
        return;
      }
      if (state.phase === "playoffs") {
        for (let i = 0; i < n; i++) {
          if (state.phase !== "playoffs") break;
          advancePlayoffDay(state);
        }
      }
    }

    function tableFor(state, league, division) {
      return teams.filter((t) => t.league === league && (!division || t.division === division))
        .map((t) => {
          const s = state.standings[String(t.id)];
          const pct = s.gp ? s.w / s.gp : 0;
          const diff = s.rs - s.ra;
          return { ...t, ...s, pct, diff };
        })
        .sort((a, b) => b.w - a.w || b.diff - a.diff || b.rs - a.rs);
    }

    function playoffSeeds(state, league) {
      const divisions = ["East", "Central", "West"];
      const winners = divisions.map((d) => tableFor(state, league, d)[0]);
      winners.sort((a, b) => b.w - a.w || b.diff - a.diff);
      const winnerIds = new Set(winners.map((t) => t.id));
      const rest = tableFor(state, league, null).filter((t) => !winnerIds.has(t.id));
      const wc = rest.slice(0, 3);
      return winners.concat(wc); // 1-3 div, 4-6 wc
    }

    function startPlayoffs(state) {
      state.phase = "playoffs";
      const al = playoffSeeds(state, "AL");
      const nl = playoffSeeds(state, "NL");
      state.playoff = {
        round: "wc", // wc, ds, cs, ws
        day: 0,
        al, nl,
        series: [
          seriesOf(al[3], al[4], 3, "ALWC1"),
          seriesOf(al[2], al[5], 3, "ALWC2"),
          seriesOf(nl[3], nl[4], 3, "NLWC1"),
          seriesOf(nl[2], nl[5], 3, "NLWC2")
        ],
        byes: { AL: [al[0], al[1]], NL: [nl[0], nl[1]] },
        results: []
      };
      const made = al.some((t) => t.id === state.userTeam) || nl.some((t) => t.id === state.userTeam);
      if (!made) state.playoff.userExit = "missed";
      log(state, "The regular season is over. The playoffs begin.");
    }

    function seriesOf(a, b, length, name) {
      return { a: a.id, b: b.id, need: Math.ceil(length / 2), length, name, wa: 0, wb: 0, games: [], done: false, winner: null };
    }

    function playSeriesGame(state, s) {
      if (s.done) return;
      const n = s.games.length;
      // higher seed (a) gets more home: game 1 away in WC? Modern WC is at higher seed all 3. DS: 2-2-1. CS/WS: 2-3-2.
      let home, away;
      if (s.length === 3) {
        home = s.a; away = s.b; // all at higher seed
      } else if (s.length === 5) {
        const homes = [s.a, s.a, s.b, s.b, s.a];
        home = homes[n]; away = home === s.a ? s.b : s.a;
      } else {
        const homes = [s.a, s.a, s.b, s.b, s.b, s.a, s.a];
        home = homes[n]; away = home === s.a ? s.b : s.a;
      }
      const g = simGame(state, home, away, state.day);
      s.games.push(g);
      const winner = g.home > g.away ? home : away;
      if (winner === s.a) s.wa++; else s.wb++;
      if (s.wa >= s.need || s.wb >= s.need) {
        s.done = true;
        s.winner = s.wa > s.wb ? s.a : s.b;
        markUserSeries(state, s);
      }
    }

    function advancePlayoffDay(state) {
      const P = state.playoff;
      const live = P.series.filter((s) => !s.done);
      if (live.length) {
        live.forEach((s) => playSeriesGame(state, s));
        state.day++;
        return;
      }
      // all series in this round done — advance
      if (P.round === "wc") {
        const alwc = P.series.filter((s) => s.name.startsWith("AL"));
        const nlwc = P.series.filter((s) => s.name.startsWith("NL"));
        const alBye = P.byes.AL;
        const nlBye = P.byes.NL;
        // 1 vs lowest remaining, 2 vs the other
        const alW = alwc.map((s) => teamById[s.winner]).sort((a, b) => seedIndex(P.al, a.id) - seedIndex(P.al, b.id));
        const nlW = nlwc.map((s) => teamById[s.winner]).sort((a, b) => seedIndex(P.nl, a.id) - seedIndex(P.nl, b.id));
        P.series = [
          seriesOf(alBye[0], alW[alW.length - 1], 5, "ALDS1"),
          seriesOf(alBye[1], alW[0], 5, "ALDS2"),
          seriesOf(nlBye[0], nlW[nlW.length - 1], 5, "NLDS1"),
          seriesOf(nlBye[1], nlW[0], 5, "NLDS2")
        ];
        P.round = "ds";
        log(state, "The Division Series is set.");
        return;
      }
      if (P.round === "ds") {
        const al = P.series.filter((s) => s.name.startsWith("AL")).map((s) => teamById[s.winner]);
        const nl = P.series.filter((s) => s.name.startsWith("NL")).map((s) => teamById[s.winner]);
        al.sort((a, b) => seedIndex(P.al, a.id) - seedIndex(P.al, b.id));
        nl.sort((a, b) => seedIndex(P.nl, a.id) - seedIndex(P.nl, b.id));
        P.series = [
          seriesOf(al[0], al[1], 7, "ALCS"),
          seriesOf(nl[0], nl[1], 7, "NLCS")
        ];
        P.round = "cs";
        log(state, "The League Championship Series is set.");
        return;
      }
      if (P.round === "cs") {
        const al = P.series.find((s) => s.name === "ALCS");
        const nl = P.series.find((s) => s.name === "NLCS");
        // Home advantage: better regular-season record
        const A = stand(state, al.winner), N = stand(state, nl.winner);
        const homeFirst = (A.w > N.w || (A.w === N.w && A.rs - A.ra >= N.rs - N.ra)) ? teamById[al.winner] : teamById[nl.winner];
        const other = homeFirst.id === al.winner ? teamById[nl.winner] : teamById[al.winner];
        P.series = [seriesOf(homeFirst, other, 7, "WS")];
        P.round = "ws";
        log(state, "The World Series: " + homeFirst.name + " vs " + other.name + ".");
        return;
      }
      if (P.round === "ws") {
        const s = P.series[0];
        state.phase = "done";
        state.champion = s.winner;
        const champ = teamById[s.winner];
        log(state, "The " + champ.name + " win the World Series.");
        if (s.winner === state.userTeam) {
          state.wsWins++;
          if (state.badges.indexOf("ws") < 0) state.badges.push("ws");
          log(state, "You did it. The " + champ.name + " are champions.");
        }
        maybeBadge(state);
      }
    }
    function seedIndex(seeds, id) {
      return seeds.findIndex((t) => t.id === id);
    }

    function gamesBack(team, leader) {
      if (!leader) return 0;
      return ((leader.w - team.w) + (team.l - leader.l)) / 2;
    }

    function remainingOf(state, tid) {
      if (state.phase !== "regular") return 0;
      let n = 0;
      for (let i = state.day; i < state.schedule.length; i++) {
        const sl = state.schedule[i] || [];
        for (let j = 0; j < sl.length; j++) {
          const g = sl[j];
          if (g.home === tid || g.away === tid) n++;
        }
      }
      return n;
    }

    function ordinal(n) {
      const v = n % 100;
      const suf = (v > 10 && v < 14) ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[n % 10] || "th");
      return n + suf;
    }

    function fmtGB(n) {
      const v = Math.round(n * 10) / 10;
      const s = v.toFixed(1);
      return (v < 0 ? Math.abs(v).toFixed(1) + " GA" : s + " GB");
    }

    function projectedSeeds(state, league, userId, mode) {
      // mode "worst": user loses remaining, everyone else wins remaining.
      // mode "best": user wins remaining, everyone else loses remaining.
      const rows = teams.filter((t) => t.league === league).map((t) => {
        const s = state.standings[String(t.id)];
        const rem = remainingOf(state, t.id);
        let w = s.w, l = s.l;
        if (mode === "worst") {
          if (t.id === userId) l += rem;
          else w += rem;
        } else {
          if (t.id === userId) w += rem;
          else l += rem;
        }
        const gp = w + l;
        const pct = gp ? w / gp : 0;
        const diff = s.rs - s.ra;
        return { ...t, w, l, gp, pct, diff, rs: s.rs };
      });
      function sortRows(list) {
        return list.slice().sort((a, b) => b.w - a.w || b.diff - a.diff || b.rs - a.rs);
      }
      const divisions = ["East", "Central", "West"];
      const winners = divisions.map((d) => sortRows(rows.filter((t) => t.division === d))[0]);
      winners.sort((a, b) => b.w - a.w || b.diff - a.diff || b.rs - a.rs);
      const winnerIds = new Set(winners.map((t) => t.id));
      const wc = sortRows(rows.filter((t) => !winnerIds.has(t.id))).slice(0, 3);
      return winners.concat(wc);
    }

    const ROUND_LABEL = { wc: "Wild Card", ds: "Division Series", cs: "League Championship Series", ws: "World Series" };

    function markUserSeries(state, s) {
      if (!s || !s.done) return;
      if (s.a !== state.userTeam && s.b !== state.userTeam) return;
      if (s.winner !== state.userTeam && state.playoff) {
        state.playoff.userExit = state.playoff.round;
      }
    }

    function clubStatus(state) {
      const user = teamById[state.userTeam];
      const st = state.standings[String(state.userTeam)];
      const rec = (st.w || 0) + "-" + (st.l || 0);
      const divTable = tableFor(state, user.league, user.division);
      const place = divTable.findIndex((t) => t.id === state.userTeam) + 1;
      const leader = divTable[0];
      const gb = gamesBack(st, leader);
      const divName = user.league + " " + user.division;
      const played = divTable.some((t) => t.gp > 0);
      let divisionText;
      if (!played) divisionText = divName;
      else if (place === 1 && (divTable.length < 2 || gamesBack(divTable[1], leader) > 0)) divisionText = "1st in " + divName;
      else if (place !== 1 && gb === 0) divisionText = "Tied for 1st in " + divName;
      else if (place === 1) divisionText = "1st in " + divName;
      else divisionText = ordinal(place) + " in " + divName + ", " + fmtGB(gb);

      const seeds = playoffSeeds(state, user.league);
      const seedAt = seeds.findIndex((t) => t.id === state.userTeam);
      const inPlayoffs = seedAt >= 0;
      const seed = inPlayoffs ? seedAt + 1 : null;
      const wc3 = seeds[5];
      const wcGB = wc3 ? gamesBack(st, wc3) : 0;
      let playoffText = "";
      let flag = null;
      let flagKind = null;

      if (state.phase === "regular") {
        if (inPlayoffs) {
          if (seed <= 3) {
            playoffText = user.league + " #" + seed + " seed" + (seed <= 2 ? " (bye)" : "");
          } else {
            playoffText = user.league + " Wild Card #" + (seed - 3);
          }
        } else {
          playoffText = fmtGB(wcGB) + " of WC3";
        }
        if (played) {
          const worst = projectedSeeds(state, user.league, state.userTeam, "worst");
          const best = projectedSeeds(state, user.league, state.userTeam, "best");
          const worstIdx = worst.findIndex((t) => t.id === state.userTeam);
          const bestIdx = best.findIndex((t) => t.id === state.userTeam);
          function divLeader(list) {
            return list.filter((t) => t.division === user.division).sort((a, b) => b.w - a.w || b.diff - a.diff || b.rs - a.rs)[0];
          }
          const clinchedDivision = divLeader(worst).id === state.userTeam && remainingOf(state, state.userTeam) < 162;
          const clinchedPlayoff = worstIdx >= 0 && remainingOf(state, state.userTeam) < 162;
          const clinchedBye = worstIdx >= 0 && worstIdx <= 1 && remainingOf(state, state.userTeam) < 162;
          const eliminated = bestIdx < 0 && remainingOf(state, state.userTeam) < 162;
          // avoid preseason / early false flags: only if remaining is less than a full season (always true after day 0 for some teams). Require that the conclusion is real: remaining checked via projection. At the start rem=162, worst case user is 0-162 and out; best case 162-0 and in. Good — eliminated/clinched would be false early. After a few games still false. Late season works.
          if (eliminated) { flag = "Eliminated from the playoffs"; flagKind = "out"; }
          else if (clinchedBye) { flag = "Clinched a first-round bye"; flagKind = "clinch"; }
          else if (clinchedDivision) { flag = "Clinched the division"; flagKind = "clinch"; }
          else if (clinchedPlayoff) { flag = "Clinched a playoff spot"; flagKind = "clinch"; }
        }
      } else {
        const P = state.playoff || {};
        const made = (P.al || []).some((t) => t.id === state.userTeam) || (P.nl || []).some((t) => t.id === state.userTeam);
        if (state.phase === "done") {
          if (state.champion === state.userTeam) { playoffText = "World Series champions"; flag = "Champions"; flagKind = "clinch"; }
          else if (P.userExit === "ws") playoffText = "Lost the World Series";
          else if (P.userExit && P.userExit !== "missed") playoffText = "Eliminated in the " + (ROUND_LABEL[P.userExit] || P.userExit);
          else if (!made || P.userExit === "missed") playoffText = "Missed the playoffs";
          else playoffText = "Season complete";
        } else {
          if (!made || P.userExit === "missed") {
            playoffText = "Missed the playoffs";
          } else if (P.userExit) {
            playoffText = "Eliminated in the " + (ROUND_LABEL[P.userExit] || P.userExit);
            flag = "Eliminated"; flagKind = "out";
          } else {
            const series = (P.series || []).find((s) => s.a === state.userTeam || s.b === state.userTeam);
            const bye = P.round === "wc" && ((P.byes && P.byes[user.league] || []).some((t) => t.id === state.userTeam));
            if (bye) playoffText = "Bye — next up, the Division Series";
            else if (series) {
              const youA = series.a === state.userTeam;
              const youW = youA ? series.wa : series.wb;
              const themW = youA ? series.wb : series.wa;
              const opp = teamById[youA ? series.b : series.a];
              const verb = series.done ? (series.winner === state.userTeam ? "won" : "lost") : (youW > themW ? "leads" : youW < themW ? "trails" : "tied");
              playoffText = (ROUND_LABEL[P.round] || "Playoffs") + " vs the " + (opp ? opp.name : "opponent") + " (" + verb + " " + youW + "–" + themW + ")";
            } else {
              playoffText = "In the " + (ROUND_LABEL[P.round] || "playoffs");
            }
          }
        }
        divisionText = rec + " · " + divisionText;
      }

      return {
        w: st.w || 0, l: st.l || 0, gp: st.gp || 0, rec,
        place, division: divName, divisionGB: gb, divisionText,
        inPlayoffs, seed, wcGB, playoffText,
        flag, flagKind,
        phase: state.phase,
        round: state.playoff && state.playoff.round || null
      };
    }

    function maybeBadge(state) {
      if (originalsLeft(state) === 0 && state.badges.indexOf("sweep") < 0) {
        state.badges.push("sweep");
        log(state, "Clean sweep: no one from the opening-day roster is still on the club.");
      }
    }

    function simSeason(state) {
      if (state.phase === "regular") simDays(state, state.schedule.length - state.day);
    }

    const api = {
      teams,
      teamById,
      cap,
      playerValue,
      packageValue,
      teamNeeds,
      aiPosture,
      evaluateTrade,
      applyTrade,
      signFA,
      faAsk,
      faBids,
      estWar,
      release,
      autoLineup,
      newGame,
      simDays,
      simSeason,
      tableFor,
      playoffSeeds,
      clubStatus,
      gamesBack,
      remainingOf,
      originalsLeft,
      maybeBadge,
      payrollOf,
      log,
      canHit,
      canPitch,
      POS_ORDER,
      DATA
    };
    return api;
  }

  function selfTest(DATA) {
    const fails = [];
    const E = init(DATA);
    // pick Yankees or first team
    const tid = (DATA.teams.find((t) => t.abv === "NYY") || DATA.teams[0]).id;
    const state = E.newGame(tid);
    // schedule counts
    const counts = {};
    DATA.teams.forEach((t) => counts[t.id] = 0);
    (state.schedule || []).forEach((day) => day.forEach((g) => { counts[g.home]++; counts[g.away]++; }));
    const bad = Object.entries(counts).filter(([, n]) => Math.abs(n - 162) > 4);
    if (bad.length) fails.push("schedule not ~162: " + bad.map((x) => x[0] + "=" + x[1]).join(","));
    // trade: give nothing of value for their best
    const ai = DATA.teams.find((t) => t.id !== tid);
    const aiBest = state.rosters[String(ai.id)].map((id) => state.players[String(id)]).sort((a, b) => b.ovr - a.ovr)[0];
    const userScrub = state.rosters[String(tid)].map((id) => state.players[String(id)]).sort((a, b) => a.ovr - b.ovr)[0];
    const unfair = E.evaluateTrade(state, ai.id, [userScrub.id], [aiBest.id]);
    if (unfair.ok) fails.push("unfair trade was accepted: " + userScrub.name + " for " + aiBest.name);
    if (!unfair.reason) fails.push("unfair trade had no reason");
    // fair: similar value swap of mid players close in value
    const userMids = state.rosters[String(tid)].map((id) => state.players[String(id)]).filter((p) => p.ovr >= 72 && p.ovr <= 80);
    const aiMids = state.rosters[String(ai.id)].map((id) => state.players[String(id)]).filter((p) => p.ovr >= 72 && p.ovr <= 80);
    let fairOk = false;
    if (userMids.length && aiMids.length) {
      // find closest pair
      let best = null, gap = 99;
      userMids.forEach((u) => aiMids.forEach((a) => {
        const g = Math.abs(E.playerValue(u) - E.playerValue(a));
        if (g < gap) { gap = g; best = [u, a]; }
      }));
      if (best) {
        const ev = E.evaluateTrade(state, ai.id, [best[0].id], [best[1].id]);
        fairOk = ev.ok || (ev.counter && ev.counter.giveIds);
        if (!ev.ok && !ev.counter) fails.push("near-even trade had no accept or counter: " + best[0].name + " for " + best[1].name + " (" + ev.reason + ")");
      }
    }
    // junk-for-star: a pile of low-ovr pieces cannot buy their ace
    const junk = state.rosters[String(tid)].map((id) => state.players[String(id)]).filter((p) => p.ovr < 70).sort((a, b) => a.ovr - a.ovr).slice(0, 8);
    if (junk.length >= 5 && aiBest && aiBest.ovr >= 80) {
      const pile = E.evaluateTrade(state, ai.id, junk.slice(0, 6).map((p) => p.id), [aiBest.id]);
      if (pile.ok) fails.push("junk-for-star was accepted: 6 low pieces for " + aiBest.name);
    }
    // FA asks: stars, mid-tier, role, older
    function checkAsk(label, p, pred) {
      const a = E.faAsk(p);
      if (!pred(a)) fails.push(label + " ask was " + a.years + " yr / $" + a.aav + "M AAV");

(function () {
  const KEY = "gg-mlb-gm-save";

  function viewFA() {

  function toggle(set, id) { if (set.has(id)) set.delete(id); else set.add(id); }

  function swapSlots(a, b) {

      const lu = state.lineups[String(state.userTeam)];
      const tmp = lu[a.idx].id; lu[a.idx].id = lu[b.idx].id; lu[b.idx].id = tmp;
    } else if (a.kind === "rot" && b.kind === "rot") {
      const rot = state.rotations[String(state.userTeam)];
      const tmp = rot[a.idx]; rot[a.idx] = rot[b.idx]; rot[b.idx] = tmp;
    }
  }
  function putInSlot(pick, id) {
    const tid = state.userTeam;
    if (pick.kind === "lu") {
      const lu = state.lineups[String(tid)];
      const other = lu.findIndex((s) => s.id === id);
      if (other >= 0) { const tmp = lu[pick.idx].id; lu[pick.idx].id = id; lu[other].id = tmp; }
      else lu[pick.idx].id = id;
    } else if (pick.kind === "rot") {
      const rot = state.rotations[String(tid)];
      const other = rot.indexOf(id);
      if (other >= 0) { const tmp = rot[pick.idx]; rot[pick.idx] = id; rot[other] = tmp; }

          h += '<button type="button" class="team-btn" data-team="' + t.id + '"><span>' + t.name + '<div class="city">' + t.city + " · " + n + " on the 40-man</div></span><span class=\"muted\">" + t.abv + "</span></button>";
        });
        h += "</div></div>";
      });
      return h;
    }
    el("app").innerHTML = chrome().replace(' <button class="btn" id="newgame" type="button">New game</button>', "")
      + '<div class="hero"><h1>MLB GM MODE</h1>'
      + '<p>Take over any club. The 40-man rosters, ages, and 2026 stats are pulled from the public MLB Stats API and baked into this file (current as of ' + DATA.asOf + '). Ratings and contracts are unofficial estimates. Make trades and sign free agents. The other general managers will reject a bad deal. Your job is to win the World Series.</p>'
      + '<p class="fine">A tracker counts how many opening-day players are still on your roster. Replace them all and you earn a Clean Sweep badge.</p>'
      + (saved ? '<p><button class="btn primary" id="continue">Continue saved game (' + (E.teamById[saved.userTeam] ? E.teamById[saved.userTeam].name : "team") + ")</button></p>" : "")
      + '</div><div class="leagues"><div>' + col("AL") + "</div><div>" + col("NL") + "</div></div>"
      + '<p class="disclaimer">' + DATA.disclaimer + "</p></div>";
    document.querySelectorAll("[data-team]").forEach((b) => {
      b.onclick = () => {
        const id = +b.getAttribute("data-team");
        state = E.newGame(id);
        tab = "roster"; giveSel = new Set(); getSel = new Set(); tradeMsg = null; faMsg = null;
        save();
        render();
      };
    });
    const c = el("continue");
    if (c) c.onclick = () => { state = saved; tab = "roster"; render(); };
    const ng = el("newgame");
    if (ng) ng.onclick = () => { state = null; renderTitle(); };
  }

  window.__MLBGM__ = {
    get state() { return state; },
    engine: E,
    newGame: (id) => { state = E.newGame(id); render(); return state; },
    clubStatus: () => state ? E.clubStatus(state) : null,
    selfTest: () => MlbGmEngine.selfTest(DATA)
  };

  const boot = load();
  renderTitle();
})();

</script>
</body>
</html>
