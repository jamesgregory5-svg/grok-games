<!DOCTYPE html>
<html lang="en">
<head>
<script src="../../auth.js"></script>
<script>GrokAuth.requireSession();</script>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<title>2048 — Grok Games</title>
<style>
:root{--ink:#1a1714;--muted:#6a6158;--bg:#f6f1e8;--board:#bbada0;--empty:#cdc1b4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a.back{color:var(--ink);text-decoration:none;font-size:12px;letter-spacing:.04em;border-bottom:1px solid #d8d0c4}
.wrap{min-height:100%;display:flex;flex-direction:column;padding:12px 16px 16px;max-width:560px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;padding-bottom:8px}
.word{font-weight:800;letter-spacing:.08em;font-size:28px;margin:0}
.stats{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{background:#bbada0;color:#fff;border-radius:8px;padding:6px 10px;text-align:center;min-width:72px}
.pill b{display:block;font-size:18px;line-height:1.1}
.pill span{font-size:10px;letter-spacing:.08em;opacity:.85}
.btn{appearance:none;border:0;background:#8f7a66;color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit;letter-spacing:.04em}
.board-wrap{position:relative;width:min(92vw,72vh,480px);margin:12px auto 0;aspect-ratio:1}
.grid,.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:3.5%;padding:3.5%}
.cell{background:var(--empty);border-radius:8px}
.tile{border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#776e65;position:absolute;transition:transform .12s ease-in,width .12s,height .12s;z-index:1}
.tile.new{animation:pop .16s ease-out}
.tile.merge{animation:merge .16s ease-out}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
@keyframes merge{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.t2{background:#eee4da}.t4{background:#ede0c8}.t8{background:#f2b179;color:#f9f6f2}
.t16{background:#f59563;color:#f9f6f2}.t32{background:#f67c5f;color:#f9f6f2}
.t64{background:#f65e3b;color:#f9f6f2}.t128{background:#edcf72;color:#f9f6f2;font-size:.85em}
.t256{background:#edcc61;color:#f9f6f2;font-size:.85em}.t512{background:#edc850;color:#f9f6f2;font-size:.8em}
.t1024{background:#edc53f;color:#f9f6f2;font-size:.7em}.t2048{background:#edc22e;color:#f9f6f2;font-size:.7em}
.tbig{background:#3c3a32;color:#f9f6f2;font-size:.62em}
.overlay{position:absolute;inset:0;background:rgba(238,228,218,.72);display:flex;align-items:center;justify-content:center;border-radius:12px;z-index:5}
.panel{text-align:center}
.panel h2{margin:0 0 8px;font-size:32px;letter-spacing:.06em}
.fine{font-size:12px;color:var(--muted);text-align:center;margin:14px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="../../index.html">Back to Grok Games</a>
    <h1 class="word">2048</h1>
    <div class="stats">
      <div class="pill"><span>SCORE</span><b id="score">0</b></div>
      <div class="pill"><span>BEST</span><b id="best">0</b></div>
      <button class="btn" id="new">New</button>
    </div>
  </header>
  <div class="board-wrap" id="board">
    <div class="grid" id="grid"></div>
    <div class="tiles" id="tiles"></div>
  </div>
  <p class="fine">Join the numbers to make 2048. Arrows or WASD, or swipe. No undo.</p>
</div>
<script>
(function(){
  const KEY="gg-2048-best";
  const gridEl=document.getElementById("grid");
  const tilesEl=document.getElementById("tiles");
  const board=document.getElementById("board");
  for(let i=0;i<16;i++){const d=document.createElement("div");d.className="cell";gridEl.appendChild(d);}
  function loadBest(){try{const n=parseInt(localStorage.getItem(KEY)||"0",10);return Number.isFinite(n)&&n>0?n:0;}catch(e){return 0;}}
  function saveBest(n){const b=Math.max(loadBest(),n|0);try{localStorage.setItem(KEY,String(b));}catch(e){}return b;}
  function rnd(n){const a=new Uint32Array(1);const max=0x100000000;const lim=max-(max%n);let x;do{crypto.getRandomValues(a);x=a[0];}while(x>=lim);return x%n;}
  function rand(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/0x100000000;}

  let cells,score,best=loadBest(),won,over,lock,idSeq=1;
  document.getElementById("best").textContent=best;

  function empty(){return Array.from({length:4},()=>Array(4).fill(null));}
  function empties(){const o=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!cells[r][c])o.push([r,c]);return o;}
  function spawn(){
    const e=empties();if(!e.length)return;
    const [r,c]=e[rnd(e.length)];
    cells[r][c]={id:idSeq++,v:rand()<0.9?2:4,r,c,born:true,merged:false};
  }
  function canMove(){
    if(empties().length)return true;
    for(let r=0;r<4;r++)for(let c=0;c<4;c++){
      const v=cells[r][c].v;
      if(c<3&&cells[r][c+1].v===v)return true;
      if(r<3&&cells[r+1][c].v===v)return true;
    }
    return false;
  }
  function slide(dir){
    // dir: 0 L, 1 R, 2 U, 3 D
    const moved=false;
    let any=false, gained=0;
    const order=[];
    for(let r=0;r<4;r++)for(let c=0;c<4;c++)order.push([r,c]);
    if(dir===1)order.reverse();
    if(dir===3)order.sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
    if(dir===2)order.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
    const dr=[0,0,-1,1][dir], dc=[-1,1,0,0][dir];
    const merged=new Set();
    for(const [r0,c0] of order){
      const t=cells[r0][c0];if(!t)continue;
      let r=r0,c=c0;
      while(true){
        const nr=r+dr,nc=c+dc;
        if(nr<0||nc<0||nr>3||nc>3)break;
        if(!cells[nr][nc]){r=nr;c=nc;continue;}
        if(cells[nr][nc].v===t.v&&!merged.has(cells[nr][nc].id)&&!merged.has(t.id)){
          r=nr;c=nc;
          const keep=cells[r][c];
          cells[r0][c0]=null;
          keep.v*=2;keep.merged=true;keep.born=false;
          merged.add(keep.id);
          gained+=keep.v;
          if(keep.v===2048)won=true;
          any=true;
          t.gone=true;
        }
        break;
      }
      if(!t.gone && (r!==r0||c!==c0)){
        cells[r0][c0]=null;
        cells[r][c]=t;t.r=r;t.c=c;
        any=true;
      }else if(!t.gone){t.r=r0;t.c=c0;}
    }
    return {any,gained};
  }
  function tileClass(v){
    if(v<=2048)return "t"+v;
    return "tbig";
  }
  function layout(){
    const wrap=board.getBoundingClientRect();
    const pad=wrap.width*0.035, gap=wrap.width*0.035, inner=wrap.width-2*pad;
    const size=(inner-3*gap)/4;
    return {pad,gap,size};
  }
  function render(anim){
    document.getElementById("score").textContent=score;
    document.getElementById("best").textContent=best;
    const {pad,gap,size}=layout();
    const live=[];
    for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(cells[r][c])live.push(cells[r][c]);
    tilesEl.querySelectorAll(".tile").forEach(n=>{
      const id=+n.dataset.id;
      if(!live.some(t=>t.id===id))n.remove();
    });
    for(const t of live){
      let n=tilesEl.querySelector('[data-id="'+t.id+'"]');
      if(!n){
        n=document.createElement("div");
        n.className="tile "+tileClass(t.v)+(t.born?" new":"");
        n.dataset.id=t.id;
        tilesEl.appendChild(n);
      }else{
        n.className="tile "+tileClass(t.v)+(t.merged?" merge":"");
      }
      n.textContent=t.v;
      n.style.width=n.style.height=size+"px";
      n.style.fontSize=t.v>=1024?"calc("+size+"px * .32)":"calc("+size+"px * .42)";
      const x=pad+t.c*(size+gap), y=pad+t.r*(size+gap);
      n.style.transform="translate("+x+"px,"+y+"px)";
      t.born=false;t.merged=false;
    }
    let ov=document.getElementById("ov");
    if(over|| (won && !document.body.dataset.keep)){
      if(!ov){
        ov=document.createElement("div");ov.id="ov";ov.className="overlay";
        board.appendChild(ov);
      }
      if(over){
        ov.innerHTML='<div class="panel"><h2>Game over</h2><p>Score '+score+' · Best '+best+'</p><button class="btn" id="again">New game</button></div>';
        ov.querySelector("#again").onclick=newGame;
      }else if(won && !ov.dataset.won){
        ov.dataset.won="1";
        ov.innerHTML='<div class="panel"><h2>2048</h2><p>You made it. Keep going or start over.</p><button class="btn" id="keep">Keep going</button> <button class="btn" id="again">New game</button></div>';
        ov.querySelector("#keep").onclick=()=>{document.body.dataset.keep="1";ov.remove();};
        ov.querySelector("#again").onclick=newGame;
      }
    }else if(ov && over===false && document.body.dataset.keep){/* keep */}
  }
  function move(dir){
    if(over||lock)return;
    for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(cells[r][c]){cells[r][c].gone=false;cells[r][c].merged=false;}
    const {any,gained}=slide(dir);
    if(!any)return;
    score+=gained;
    best=saveBest(score);
    spawn();
    if(!canMove())over=true;
    render(true);
  }
  function newGame(){
    document.body.dataset.keep="";
    const ov=document.getElementById("ov");if(ov)ov.remove();
    cells=empty();score=0;won=false;over=false;idSeq=1;
    spawn();spawn();
    render(false);
  }
  const keymap={ArrowLeft:0,a:0,A:0,ArrowRight:1,d:1,D:1,ArrowUp:2,w:2,W:2,ArrowDown:3,s:3,S:3};
  document.addEventListener("keydown",e=>{
    if(!(e.key in keymap))return;
    e.preventDefault();
    move(keymap[e.key]);
  });
  let sx,sy;
  board.addEventListener("touchstart",e=>{const t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;},{passive:true});
  board.addEventListener("touchend",e=>{
    const t=e.changedTouches[0];
    const dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.hypot(dx,dy)<24)return;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:0);else move(dy>0?3:2);
  },{passive:true});
  document.getElementById("new").onclick=newGame;
  window.addEventListener("resize",()=>render(false));
  window.__G2048__={newGame,get state(){return {score,best,over,won,cells:cells.map(row=>row.map(t=>t&&t.v))};},move};
  newGame();
})();
</script>
</body>
</html>
